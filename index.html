const LS={
  load:(k,fb)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):fb;}catch{return fb;}},
  save:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const initMechDb=()=>Object.fromEntries(MECH_KEYS.map(k=>[k,[]]));
const initIacDb=()=>Object.fromEntries(IAC_KEYS.map(k=>[k,[]]));

/* ── Generic helpers ── */
const inp=(e={})=>({background:BG,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 11px",color:TXT,fontSize:13,width:"100%",fontFamily:"inherit",outline:"none",...e});

function Dot({color,size=8}){return <span style={{width:size,height:size,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>;}
function Badge({label,color,bg}){return <span style={{background:bg,color,fontSize:10,padding:"3px 8px",borderRadius:5,fontWeight:600,whiteSpace:"nowrap"}}>{label}</span>;}

function FieldInput({f,val,err,onChange}){
  const s=inp({border:`1px solid ${err?DNG:BDR2}`});
  return(<div>
    <label style={{fontSize:10,color:err?DNG:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>{f.l}{f.req?" *":""}</label>
    {f.t==="sel"?<select value={val} onChange={e=>onChange(e.target.value)} style={{...s,cursor:"pointer"}}><option value="">— Select —</option>{f.o.map(o=><option key={o} value={o}>{o}</option>)}</select>

}

function NavItem({label,active,color,count,onClick,indent=false,italic=false}){

function SecLabel({label,color}){

/* ── Add New Type Modal ── */
function NewTypeModal({dept,onAdd,onClose}){
  const[name,setName]=useState("");
  const[prefix,setPrefix]=useState("");
  const[color,setColor]=useState(dept==="mech"?"#64748b":"#7c3aed");
  const[template,setTemplate]=useState(dept==="mech"?"mechanical":"transmitter");
  const colors=["#3b82f6","#8b5cf6","#10b981","#f59e0b","#ef4444","#06b6d4","#ec4899","#84cc16","#f97316","#14b8a6","#64748b","#7c3aed"];
  const handleAdd=()=>{
    if(!name.trim()||!prefix.trim())return;
    const key=`custom_${Date.now()}`;
    const baseFields=[...CUSTOM_TEMPLATES[template]];
    const finalFields=dept==="iac"?[...baseFields,...IO_FIELDS]:baseFields;
    onAdd(key,{label:name.trim(),prefix:prefix.trim().toUpperCase(),color,fields:finalFields,summary:["description","service","location","status"],custom:true});
    onClose();
  };
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}} onClick={onClose}>
    <div style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:14,padding:24,width:440,maxWidth:"92vw"}} onClick={e=>e.stopPropagation()}>
      <h2 style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:dept==="mech"?MC:IC,marginBottom:4}}>New Equipment Type</h2>
      <p style={{color:DIM,fontSize:11,marginBottom:18}}>Add a custom type to the {dept==="mech"?"Mechanics":"I&C"} department</p>
      <div style={{display:"grid",gap:12}}>
        <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>Type Name *</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Chlorinators" style={inp()}/>
        </div>
        <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>Tag Prefix *</label>
          <input value={prefix} onChange={e=>setPrefix(e.target.value.toUpperCase())} placeholder="e.g. CL" style={inp({fontFamily:"monospace",fontWeight:700})}/>
        </div>
        <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:6,fontWeight:600}}>Field Template</label>
          <div style={{display:"flex",gap:6}}>
            {(dept==="mech"?["mechanical"]:["transmitter","switch"]).map(t=>(
              <button key={t} onClick={()=>setTemplate(t)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${template===t?(dept==="mech"?MC:IC):BDR2}`,background:template===t?`${dept==="mech"?MC:IC}18`:CRD,color:template===t?(dept==="mech"?MC:IC):DIM,fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:template===t?600:400,textTransform:"capitalize"}}>{t}</button>
            ))}
          </div>
        </div>
        <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:6,fontWeight:600}}>Color</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {colors.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:24,height:24,borderRadius:"50%",background:c,border:`2px solid ${color===c?"white":"transparent"}`,cursor:"pointer"}}/>)}
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:7,justifyContent:"flex-end",marginTop:20}}>
        <button onClick={onClose} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
        <button onClick={handleAdd} disabled={!name.trim()||!prefix.trim()} style={{background:dept==="mech"?MC:IC,border:"none",borderRadius:7,padding:"7px 18px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:!name.trim()||!prefix.trim()?0.5:1}}>+ Create Type</button>
      </div>
    </div>
  </div>);
}

/* ── Equipment Table ── */
function EqTable({dept,typeKey,def,allItems,displayed,q,setQ,stF,setStF,sort,setSort,onAdd,onEdit,onDel}){
  const[hr,sHR]=useState(null);
  const sumFields=def.fields.filter(f=>def.summary.includes(f.k));
  const deptColor=dept==="mech"?MC:IC;
  return(<div className="fade">
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
          <Dot color={def.color} size={10}/>
          <h1 style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:TXT}}>{def.label}</h1>
          <span style={{fontSize:10,color:deptColor,background:`${deptColor}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>{dept==="mech"?"MECHANICS":"I&C"}</span>
          {def.custom&&<span style={{fontSize:9,color:def.color,background:`${def.color}15`,padding:"2px 6px",borderRadius:4}}>custom type</span>}
        </div>
        <p style={{color:DIM,fontSize:11}}>{allItems.length} registered · {displayed.length} shown · prefix <span style={{color:MUT,fontFamily:"monospace"}}>{def.prefix}-XXX</span></p>
      </div>

    </div>

    <div style={{display:"flex",gap:7,marginBottom:11}}>
      <div style={{flex:1,position:"relative"}}>
        <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:DIM,pointerEvents:"none"}}>🔍</span>

      </div>
      <select value={stF} onChange={e=>setStF(e.target.value)} style={inp({width:"auto",background:CRD,border:`1px solid ${BDR}`,cursor:"pointer",color:stF==="All"?DIM:TXT})}>

      <div style={{fontSize:32,marginBottom:10,opacity:.2}}>○</div>
      <div style={{fontSize:14,color:MUT,marginBottom:4}}>{allItems.length===0?`No ${def.label} registered yet`:"No items match"}</div>
      {allItems.length===0&&<button onClick={onAdd} style={{marginTop:12,background:def.color,border:"none",borderRadius:8,padding:"8px 18px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ Add first {def.label.replace(/s$/,"")}</button>}
    </div>):(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>

            <th key={f.k} onClick={()=>setSort(p=>({k:f.k,d:p.k===f.k&&p.d==="asc"?"desc":"asc"}))}
              style={{padding:"8px 11px",textAlign:"left",fontSize:10,cursor:"pointer",userSelect:"none",color:sort.k===f.k?def.color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>
              {f.l}{sort.k===f.k?(sort.d==="asc"?" ↑":" ↓"):""}
            </th>))}
          <th style={{padding:"8px 11px",textAlign:"right",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em"}}>Actions</th>
        </tr></thead>
        <tbody>{displayed.map((item,di)=>{
          const ri=allItems.indexOf(item);
          const sc=STC[item.status]||{c:MUT,b:BDR};
          const sigC=SIGC[item.signalType]||null;
          return(<tr key={item.tagName} onMouseEnter={()=>sHR(di)} onMouseLeave={()=>sHR(null)} style={{borderBottom:`1px solid ${BDR}`,background:hr===di?`${CRD}bb`:"transparent"}}>
            <td style={{padding:"10px 11px",fontFamily:"monospace",fontSize:13,fontWeight:600,color:def.color,whiteSpace:"nowrap"}}>{item.tagName}</td>

              if(f.k==="ioTag"&&v)return<td key={f.k} style={{padding:"10px 11px",fontSize:12,color:ACC,fontFamily:"monospace",fontWeight:600}}>{v}</td>;

              <button onClick={()=>onEdit(item,ri)} style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 8px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,fontFamily:"inherit"}}>✎ Edit</button>

            </td>
          </tr>);

      </table></div>
      <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}>
        <span>Showing {displayed.length} of {allItems.length}</span>
        <span>{allItems.filter(i=>i.status==="Active").length} active{dept==="iac"?` · ${allItems.filter(i=>i.ioTag).length} IO assigned`:""}</span>
      </div>
    </div>)}
  </div>);
}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
            <Dot color={color} size={10}/>
            <h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:16,color}}>{modal.mode==="add"?`New ${def?.label?.replace(/s$/,"")}`:`Edit ${form.tagName}`}</h2>
          </div>
          <p style={{color:DIM,fontSize:10}}>Prefix: <span style={{color:MUT,fontFamily:"monospace"}}>{def?.prefix}-XXX</span></p>
        </div>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"5px 9px",color:MUT,cursor:"pointer"}}>✕</button>
      </div>

      {/* Tag Name */}
      <div style={{background:CRD,border:`1px solid ${color}44`,borderRadius:8,padding:13,marginBottom:14}}>
        <label style={{fontSize:10,color,textTransform:"uppercase",letterSpacing:"0.1em",display:"block",marginBottom:5,fontWeight:600}}>Tag Name *</label>
        <input value={form.tagName||""} onChange={e=>onChange("tagName",e.target.value.toUpperCase())} placeholder={`e.g. ${def?.prefix}-001`}
          style={{width:"100%",background:SRF,border:`1px solid ${errs.tagName?DNG:BDR2}`,borderRadius:6,padding:"8px 12px",color:TXT,fontSize:14,fontFamily:"monospace",fontWeight:700,outline:"none"}}/>
        {errs.tagName&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{errs.tagName}</p>}
      </div>

      {/* Regular fields */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,flex:1}}>
        {def?.fields?.map(f=><div key={f.k} style={{gridColumn:f.t==="area"?"span 2":"span 1"}}><FieldInput f={f} val={form[f.k]||""} err={errs[f.k]} onChange={v=>onChange(f.k,v)}/></div>)}
      </div>

      <div style={{display:"flex",gap:7,justifyContent:"flex-end",paddingTop:15,marginTop:15,borderTop:`1px solid ${BDR}`,flexShrink:0}}>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 15px",color:MUT,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Cancel</button>
        <button onClick={onSave} style={{background:color,border:"none",borderRadius:7,padding:"7px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
          {modal.mode==="add"?"+ Add":"Save Changes"}
        </button>
      </div>
    </div>
  </div>);
}

/* ── Main App ── */
function App(){
  const[project,setProject]=useState(()=>LS.load("ab_proj_v4","Water Treatment Plant — Project Alpha"));
  const[editP,setEditP]=useState(false);
  const[tmpP,setTmpP]=useState("");
  const[mechDb,setMechDb]=useState(()=>LS.load("ab_mech_v4",initMechDb()));
  const[iacDb,setIacDb]=useState(()=>LS.load("ab_iac_v4",initIacDb()));
  const[customDefs,setCustomDefs]=useState(()=>LS.load("ab_cdefs_v4",{mech:{},iac:{}}));
  const[view,setView]=useState(null);// {dept,typeKey} or null
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[errs,setErrs]=useState({});
  const[q,setQ]=useState("");
  const[stF,setStF]=useState("All");
  const[sort,setSort]=useState({k:"tagName",d:"asc"});
  const[toast,setToast]=useState(null);
  const[delC,setDel]=useState(null);
  const[newTypeModal,setNewTypeModal]=useState(null);// "mech"|"iac"
  const mRef=useRef(null),iRef=useRef(null);

  useEffect(()=>LS.save("ab_proj_v4",project),[project]);
  useEffect(()=>LS.save("ab_mech_v4",mechDb),[mechDb]);
  useEffect(()=>LS.save("ab_iac_v4",iacDb),[iacDb]);
  useEffect(()=>LS.save("ab_cdefs_v4",customDefs),[customDefs]);

  const allDefs=useMemo(()=>({...MECH_DEF,...(customDefs.mech||{}),...IAC_DEF,...(customDefs.iac||{})}),[customDefs]);
  const allTags=useMemo(()=>[...Object.values(mechDb).flat(),...Object.values(iacDb).flat()].map(e=>e.tagName?.toUpperCase()),[mechDb,iacDb]);

  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);},[]);

  const getDb=(dept)=>dept==="mech"?mechDb:iacDb;
  const setDb=(dept,v)=>dept==="mech"?setMechDb(v):setIacDb(v);

  const openAdd=(dept,typeKey)=>{setForm({status:"Active"});setErrs({});setModal({mode:"add",dept,typeKey});};
  const openEdit=(dept,typeKey,item,idx)=>{setForm({...item});setErrs({});setModal({mode:"edit",dept,typeKey,item,idx});};
  const closeModal=()=>{setModal(null);setForm({});setErrs({});};

  const getDef=(dept,typeKey)=>{
    if(dept==="mech")return MECH_DEF[typeKey]||(customDefs.mech||{})[typeKey];
    return IAC_DEF[typeKey]||(customDefs.iac||{})[typeKey];
  };

  const validate=()=>{
    const e={},tag=(form.tagName||"").trim().toUpperCase();
    if(!tag){e.tagName="Tag name is required";}
    else{const others=modal.mode==="edit"?allTags.filter(t=>t!==modal.item?.tagName?.toUpperCase()):allTags;if(others.includes(tag))e.tagName="Tag name already exists";}
    const def=getDef(modal.dept,modal.typeKey);
    (def?.fields||[]).forEach(f=>{if(f.req&&!form[f.k]?.trim())e[f.k]=`${f.l} is required`;});
    setErrs(e);return!Object.keys(e).length;
  };

  const saveItem=()=>{
    if(!validate())return;
    const item={...form,tagName:(form.tagName||"").trim().toUpperCase()};
    const db=getDb(modal.dept);
    const upd={...db,[modal.typeKey]:[...(db[modal.typeKey]||[])]};
    if(modal.mode==="add")upd[modal.typeKey].push(item);
    else upd[modal.typeKey][modal.idx]=item;
    setDb(modal.dept,upd);
    showToast(modal.mode==="add"?`${item.tagName} added`:`${item.tagName} updated`);
    closeModal();
  };

  const confirmDel=()=>{
    const{dept,typeKey,idx,tag}=delC;
    const db=getDb(dept);
    const upd={...db,[typeKey]:[...(db[typeKey]||[])]};
    upd[typeKey].splice(idx,1);
    setDb(dept,upd);
    showToast(`${tag} removed`,"info");setDel(null);
  };

  const addCustomType=(dept,key,def)=>{
    setCustomDefs(p=>({...p,[dept]:{...(p[dept]||{}),[key]:def}}));
    if(dept==="mech")setMechDb(p=>({...p,[key]:[]}));
    else setIacDb(p=>({...p,[key]:[]}));
    showToast(`${def.label} type added`);
  };

  /* ── Excel exports ── */
  const exportDept=(dept)=>{
    const wb=XLSX.utils.book_new();
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const db=getDb(dept);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      [`AQUABASE — ${dept==="mech"?"MECHANICS":"I&C"} EXPORT`],["Project:",project],["Exported:",new Date().toLocaleString()],[],
      ["Equipment Type","Count"],...Object.entries(defs).map(([k,d])=>[d.label,(db[k]||[]).length])
    ]),"Summary");
    Object.entries(defs).forEach(([k,def])=>{
      const items=db[k]||[];if(!items.length)return;
      const h=["Tag Name",...def.fields.map(f=>f.l)];
      const r=items.map(i=>[i.tagName,...def.fields.map(f=>i[f.k]??"")]);
      const ws=XLSX.utils.aoa_to_sheet([h,...r]);ws["!cols"]=h.map((_,i)=>({wch:i===0?14:i===1?28:16}));
      XLSX.utils.book_append_sheet(wb,ws,def.label.substring(0,31));
    });
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_${dept==="mech"?"MECHANICS":"IAC"}.xlsx`);
    showToast(`${dept==="mech"?"Mechanics":"I&C"} exported`);
  };

  const exportIOList=()=>{
    const wb=XLSX.utils.book_new();
    const rows=[];
    const header=["Tag","Description","Dept","Type","Signal Type","IO Tag","Cabinet/PLC","Rack","Slot","Channel","Eng. Unit","Range Min","Range Max","Alarm LL","Alarm L","Alarm H","Alarm HH","P&ID Ref","Location","Status"];
    // I&C instruments
    const iacDefs={...IAC_DEF,...(customDefs.iac||{})};
    Object.entries(iacDefs).forEach(([k,def])=>{
      (iacDb[k]||[]).forEach(item=>{
        rows.push([item.tagName,item.description||"","I&C",def.label,item.signalType||"",item.ioTag||"",item.plcCabinet||"",item.ioRack||"",item.ioSlot||"",item.ioChannel||"",item.engUnit||"",item.rangeMin||"",item.rangeMax||"",item.alarmLL||"",item.alarmL||"",item.alarmH||"",item.alarmHH||"",item.pidRef||"",item.location||"",item.status||""]);
      });
    });
    // Mechanics (solenoids have digital output)
    (mechDb.solenoid||[]).forEach(item=>{rows.push([item.tagName,item.description||"","MECH","Solenoid Valve","DO",item.ioTag||"",item.plcCabinet||"","","","","","","","","","","",item.pidRef||"",item.location||"",item.status||""]);});
    if(!rows.length){showToast("No IO data to export — add instruments with IO tags first","warning");return;}
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
    ws["!cols"]=header.map((_,i)=>({wch:i===0?14:i===1?28:14}));
    XLSX.utils.book_append_sheet(wb,ws,"IO List");
    // Summary by signal type
    const sigs=["AI","AO","DI","DO","HART AI","HART AO","Pulse"];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      ["AQUABASE — IO LIST SUMMARY"],["Project:",project],["Generated:",new Date().toLocaleString()],[],
      ["Signal Type","Count"],...sigs.map(s=>[s,rows.filter(r=>r[4]===s).length]),["",""],["TOTAL",rows.length]
    ]),"Summary");
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_IO_List.xlsx`);
    showToast(`IO List exported — ${rows.length} channels`);
  };

  /* ── Imports ── */
  const importDept=(dept,e)=>{
    const file=e.target.files[0];if(!file)return;
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const reader=new FileReader();
    reader.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:"binary"});let a=0,s=0;
      const curTags=new Set(allTags);
      const db=getDb(dept);const upd={...db};
      Object.entries(defs).forEach(([k,def])=>{
        const sh=wb.SheetNames.find(n=>n.toLowerCase().includes(def.label.toLowerCase().slice(0,5)));if(!sh)return;
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});if(rows.length<2)return;
        const hd=rows[0];if(!upd[k])upd[k]=[];
        rows.slice(1).forEach(row=>{if(!row[0])return;const tag=String(row[0]).toUpperCase().trim();if(curTags.has(tag)){s++;return;}
          const item={tagName:tag};hd.forEach((h,i)=>{if(h==="Tag Name")return;const field=def.fields.find(f=>f.l===h);if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";});
          upd[k].push(item);curTags.add(tag);a++;});
      });
      setDb(dept,upd);showToast(`${a} added${s?`, ${s} skipped`:""}`,a?"success":"warning");
    }catch{showToast("Import failed","error");}};
    reader.readAsBinaryString(file);e.target.value="";
  };

  /* ── Displayed items ── */
  const currentDef=view?getDef(view.dept,view.typeKey):null;
  const currentItems=view?(getDb(view.dept)[view.typeKey]||[]):[];
  const displayed=useMemo(()=>{
    if(!view)return[];
    let l=[...currentItems];
    if(q){const lq=q.toLowerCase();l=l.filter(i=>Object.values(i).some(v=>String(v).toLowerCase().includes(lq)));}
    if(stF!=="All")l=l.filter(i=>i.status===stF);
    l.sort((a,b)=>{const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);});
    return l;
  },[view,currentItems,q,stF,sort]);

  const navTo=(dept,typeKey)=>{setView({dept,typeKey});setQ("");setStF("All");setSort({k:"tagName",d:"asc"});};

  const mechDefs={...MECH_DEF,...(customDefs.mech||{})};
  const iacDefs={...IAC_DEF,...(customDefs.iac||{})};

  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",background:BG,color:TXT,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}}>

    {/* HEADER */}
    <header style={{height:54,background:SRF,borderBottom:`1px solid ${BDR}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:30,height:30,background:`linear-gradient(135deg,${ACC},#0369a1)`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>💧</div>
          <div><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:ACC}}>AquaBase</div><div style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em"}}>Equipment Registry</div></div>
        </div>
        <div style={{width:1,height:26,background:BDR}}/>
        {editP?<input autoFocus value={tmpP} onChange={e=>setTmpP(e.target.value)} onBlur={()=>{setProject(tmpP);setEditP(false);}} onKeyDown={e=>{if(e.key==="Enter"){setProject(tmpP);setEditP(false);}if(e.key==="Escape")setEditP(false);}} style={{background:CRD,border:`1px solid ${ACC}`,borderRadius:6,padding:"3px 9px",color:TXT,fontSize:12,fontWeight:500,minWidth:240,outline:"none"}}/>
        :<button onClick={()=>{setTmpP(project);setEditP(true);}} style={{background:"none",border:"none",color:TXT,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"2px 5px",borderRadius:5}}>{project} ✏</button>}
      </div>
      <span style={{fontSize:10,color:DIM}}>Use dept Import/Export buttons on Overview · IO List is a generated output</span>
    </header>

    {/* BODY */}
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* SIDEBAR */}
      <nav style={{width:204,background:SRF,borderRight:`1px solid ${BDR}`,overflowY:"auto",flexShrink:0,paddingBottom:16}}>
        <NavItem label="Overview" active={!view} color={ACC}
          count={Object.values({...mechDb,...iacDb}).flat().length}
          onClick={()=>setView(null)}/>
        <SecLabel label="Mechanics" color={MC}/>
        {Object.entries(mechDefs).map(([k,def])=>(
          <NavItem key={k} label={def.label} active={view?.dept==="mech"&&view?.typeKey===k}
            color={def.color} count={mechDb[k]?.length||0} onClick={()=>navTo("mech",k)} indent italic={def.custom}/>
        ))}
        <button onClick={()=>setNewTypeModal("mech")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${MC}33`,borderRadius:6,padding:"5px",color:MC,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>+ New type</button>
        <SecLabel label="I&C" color={IC}/>
        {Object.entries(iacDefs).map(([k,def])=>(
          <NavItem key={k} label={def.label} active={view?.dept==="iac"&&view?.typeKey===k}
            color={def.color} count={iacDb[k]?.length||0} onClick={()=>navTo("iac",k)} indent italic={def.custom}/>
        ))}
        <button onClick={()=>setNewTypeModal("iac")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${IC}33`,borderRadius:6,padding:"5px",color:IC,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>+ New type</button>
      </nav>

      {/* MAIN */}
      <main style={{flex:1,overflowY:"auto",padding:20,background:BG}}>
        {!view?(
          <Overview mechDb={mechDb} iacDb={iacDb} customDefs={customDefs} onNav={navTo}
            onAddType={(dept)=>setNewTypeModal(dept)}
            onMI={(e)=>importDept("mech",e)} onME={()=>exportDept("mech")}
            onII={(e)=>importDept("iac",e)}  onIE={()=>exportDept("iac")}
            onExportIO={exportIOList} mRef={mRef} iRef={iRef}/>
        ):(
          <EqTable dept={view.dept} typeKey={view.typeKey} def={currentDef}
            allItems={currentItems} displayed={displayed}
            q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort}
            onAdd={()=>openAdd(view.dept,view.typeKey)}
            onEdit={(item,idx)=>openEdit(view.dept,view.typeKey,item,idx)}
            onDel={(item,idx)=>setDel({dept:view.dept,typeKey:view.typeKey,idx,tag:item.tagName})}/>
        )}
      </main>
    </div>

    {/* ITEM MODAL */}
    {modal&&<ItemModal def={getDef(modal.dept,modal.typeKey)} dept={modal.dept} modal={modal} form={form} errs={errs}
      onChange={(k,v)=>{setForm(p=>({...p,[k]:v}));if(errs[k])setErrs(p=>({...p,[k]:null}));}}
      onSave={saveItem} onClose={closeModal}/>}

    {/* NEW TYPE MODAL */}
    {newTypeModal&&<NewTypeModal dept={newTypeModal} onAdd={(key,def)=>addCustomType(newTypeModal,key,def)} onClose={()=>setNewTypeModal(null)}/>}

    {/* DELETE CONFIRM */}
    {delC&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}>
      <div style={{background:CRD,border:`1px solid ${DNG}55`,borderRadius:11,padding:22,maxWidth:360,width:"92%"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}><span style={{fontSize:18,color:DNG}}>🗑</span><h3 style={{color:DNG,fontSize:15,fontWeight:600}}>Delete Item</h3></div>
        <p style={{color:MUT,fontSize:13,lineHeight:1.6,marginBottom:18}}>Permanently remove <strong style={{color:TXT,fontFamily:"monospace"}}>{delC.tag}</strong>?</p>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
          <button onClick={()=>setDel(null)} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
          <button onClick={confirmDel} style={{background:DNG,border:"none",borderRadius:7,padding:"7px 15px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>
        </div>
      </div>
    </div>}

    {/* TOAST */}
    {toast&&<div style={{position:"fixed",bottom:18,right:18,background:toast.type==="error"?DNG:toast.type==="info"?ACC:toast.type==="warning"?WRN:SUC,color:"#fff",padding:"10px 16px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:900,fontSize:13,fontWeight:500}}>
      {toast.msg}
    </div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
