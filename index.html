function Dot({ color, size = 8 }) {
  return (
    <span style={{
      width: size, height: size, borderRadius: "50%",
      background: color, display: "inline-block", flexShrink: 0,
    }} />
  );
}

function Badge({ label, color, bg }) {
  return (
    <span style={{
      background: bg, color, fontSize: 10,
      padding: "3px 8px", borderRadius: 5, fontWeight: 600, whiteSpace: "nowrap",
    }}>
      {label}
    </span>
  );
}

function FieldInput({ f, val, err, onChange }) {
  const style = inp({ border: `1px solid ${err ? DNG : BDR2}` });
  return (
    <div>
      <label style={{ fontSize: 10, color: err ? DNG : DIM, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 3, fontWeight: 600 }}>
        {f.l}{f.req ? " *" : ""}
      </label>
      {f.t === "sel" ? (
        <select value={val} onChange={e => onChange(e.target.value)} style={{ ...style, cursor: "pointer" }}>
          <option value="">-- Select --</option>
          {f.o.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : f.t === "area" ? (
        <textarea value={val} onChange={e => onChange(e.target.value)} rows={3} style={{ ...style, resize: "vertical" }} />
      ) : (
        <input type={f.t === "num" ? "number" : "text"} value={val} onChange={e => onChange(e.target.value)} style={style} />
      )}
      {err && <p style={{ color: DNG, fontSize: 11, marginTop: 3 }}>{err}</p>}
    </div>
  );
}

function NavItem({ label, active, color, count, onClick, indent = false }) {
  const [hov, setHov] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        width: "100%", textAlign: "left",
        background: active ? `${color}14` : hov ? CRD : "transparent",
        border: "none", borderLeft: `3px solid ${active ? color : "transparent"}`,
        padding: `8px 13px 8px ${indent ? 22 : 13}px`,
        color: active ? color : hov ? MUT : DIM,
        fontSize: 11, fontWeight: active ? 600 : 400,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        cursor: "pointer", fontFamily: "inherit",
      }}
    >
      <span>{label}</span>
      {count > 0 && (
        <span style={{
          background: active ? `${color}25` : BDR,
          color: active ? color : DIM,
          fontSize: 10, padding: "1px 6px", borderRadius: 10, fontWeight: 700, fontFamily: "monospace",
        }}>{count}</span>
      )}
    </button>
  );
}

/* ══════════════════════════════════════
   PROBES PANEL (inside motor / pump modal)
══════════════════════════════════════ */
function ProbesPanel({ probes, onChange }) {
  const addProbe = () => {
    const type = "Vibration Sensor";
    const def  = PROBE_TYPES[type];
    onChange([...probes, {
      id: "p" + Date.now(), type, position: "",
      sensorType: def.sensors[0],
      // IO fields below are filled by I&C in the ProbesView
      code: "", sig: def.sig,
      cabinet: "", plcId: "", remoteIO: "", cardSlot: "", ioChannel: "",
    }]);
  };

  const upd = (id, k, v) => onChange(probes.map(p => p.id === id ? { ...p, [k]: v } : p));
  const del = (id)        => onChange(probes.filter(p => p.id !== id));

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ color: MUT, fontSize: 12, fontWeight: 600 }}>Probes attached to this equipment</span>
        <span style={{ fontSize: 11, color: DIM }}>IO assignment is done by I&C in their Probes section</span>
        <button onClick={addProbe}
          style={{ background: SUC, border: "none", borderRadius: 6, padding: "5px 11px", color: "#fff", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 4 }}>
          <Plus size={11} /> Add Probe
        </button>
      </div>

      {probes.length === 0 && (
        <div style={{ textAlign: "center", padding: 20, color: DIM, fontSize: 12, border: `1px dashed ${BDR2}`, borderRadius: 8 }}>
          No probes defined. Click "+ Add Probe" to start.
        </div>
      )}

      {probes.map((p, i) => {
        const def = PROBE_TYPES[p.type] || { sig: "AI", sensors: [] };
        return (
          <div key={p.id} style={{ background: CRD, border: `1px solid ${BDR2}`, borderRadius: 9, padding: 14, marginBottom: 8, position: "relative" }}>
            <button onClick={() => del(p.id)}
              style={{ position: "absolute", top: 8, right: 8, background: "transparent", border: "none", color: DIM, cursor: "pointer" }}>
              <X size={13} />
            </button>
            <div style={{ color: MC, fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>
              Probe #{i + 1} — Mechanics scope only
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Probe Type</label>
                <select value={p.type}
                  onChange={e => {
                    const t = e.target.value;
                    const d = PROBE_TYPES[t] || { sig: "AI", sensors: [] };
                    onChange(probes.map(pr =>
                      pr.id === p.id
                        ? { ...pr, type: t, sensorType: d.sensors[0] || "", sig: d.sig }
                        : pr
                    ));
                  }}
                  style={inp({ cursor: "pointer" })}>
                  {Object.keys(PROBE_TYPES).map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Sensor Type</label>
                <select value={p.sensorType} onChange={e => upd(p.id, "sensorType", e.target.value)} style={inp({ cursor: "pointer" })}>
                  {def.sensors.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Position / Location</label>
                <input value={p.position} onChange={e => upd(p.id, "position", e.target.value)}
                  placeholder="e.g. Drive End, Coil A" style={inp()} />
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ControllerPanel({ equipKey, tag, area, form, onChange }) {
  const options = CTRL_OPTIONS[equipKey] || [];
  if (!options.length) return null;

  const ctrl    = form.controller || { type: "None", brand: "", model: "", commProtocol: "" };
  const sigs    = form.signals    || {};
  const variants = CTRL_VARIANTS[ctrl.type] || [];

  const setCtrl = (k, v) => {
    onChange("controller", { ...ctrl, [k]: v });
    if (k === "type") onChange("signals", {});
  };

  const setSig = (id, k, v) => {
    const ns = { ...sigs, [id]: { ...(sigs[id] || {}), [k]: v } };
    if (!sigs[id]) ns[id].code = id;
    onChange("signals", ns);
  };

  const toggleSig = (id, vdef) => {
    const cur = sigs[id] || { code: id, signalType: vdef.sig, enabled: false, connMethod: "Hardwired", protocol: "" };
    const ns  = { ...sigs, [id]: { ...cur, enabled: !cur.enabled } };
    if (!sigs[id]) {
      ns[id].code       = id;
      ns[id].signalType = vdef.sig;
      ns[id].connMethod = "Hardwired";
      ns[id].protocol   = "";
    }
    onChange("signals", ns);
  };

  const instTag = mkTag(tag, area);

  return (
    <div>
      {/* Controller definition */}
      <div style={{ background: CRD, border: `1px solid ${BDR2}`, borderRadius: 9, padding: 14, marginBottom: 14 }}>
        <div style={{ color: MUT, fontSize: 11, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
          <Settings size={13} /> Controller Definition
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8 }}>
          <div>
            <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Controller Type</label>
            <select value={ctrl.type || "None"} onChange={e => setCtrl("type", e.target.value)} style={inp({ cursor: "pointer" })}>
              {options.map(o => <option key={o} value={o}>{CTRL_LABEL[o] || o}</option>)}
            </select>
          </div>
          {ctrl.type && ctrl.type !== "None" && (
            <>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Brand</label>
                <input value={ctrl.brand || ""} onChange={e => setCtrl("brand", e.target.value)} placeholder="e.g. ABB, Siemens" style={inp()} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Model</label>
                <input value={ctrl.model || ""} onChange={e => setCtrl("model", e.target.value)} placeholder="e.g. ACS880" style={inp()} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", display: "block", marginBottom: 3, fontWeight: 600 }}>Communication Protocol</label>
                <select value={ctrl.commProtocol || ""} onChange={e => setCtrl("commProtocol", e.target.value)} style={inp({ cursor: "pointer" })}>
                  <option value="">-- Select --</option>
                  {PROTOCOLS.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </>
          )}
        </div>
      </div>

      {/* IO Variants */}
      {ctrl.type && ctrl.type !== "None" && variants.length > 0 && (
        <div>
          <div style={{ color: MUT, fontSize: 11, fontWeight: 600, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
            <Zap size={13} /> IO Signals / Variants
            <span style={{ color: DIM, fontSize: 10, fontWeight: 400 }}>
              ({variants.filter(v => (sigs[v.id] || {}).enabled).length} of {variants.length} enabled)
            </span>
          </div>

          {/* Table header */}
          <div style={{ display: "grid", gridTemplateColumns: "28px 1fr 72px 52px 110px 1fr 200px", gap: 4, padding: "5px 8px", background: SRF, borderRadius: "7px 7px 0 0", borderBottom: `1px solid ${BDR}` }}>
            {["", "Signal Name", "Code", "Type", "Wiring", "Protocol", "Generated Tag"].map((h, i) => (
              <div key={i} style={{ fontSize: 9, color: DIM, textTransform: "uppercase", letterSpacing: "0.07em", fontWeight: 600 }}>{h}</div>
            ))}
          </div>

          {variants.map(vd => {
            const sv        = sigs[vd.id] || {};
            const enabled   = sv.enabled   || false;
            const code      = sv.code      || vd.id;
            const sigType   = sv.signalType || vd.sig;
            const connMethod= sv.connMethod || "Hardwired";
            const protocol  = sv.protocol  || "";
            const sc        = SIGC[sigType] || MUT;
            const fullTag   = enabled && code ? mkSigTag(tag, area, code) : "";

            return (
              <div key={vd.id} style={{
                display: "grid", gridTemplateColumns: "28px 1fr 72px 52px 110px 1fr 200px",
                gap: 4, padding: "6px 8px", borderBottom: `1px solid ${BDR}`,
                background: enabled ? `${sc}08` : "transparent", alignItems: "center",
              }}>
                <input type="checkbox" checked={enabled} onChange={() => toggleSig(vd.id, vd)}
                  style={{ cursor: "pointer", accentColor: sc }} />
                <span style={{ fontSize: 12, color: enabled ? TXT : DIM }}>{vd.label}</span>
                <input value={code} disabled={!enabled}
                  onChange={e => enabled && setSig(vd.id, "code", e.target.value.toUpperCase().slice(0, 4))}
                  style={{ background: enabled ? BG : "transparent", border: `1px solid ${enabled ? BDR2 : "transparent"}`, borderRadius: 5, padding: "3px 6px", color: enabled ? ACC : DIM, fontSize: 11, fontFamily: "monospace", fontWeight: 700, outline: "none", width: "100%" }} />
                <select value={sigType} disabled={!enabled}
                  onChange={e => enabled && setSig(vd.id, "signalType", e.target.value)}
                  style={{ background: enabled ? BG : "transparent", border: `1px solid ${enabled ? BDR2 : "transparent"}`, borderRadius: 5, padding: "3px 4px", color: enabled ? sc : DIM, fontSize: 11, outline: "none", cursor: enabled ? "pointer" : "default" }}>
                  {["AI","AO","DI","DO"].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <select value={connMethod} disabled={!enabled}
                  onChange={e => enabled && setSig(vd.id, "connMethod", e.target.value)}
                  style={{ background: enabled ? BG : "transparent", border: `1px solid ${enabled ? BDR2 : "transparent"}`, borderRadius: 5, padding: "3px 4px", color: enabled ? TXT : DIM, fontSize: 10, outline: "none", cursor: enabled ? "pointer" : "default" }}>
                  <option value="Hardwired">Hardwired</option>
                  <option value="Communication">Comms</option>
                </select>
                {connMethod === "Communication" && enabled ? (
                  <select value={protocol} onChange={e => setSig(vd.id, "protocol", e.target.value)}
                    style={{ background: BG, border: `1px solid ${BDR2}`, borderRadius: 5, padding: "3px 4px", color: TXT, fontSize: 10, outline: "none", cursor: "pointer" }}>
                    <option value="">-- Protocol --</option>
                    {PROTOCOLS.filter(p => p !== "Hardwired").map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                ) : (
                  <span style={{ fontSize: 10, color: DIM }}>Hardwired</span>
                )}
                <span style={{ fontSize: 10, color: fullTag ? ACC : DIM, fontFamily: "monospace", fontWeight: fullTag ? 600 : 400, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {fullTag || "--"}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   ITEM MODAL (tabbed)
══════════════════════════════════════ */
function ItemModal({ def, equipKey, dept, modal, form, errs, onChange, onSave, onClose }) {
  const [tab, setTab] = useState("General");

  const color       = def?.color || ACC;
  const hasProbes   = ["pump", "motor"].includes(equipKey);
  const hasCtrl     = ["motor", "valve", "solenoid"].includes(equipKey);
  const tabs        = ["General", ...(hasProbes ? ["Probes"] : []), ...(hasCtrl ? ["Controller"] : [])];
  const tag         = form.tagName || "";
  const area        = form.area    || "";
  const instTag     = mkTag(tag, area);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.72)", display: "flex", alignItems: "stretch", justifyContent: "flex-end", zIndex: 400 }}
      onClick={onClose}>
      <div style={{ background: SRF, width: tabs.length > 1 ? 820 : 700, maxWidth: "97vw", overflowY: "auto", borderLeft: `3px solid ${color}`, padding: 22, display: "flex", flexDirection: "column" }}
        onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <Dot color={color} size={10} />
              <h2 style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 16, color }}>
                {modal.mode === "add" ? `New ${def?.label?.replace(/s$/, "")}` : `Edit ${form.tagName}`}
              </h2>
              <span style={{ fontSize: 10, color: dept === "mech" ? MC : IC, background: dept === "mech" ? `${MC}18` : `${IC}18`, padding: "2px 8px", borderRadius: 5, fontWeight: 600 }}>
                {dept === "mech" ? "MECHANICS" : "I&C"}
              </span>
            </div>
            {instTag && (
              <div style={{ fontFamily: "monospace", fontSize: 11, color: ACC, background: `${ACC}10`, padding: "2px 10px", borderRadius: 5, display: "inline-block" }}>
                Instance Tag: <strong>{instTag}</strong>
              </div>
            )}
          </div>
          <button onClick={onClose} style={{ background: CRD, border: `1px solid ${BDR}`, borderRadius: 7, padding: "5px 9px", color: MUT, cursor: "pointer", display: "flex", alignItems: "center" }}>
            <X size={14} />
          </button>
        </div>

        {/* Tag + Area + P&ID row — always visible */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, background: CRD, border: `1px solid ${color}44`, borderRadius: 8, padding: 13, marginBottom: 14 }}>
          <div>
            <label style={{ fontSize: 10, color, textTransform: "uppercase", letterSpacing: "0.1em", display: "block", marginBottom: 4, fontWeight: 600 }}>Tag Name *</label>
            <input value={form.tagName || ""}
              onChange={e => onChange("tagName", e.target.value.toUpperCase())}
              placeholder={`e.g. ${def?.prefix}-001`}
              style={{ width: "100%", background: SRF, border: `1px solid ${errs.tagName ? DNG : BDR2}`, borderRadius: 6, padding: "7px 11px", color: TXT, fontSize: 14, fontFamily: "monospace", fontWeight: 700, outline: "none" }} />
            {errs.tagName && <p style={{ color: DNG, fontSize: 11, marginTop: 3 }}>{errs.tagName}</p>}
          </div>
          <div>
            <label style={{ fontSize: 10, color: MUT, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 4, fontWeight: 600 }}>Area Code</label>
            <input value={form.area || ""}
              onChange={e => onChange("area", e.target.value.toUpperCase())}
              placeholder="e.g. IN001"
              style={{ width: "100%", background: SRF, border: `1px solid ${BDR2}`, borderRadius: 6, padding: "7px 11px", color: TXT, fontSize: 13, fontFamily: "monospace", fontWeight: 600, outline: "none" }} />
          </div>
          <div>
            <label style={{ fontSize: 10, color: MUT, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 4, fontWeight: 600 }}>P&ID Reference</label>
            <input value={form.pidRef || ""}
              onChange={e => onChange("pidRef", e.target.value.toUpperCase())}
              placeholder="e.g. PID-001"
              style={{ width: "100%", background: SRF, border: `1px solid ${BDR2}`, borderRadius: 6, padding: "7px 11px", color: TXT, fontSize: 13, fontFamily: "monospace", outline: "none" }} />
          </div>
        </div>

        {/* Tabs */}
        {tabs.length > 1 && (
          <div style={{ display: "flex", gap: 2, marginBottom: 16, background: CRD, padding: 4, borderRadius: 8 }}>
            {tabs.map(t => (
              <button key={t} onClick={() => setTab(t)}
                style={{ flex: 1, padding: "7px 4px", borderRadius: 6, border: "none", background: tab === t ? SRF : "transparent", color: tab === t ? TXT : DIM, fontSize: 12, fontWeight: tab === t ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>
                {t}
              </button>
            ))}
          </div>
        )}

        {/* Tab content */}
        <div style={{ flex: 1 }}>
          {tab === "General" && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              {def?.fields?.map(f => (
                <div key={f.k} style={{ gridColumn: f.t === "area" ? "span 2" : "span 1" }}>
                  <FieldInput f={f} val={form[f.k] || ""} err={errs[f.k]} onChange={v => onChange(f.k, v)} />
                </div>
              ))}
            </div>
          )}
          {tab === "Probes" && (
            <ProbesPanel probes={form.probes || []} onChange={v => onChange("probes", v)} />
          )}
          {tab === "Controller" && (
            <ControllerPanel equipKey={equipKey} tag={tag} area={area} form={form} onChange={onChange} />
          )}
        </div>

        {/* Footer */}
        <div style={{ display: "flex", gap: 7, justifyContent: "flex-end", paddingTop: 14, marginTop: 14, borderTop: `1px solid ${BDR}`, flexShrink: 0 }}>
          <button onClick={onClose}
            style={{ background: CRD, border: `1px solid ${BDR2}`, borderRadius: 7, padding: "7px 15px", color: MUT, cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>
            Cancel
          </button>
          <button onClick={onSave}
            style={{ background: color, border: "none", borderRadius: 7, padding: "7px 20px", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5 }}>
            <Plus size={13} /> {modal.mode === "add" ? "Add" : "Save Changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   EQUIPMENT TABLE
══════════════════════════════════════ */
function EqTable({ dept, equipKey, def, allItems, displayed, q, setQ, stF, setStF, sort, setSort, onAdd, onEdit, onDuplicate, onDel }) {
  const [hovRow, setHov] = useState(null);
  const VIRTUAL_COLS = {
    __probes__:     { k: "__probes__",     l: "Probes" },
    __controller__: { k: "__controller__", l: "Controller" },
  };
  const sumFields = def.summary.map(k =>
    def.fields.find(f => f.k === k) || VIRTUAL_COLS[k] || null
  ).filter(Boolean);
  const dC = dept === "mech" ? MC : IC;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
            <Dot color={def.color} size={10} />
            <h1 style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 700, color: TXT }}>{def.label}</h1>
            <span style={{ fontSize: 10, color: dC, background: `${dC}18`, padding: "2px 8px", borderRadius: 5, fontWeight: 600 }}>
              {dept === "mech" ? "MECHANICS" : "I&C"}
            </span>
          </div>
          <p style={{ color: DIM, fontSize: 11 }}>
            {allItems.length} registered · {displayed.length} shown · prefix{" "}
            <span style={{ color: MUT, fontFamily: "monospace" }}>{def.prefix}-XXX</span>
          </p>
        </div>
        <button onClick={onAdd}
          style={{ background: def.color, border: "none", borderRadius: 8, padding: "8px 14px", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 5, fontFamily: "inherit", flexShrink: 0 }}>
          <Plus size={13} /> Add {def.label.replace(/s$/, "")}
        </button>
      </div>

      <div style={{ display: "flex", gap: 7, marginBottom: 11 }}>
        <div style={{ flex: 1, position: "relative" }}>
          <Search size={13} color={DIM} style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }} />
          <input value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search tag, area, description..."
            style={inp({ paddingLeft: 29, border: `1px solid ${BDR}`, background: CRD })} />
        </div>
        <select value={stF} onChange={e => setStF(e.target.value)}
          style={inp({ width: "auto", background: CRD, border: `1px solid ${BDR}`, cursor: "pointer", color: stF === "All" ? DIM : TXT })}>
          {["All","Active","Standby","Maintenance","Decommissioned","Spare"].map(s => (
            <option key={s} value={s}>{s === "All" ? "All Statuses" : s}</option>
          ))}
        </select>
      </div>

      {displayed.length === 0 ? (
        <div style={{ textAlign: "center", padding: "48px 20px", color: DIM }}>
          <div style={{ fontSize: 28, marginBottom: 10, opacity: 0.2 }}>○</div>
          <div style={{ fontSize: 14, color: MUT, marginBottom: 4 }}>
            {allItems.length === 0 ? `No ${def.label} registered yet` : "No items match"}
          </div>
          {allItems.length === 0 && (
            <button onClick={onAdd}
              style={{ marginTop: 12, background: def.color, border: "none", borderRadius: 8, padding: "8px 18px", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "inline-flex", alignItems: "center", gap: 5 }}>
              <Plus size={13} /> Add first {def.label.replace(/s$/, "")}
            </button>
          )}
        </div>
      ) : (
        <div style={{ background: CRD, border: `1px solid ${BDR}`, borderRadius: 10, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ background: SRF, borderBottom: `1px solid ${BDR}` }}>
                  {[{ k: "tagName", l: "Tag" }, { k: "area", l: "Area" }, { k: "pidRef", l: "P&ID" }, ...sumFields, { k: "status", l: "Status" }].map(f => (
                    <th key={f.k}
                      onClick={() => setSort(p => ({ k: f.k, d: p.k === f.k && p.d === "asc" ? "desc" : "asc" }))}
                      style={{ padding: "7px 10px", textAlign: "left", fontSize: 10, cursor: "pointer", userSelect: "none", color: sort.k === f.k ? def.color : DIM, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.07em", whiteSpace: "nowrap" }}>
                      {f.l}{sort.k === f.k ? (sort.d === "asc" ? " ↑" : " ↓") : ""}
                    </th>
                  ))}
                  <th style={{ padding: "7px 10px", textAlign: "right", fontSize: 10, color: DIM, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.07em" }}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {displayed.map((item, di) => {
                  const ri = allItems.indexOf(item);
                  const sc = STC[item.status] || { c: MUT, b: BDR };
                  const probeCount  = (item.probes  || []).length;
                  const sigCount    = Object.values(item.signals || {}).filter(s => s.enabled).length;
                  return (
                    <tr key={item.tagName}
                      onMouseEnter={() => setHov(di)}
                      onMouseLeave={() => setHov(null)}
                      style={{ borderBottom: `1px solid ${BDR}`, background: hovRow === di ? `${CRD}bb` : "transparent" }}>
                      <td style={{ padding: "9px 10px", fontFamily: "monospace", fontSize: 12, fontWeight: 600, color: def.color, whiteSpace: "nowrap" }}>
                        {item.tagName}
                        {probeCount > 0 && <span style={{ marginLeft: 4, fontSize: 9, color: SUC, background: `${SUC}15`, padding: "1px 4px", borderRadius: 3 }}>{probeCount}p</span>}
                        {sigCount   > 0 && <span style={{ marginLeft: 3, fontSize: 9, color: ACC, background: `${ACC}15`, padding: "1px 4px", borderRadius: 3 }}>{sigCount}s</span>}
                      </td>
                      <td style={{ padding: "9px 10px", fontSize: 11, color: ACC, fontFamily: "monospace" }}>{item.area   || <span style={{ color: BDR2 }}>--</span>}</td>
                      <td style={{ padding: "9px 10px", fontSize: 11, color: MUT, fontFamily: "monospace" }}>{item.pidRef || <span style={{ color: BDR2 }}>--</span>}</td>
                      {sumFields.map(f => {
                        const v   = item[f.k];
                        const sgC = SIGC[v];

                        // Virtual: Probes count
                        if (f.k === "__probes__") {
                          const probes = item.probes || [];
                          const configured = probes.filter(p => p.code && p.ioChannel).length;
                          return (
                            <td key={f.k} style={{ padding: "9px 10px", whiteSpace: "nowrap" }}>
                              {probes.length === 0
                                ? <span style={{ color: BDR2, fontSize: 11 }}>none</span>
                                : <span style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                                    <Badge label={`${probes.length} probe${probes.length > 1 ? "s" : ""}`} color={MUT} bg={`${MUT}20`} />
                                    {configured > 0 && <Badge label={`${configured} wired`} color={SUC} bg={`${SUC}18`} />}
                                  </span>}
                            </td>
                          );
                        }

                        // Virtual: Controller
                        if (f.k === "__controller__") {
                          const ctrl = item.controller?.type;
                          const hasCtrl = ctrl && ctrl !== "None";
                          return (
                            <td key={f.k} style={{ padding: "9px 10px", whiteSpace: "nowrap" }}>
                              {hasCtrl
                                ? <span style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                                    <Badge label={CTRL_LABEL[ctrl] || ctrl} color={ACC} bg={`${ACC}15`} />
                                    {item.controller?.brand && <span style={{ fontSize: 10, color: DIM }}>{item.controller.brand}</span>}
                                  </span>
                                : <span style={{ color: BDR2, fontSize: 11 }}>none</span>}
                            </td>
                          );
                        }
                        if (f.k === "signalType" && v && sgC) return <td key={f.k} style={{ padding: "9px 10px" }}><Badge label={v} color={sgC} bg={`${sgC}20`} /></td>;
                        if (f.k === "ioTag"      && v)        return <td key={f.k} style={{ padding: "9px 10px", fontSize: 11, color: ACC, fontFamily: "monospace", fontWeight: 600 }}>{v}</td>;
                        return <td key={f.k} style={{ padding: "9px 10px", fontSize: 12, color: MUT, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{v || <span style={{ color: BDR2 }}>--</span>}</td>;
                      })}
                      <td style={{ padding: "9px 10px" }}>
                        {item.status ? <Badge label={item.status} color={sc.c} bg={sc.b} /> : <span style={{ color: BDR2 }}>--</span>}
                      </td>
                      <td style={{ padding: "9px 10px", textAlign: "right", whiteSpace: "nowrap" }}>
                        <button onClick={() => onEdit(item, ri)}
                          style={{ background: "transparent", border: `1px solid ${BDR2}`, borderRadius: 5, padding: "4px 8px", color: MUT, fontSize: 11, cursor: "pointer", marginRight: 4, fontFamily: "inherit", display: "inline-flex", alignItems: "center", gap: 3 }}>
                          <Edit2 size={11} /> Edit
                        </button>
                        <button onClick={() => onDuplicate(item)}
                          title="Duplicate this item"
                          style={{ background: "transparent", border: `1px solid ${ACC}55`, borderRadius: 5, padding: "4px 8px", color: ACC, fontSize: 11, cursor: "pointer", marginRight: 4, fontFamily: "inherit", display: "inline-flex", alignItems: "center", gap: 3 }}>
                          <Copy size={11} />
                        </button>
                        <button onClick={() => onDel(item, ri)}
                          style={{ background: "transparent", border: `1px solid ${DNG}40`, borderRadius: 5, padding: "4px 8px", color: DNG, fontSize: 11, cursor: "pointer", fontFamily: "inherit", display: "inline-flex", alignItems: "center", gap: 3 }}>
                          <Trash2 size={11} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ padding: "6px 10px", borderTop: `1px solid ${BDR}`, fontSize: 11, color: DIM, display: "flex", justifyContent: "space-between" }}>
            <span>Showing {displayed.length} of {allItems.length}</span>
            <span>{allItems.filter(i => i.status === "Active").length} active</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   PROBES AGGREGATED VIEW (I&C area)
══════════════════════════════════════ */
function ProbesView({ mechDb, onUpdate }) {
  const [expandedId, setExpandedId] = useState(null);

  const rows = [];
  Object.entries(mechDb).forEach(([equipKey, items]) => {
    (items || []).forEach(item => {
      (item.probes || []).forEach(p => {
        rows.push({
          ...p,
          equipKey,
          parentTag:  item.tagName,
          parentArea: item.area || "",
          parentDesc: item.description || "",
          fullTag:    p.code ? mkSigTag(item.tagName, item.area || "", p.code) : "",
        });
      });
    });
  });

  const lbl = (text) => (
    <label style={{ fontSize: 9, color: DIM, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 3, fontWeight: 600 }}>
      {text}
    </label>
  );

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <Zap size={18} color={IC} />
        <h1 style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 700, color: TXT }}>Motor / Pump Probes</h1>
        <span style={{ fontSize: 10, color: IC, background: `${IC}18`, padding: "2px 8px", borderRadius: 5, fontWeight: 600 }}>I&C</span>
      </div>
      <p style={{ color: DIM, fontSize: 11, marginBottom: 16 }}>
        Probes defined by Mechanics. Click a row to assign IO signal data.
      </p>

      {rows.length === 0 ? (
        <div style={{ textAlign: "center", padding: "48px 20px", color: DIM, border: `1px dashed ${BDR2}`, borderRadius: 10 }}>
          <div style={{ fontSize: 28, marginBottom: 10, opacity: 0.2 }}>○</div>
          <div style={{ fontSize: 14, color: MUT }}>No probes defined yet. Go to Mechanics — Motors / Pumps and add probes.</div>
        </div>
      ) : (
        <div style={{ border: `1px solid ${BDR}`, borderRadius: 10, overflow: "hidden" }}>
          {rows.map((r, i) => {
            const isExp = expandedId === r.id;
            const upd   = (field, value) => onUpdate(r.equipKey, r.parentTag, r.id, field, value);
            const sc    = SIGC[r.sig] || MUT;
            const configured = !!(r.code && r.ioChannel);

            return (
              <div key={r.id} style={{ borderBottom: i < rows.length - 1 ? `1px solid ${BDR}` : "none" }}>
                {/* Summary row — click to expand */}
                <div onClick={() => setExpandedId(isExp ? null : r.id)}
                  style={{ display: "grid", gridTemplateColumns: "24px 200px 1fr 1fr 1fr 90px 90px", gap: 8, padding: "10px 14px", alignItems: "center", cursor: "pointer", background: isExp ? `${IC}08` : "transparent" }}>
                  <span style={{ fontSize: 12, color: isExp ? IC : DIM, fontWeight: 600 }}>{isExp ? "▾" : "▸"}</span>
                  <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 600, color: r.fullTag ? ACC : DIM, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {r.fullTag || "(no IO tag yet)"}
                  </span>
                  <span style={{ fontSize: 11, color: MUT }}>
                    <span style={{ color: MC, fontWeight: 600, fontFamily: "monospace" }}>{r.parentTag}</span>
                    {r.parentDesc && <span style={{ display: "block", fontSize: 10, color: DIM }}>{r.parentDesc}</span>}
                  </span>
                  <span style={{ fontSize: 11, color: TXT }}>{r.type}</span>
                  <span style={{ fontSize: 10, color: MUT }}>{r.sensorType}<br/><span style={{ color: DIM }}>{r.position || "--"}</span></span>
                  {r.sig
                    ? <Badge label={r.sig} color={sc} bg={`${sc}20`} />
                    : <span style={{ fontSize: 10, color: DIM }}>--</span>}
                  <span style={{ fontSize: 10, fontWeight: 600, color: configured ? SUC : WRN }}>
                    {configured ? "✓ Configured" : "⚠ Pending"}
                  </span>
                </div>

                {/* Expanded I&C IO assignment */}
                {isExp && (
                  <div style={{ background: `${IC}06`, borderTop: `1px solid ${IC}22`, padding: "14px 16px" }}>
                    <div style={{ color: IC, fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>
                      I&C IO Assignment for {r.parentTag} — {r.type}
                    </div>

                    {/* Row 1: Signal Code, Signal Type, Generated Tag */}
                    <div style={{ display: "grid", gridTemplateColumns: "120px 120px 1fr", gap: 10, marginBottom: 10 }}>
                      <div>
                        {lbl("Signal Code (max 4)")}
                        <input value={r.code || ""} onChange={e => upd("code", e.target.value.toUpperCase().slice(0, 4))}
                          placeholder="e.g. VIB1"
                          style={inp({ fontFamily: "monospace", fontWeight: 700, color: ACC, fontSize: 14 })} />
                      </div>
                      <div>
                        {lbl("Signal Type")}
                        <select value={r.sig || "AI"} onChange={e => upd("sig", e.target.value)} style={inp({ cursor: "pointer" })}>
                          {["AI","AO","DI","DO","HART AI","HART AO","Pulse"].map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                      <div>
                        {lbl("Generated Tag (= IO Tag)")}
                        <div style={{ background: SRF, border: `1px solid ${r.code ? ACC : BDR2}`, borderRadius: 7, padding: "8px 12px", fontSize: 13, color: r.code ? ACC : DIM, fontFamily: "monospace", fontWeight: 700 }}>
                          {r.code ? mkSigTag(r.parentTag, r.parentArea, r.code) : "(enter signal code)"}
                        </div>
                      </div>
                    </div>

                    {/* Row 2: Cabinet, PLC, Remote IO, Card Slot, Channel */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 10 }}>
                      <div>
                        {lbl("Cabinet")}
                        <input value={r.cabinet || ""} onChange={e => upd("cabinet", e.target.value)}
                          placeholder="e.g. MCC-01" style={inp({ fontSize: 12 })} />
                      </div>
                      <div>
                        {lbl("PLC")}
                        <input value={r.plcId || ""} onChange={e => upd("plcId", e.target.value)}
                          placeholder="e.g. PLC-A" style={inp({ fontSize: 12 })} />
                      </div>
                      <div>
                        {lbl("Remote IO")}
                        <input value={r.remoteIO || ""} onChange={e => upd("remoteIO", e.target.value)}
                          placeholder="e.g. RIO-01" style={inp({ fontSize: 12, fontFamily: "monospace" })} />
                      </div>
                      <div>
                        {lbl("Card Slot")}
                        <input value={r.cardSlot || ""} onChange={e => upd("cardSlot", e.target.value)}
                          placeholder="e.g. Slot 3" style={inp({ fontSize: 12, fontFamily: "monospace" })} />
                      </div>
                      <div>
                        {lbl("Channel")}
                        <input value={r.ioChannel || ""} onChange={e => upd("ioChannel", e.target.value)}
                          placeholder="e.g. CH.04" style={inp({ fontSize: 12, fontFamily: "monospace" })} />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}

          <div style={{ padding: "8px 14px", borderTop: `1px solid ${BDR}`, fontSize: 11, color: DIM, display: "flex", justifyContent: "space-between", background: SRF }}>
            <span>{rows.length} probes from Mechanics</span>
            <span style={{ color: SUC }}>{rows.filter(r => r.code && r.ioChannel).length} fully configured</span>
          </div>
        </div>
      )}
    </div>
  );
}

    switch:      [{ k:"description",l:"Description",t:"text",req:true },{ k:"service",l:"Service",t:"text" },{ k:"switchFn",l:"Switch Function",t:"sel",o:["HH","H","L","LL"] },{ k:"setpoint",l:"Setpoint",t:"text" },{ k:"outputType",l:"Output Type",t:"sel",o:["SPDT Relay","DPDT Relay","NPN","PNP","NAMUR"] },{ k:"processConn",l:"Process Connection",t:"text" },{ k:"ipRating",l:"IP Rating",t:"sel",o:["IP54","IP65","IP66","IP67","IP68"] },{ k:"manufacturer",l:"Manufacturer",t:"text" },{ k:"model",l:"Model",t:"text" },{ k:"serialNumber",l:"Serial Number",t:"text" },{ k:"location",l:"Physical Location",t:"text" },{ k:"status",l:"Status",t:"sel",o:["Active","Standby","Maintenance","Decommissioned","Spare"] },{ k:"notes",l:"Notes",t:"area" }],

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 500 }}
      onClick={onClose}>
      <div style={{ background: CRD, border: `1px solid ${BDR2}`, borderRadius: 14, padding: 24, width: 400, maxWidth: "92vw" }}
        onClick={e => e.stopPropagation()}>
        <h2 style={{ fontFamily: "monospace", fontSize: 15, fontWeight: 700, color: ac, marginBottom: 16 }}>New Equipment Type</h2>
        <div style={{ display: "grid", gap: 11 }}>

            <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 3, fontWeight: 600 }}>Type Name *</label>

              ))}

            <label style={{ fontSize: 10, color: DIM, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 5, fontWeight: 600 }}>Color</label>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
              {COLORS.map(c => (
                <button key={c} onClick={() => setColor(c)}

              ))}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 7, justifyContent: "flex-end", marginTop: 18 }}>
          <button onClick={onClose}
            style={{ background: SRF, border: `1px solid ${BDR2}`, borderRadius: 7, padding: "7px 14px", color: MUT, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
            Cancel
          </button>
          <button onClick={handleAdd} disabled={!name.trim() || !prefix.trim()}
            style={{ background: ac, border: "none", borderRadius: 7, padding: "7px 18px", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", opacity: (!name.trim() || !prefix.trim()) ? 0.5 : 1, display: "flex", alignItems: "center", gap: 4 }}>
            <Plus size={11} /> Create Type
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   MAIN APP
══════════════════════════════════════ */
function App() {
  const [project,     setProject]     = useState("Water Treatment Plant — Project Alpha");
  const [editP,       setEditP]       = useState(false);
  const [tmpP,        setTmpP]        = useState("");
  const [mechDb,      setMechDb]      = useState(initMechDb);
  const [iacDb,       setIacDb]       = useState(initIacDb);
  const [customDefs,  setCustomDefs]  = useState({ mech: {}, iac: {} });
  const [view,        setView]        = useState(null);
  const [modal,       setModal]       = useState(null);
  const [form,        setForm]        = useState({});
  const [errs,        setErrs]        = useState({});
  const [q,           setQ]           = useState("");
  const [stF,         setStF]         = useState("All");
  const [sort,        setSort]        = useState({ k: "tagName", d: "asc" });
  const [toast,       setToast]       = useState(null);
  const [delC,        setDel]         = useState(null);
  const [newTypeDept, setNewTypeDept] = useState(null);
  const mRef = useRef(null);
  const iRef = useRef(null);

  const allTags = useMemo(() =>
    [...Object.values(mechDb).flat(), ...Object.values(iacDb).flat()].map(e => e.tagName?.toUpperCase()),
    [mechDb, iacDb]
  );

  const showToast = useCallback((msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3200);
  }, []);

  const updateProbe = useCallback((equipKey, parentTag, probeId, field, value) => {
    setMechDb(prev => {
      const items   = [...(prev[equipKey] || [])];
      const itemIdx = items.findIndex(i => i.tagName === parentTag);
      if (itemIdx === -1) return prev;
      const item   = { ...items[itemIdx] };
      item.probes  = (item.probes || []).map(p => p.id === probeId ? { ...p, [field]: value } : p);
      items[itemIdx] = item;
      return { ...prev, [equipKey]: items };
    });
  }, []);

  const getDef = (dept, key) => {
    if (key === "__probes__") return { label: "Probes", color: IC, prefix: "", fields: [], summary: [] };
    if (dept === "mech") return MECH_DEF[key] || (customDefs.mech || {})[key];
    return IAC_DEF[key] || (customDefs.iac || {})[key];
  };
  const getDb = d => d === "mech" ? mechDb : iacDb;
  const setDb = (d, v) => d === "mech" ? setMechDb(v) : setIacDb(v);

  const openAdd = (dept, typeKey) => {
    setForm({ status: "Active", probes: [], controller: { type: "None" }, signals: {} });
    setErrs({});
    setModal({ mode: "add", dept, typeKey });
  };
  const openEdit = (dept, typeKey, item, idx) => {
    setForm({ ...item, probes: item.probes || [], controller: item.controller || { type: "None" }, signals: item.signals || {} });
    setErrs({});
    setModal({ mode: "edit", dept, typeKey, item, idx });
  };

  const duplicateItem = (dept, typeKey, item) => {
    // Find a unique tag suggestion: M001 → M001-2 → M001-3 …
    const base = item.tagName;
    let n = 2, suggested = `${base}-${n}`;
    while (allTags.includes(suggested.toUpperCase())) { n++; suggested = `${base}-${n}`; }

    // Deep-copy sub-objects, give each probe a fresh id
    setForm({
      ...item,
      tagName:    suggested,
      probes:     (item.probes  || []).map(p => ({ ...p, id: "p" + Date.now() + Math.round(Math.random() * 1e6) })),
      controller: { ...(item.controller || { type: "None" }) },
      signals:    { ...(item.signals    || {}) },
    });
    setErrs({});
    setModal({ mode: "add", dept, typeKey });
  };
  const closeModal = () => { setModal(null); setForm({}); setErrs({}); };

  const validate = () => {
    const e   = {};
    const tag = (form.tagName || "").trim().toUpperCase();
    if (!tag) {
      e.tagName = "Tag name is required";
    } else {
      const others = modal.mode === "edit"
        ? allTags.filter(t => t !== modal.item?.tagName?.toUpperCase())
        : allTags;
      if (others.includes(tag)) e.tagName = "Tag name already exists";
    }
    const def = getDef(modal.dept, modal.typeKey);
    (def?.fields || []).forEach(f => {
      if (f.req && !form[f.k]?.trim()) e[f.k] = `${f.l} is required`;
    });
    setErrs(e);
    return !Object.keys(e).length;
  };

  const saveItem = () => {
    if (!validate()) return;
    const item = { ...form, tagName: (form.tagName || "").trim().toUpperCase() };
    const db   = getDb(modal.dept);
    const upd  = { ...db, [modal.typeKey]: [...(db[modal.typeKey] || [])] };
    if (modal.mode === "add") upd[modal.typeKey].push(item);
    else upd[modal.typeKey][modal.idx] = item;
    setDb(modal.dept, upd);
    showToast(modal.mode === "add" ? `${item.tagName} added` : `${item.tagName} updated`);
    closeModal();
  };

  const confirmDel = () => {
    const { dept, typeKey, idx, tag } = delC;
    const db  = getDb(dept);
    const upd = { ...db, [typeKey]: [...(db[typeKey] || [])] };
    upd[typeKey].splice(idx, 1);
    setDb(dept, upd);
    showToast(`${tag} removed`, "info");
    setDel(null);
  };

  const addCustomType = (dept, key, def) => {
    setCustomDefs(p => ({ ...p, [dept]: { ...(p[dept] || {}), [key]: def } }));
    if (dept === "mech") setMechDb(p => ({ ...p, [key]: [] }));
    else setIacDb(p => ({ ...p, [key]: [] }));
    showToast(`${def.label} type created`);
  };

  const exportDept = dept => {
    const defs = dept === "mech" ? { ...MECH_DEF, ...(customDefs.mech || {}) } : { ...IAC_DEF, ...(customDefs.iac || {}) };
    const db   = getDb(dept);
    const wb   = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      [`AQUABASE — ${dept === "mech" ? "MECHANICS" : "I&C"}`],
      ["Project:", project], ["Exported:", new Date().toLocaleString()], [],
      ["Equipment Type", "Count"], ...Object.entries(defs).map(([k, d]) => [d.label, (db[k] || []).length]),
    ]), "Summary");
    Object.entries(defs).forEach(([k, def]) => {
      const items = db[k] || [];
      if (!items.length) return;
      const h  = ["Tag Name", "Area", "P&ID Ref", ...def.fields.map(f => f.l)];
      const r  = items.map(i => [i.tagName, i.area || "", i.pidRef || "", ...def.fields.map(f => i[f.k] ?? "")]);
      const ws = XLSX.utils.aoa_to_sheet([h, ...r]);
      ws["!cols"] = h.map((_, i) => ({ wch: i === 0 ? 14 : i <= 2 ? 10 : i === 3 ? 28 : 16 }));
      XLSX.utils.book_append_sheet(wb, ws, def.label.substring(0, 31));
    });
    XLSX.writeFile(wb, `${project.replace(/[^a-z0-9]/gi, "_")}_${dept === "mech" ? "MECHANICS" : "IAC"}.xlsx`);
    showToast(`${dept === "mech" ? "Mechanics" : "I&C"} exported`);
  };

  const exportIOList = () => {
    const wb     = XLSX.utils.book_new();
    const header = ["Full Signal Tag","Instance Tag","Equip. Tag","Area","P&ID Ref","Dept","Equipment Type","Signal Name","Signal Code","Signal Type","Wiring","Protocol","Controller Type","Controller Brand","Controller Model"];
    const rows   = [];

    // I&C instruments
    const iDefs = { ...IAC_DEF, ...(customDefs.iac || {}) };
    Object.entries(iDefs).forEach(([k, def]) => {
      (iacDb[k] || []).forEach(item => {
        const inst = mkTag(item.tagName, item.area || "");
        if (item.ioTag || item.signalType) {
          rows.push([mkSigTag(item.tagName, item.area || "", item.ioTag || "IO"), inst, item.tagName, item.area || "", item.pidRef || "", "I&C", def.label, item.description || "", item.ioTag || "", item.signalType || "", "Hardwired", "", def.label, "", item.model || ""]);
        }
      });
    });

    // Mechanics: controller variants
    const mDefs = { ...MECH_DEF, ...(customDefs.mech || {}) };
    Object.entries(mDefs).forEach(([k, def]) => {
      (mechDb[k] || []).forEach(item => {
        const inst = mkTag(item.tagName, item.area || "");
        const ctrl = item.controller || {};
        Object.entries(item.signals || {}).forEach(([vid, sv]) => {
          if (!sv.enabled) return;
          const vdef = (CTRL_VARIANTS[ctrl.type] || []).find(v => v.id === vid) || { label: vid };
          rows.push([mkSigTag(item.tagName, item.area || "", sv.code || vid), inst, item.tagName, item.area || "", item.pidRef || "", "MECH", def.label, vdef.label, sv.code || vid, sv.signalType || vdef.sig || "", sv.connMethod || "Hardwired", sv.connMethod === "Communication" ? sv.protocol || "" : "", CTRL_LABEL[ctrl.type] || ctrl.type || "", ctrl.brand || "", ctrl.model || ""]);
        });
        // Probes
        (item.probes || []).forEach(p => {
          if (!p.code) return;
          rows.push([mkSigTag(item.tagName, item.area || "", p.code), inst, item.tagName, item.area || "", item.pidRef || "", "MECH (Probe)", def.label, `${p.type} - ${p.position || ""}`, p.code, p.sig || "AI", "Hardwired (Probe)", "", p.sensorType || "", "", ""]);
        });
      });
    });

    if (!rows.length) { showToast("No IO data yet — add controllers/variants first", "warning"); return; }

    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws["!cols"] = header.map((_, i) => ({ wch: i === 0 ? 26 : i <= 2 ? 14 : 14 }));
    XLSX.utils.book_append_sheet(wb, ws, "IO List");
    const sigs = ["AI","AO","DI","DO","HART AI","HART AO","Pulse"];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      ["IO LIST SUMMARY"], ["Project:", project], ["Generated:", new Date().toLocaleString()], [],
      ["Signal Type", "Count"], ...sigs.map(s => [s, rows.filter(r => r[9] === s).length]),
      ["", ""], ["TOTAL", rows.length],
    ]), "Summary");
    XLSX.writeFile(wb, `${project.replace(/[^a-z0-9]/gi, "_")}_IO_List.xlsx`);
    showToast(`IO List exported — ${rows.length} signals`);
  };

  const importDept = (dept, e) => {
    const file = e.target.files[0];
    if (!file) return;
    const defs = dept === "mech" ? { ...MECH_DEF, ...(customDefs.mech || {}) } : { ...IAC_DEF, ...(customDefs.iac || {}) };
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb  = XLSX.read(ev.target.result, { type: "binary" });
        let added = 0, skipped = 0;
        const ct  = new Set(allTags);
        const db  = getDb(dept);
        const upd = { ...db };
        Object.entries(defs).forEach(([k, def]) => {
          const sh = wb.SheetNames.find(n => n.toLowerCase().includes(def.label.toLowerCase().slice(0, 5)));
          if (!sh) return;
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sh], { header: 1 });
          if (rows.length < 2) return;
          const hd = rows[0];
          if (!upd[k]) upd[k] = [];
          rows.slice(1).forEach(row => {
            if (!row[0]) return;
            const tag = String(row[0]).toUpperCase().trim();
            if (ct.has(tag)) { skipped++; return; }
            const item = { tagName: tag, probes: [], controller: { type: "None" }, signals: {} };
            hd.forEach((h, i) => {
              if (h === "Tag Name") return;
              if (h === "Area")    { item.area   = row[i] ? String(row[i]) : ""; return; }
              if (h === "P&ID Ref"){ item.pidRef = row[i] ? String(row[i]) : ""; return; }
              const field = def.fields.find(f => f.l === h);
              if (field) item[field.k] = row[i] !== undefined ? String(row[i]) : "";
            });
            upd[k].push(item);
            ct.add(tag);
            added++;
          });
        });
        setDb(dept, upd);
        showToast(`${added} added${skipped ? `, ${skipped} skipped` : ""}`, added ? "success" : "warning");
      } catch {
        showToast("Import failed", "error");
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = "";
  };

  const currentDef   = view ? getDef(view.dept, view.typeKey) : null;
  const currentItems = view && view.typeKey !== "__probes__" ? (getDb(view.dept)[view.typeKey] || []) : [];

  const displayed = useMemo(() => {
    if (!view || view.typeKey === "__probes__") return [];
    let list = [...currentItems];
    if (q) {
      const lq = q.toLowerCase();
      list = list.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(lq)));
    }
    if (stF !== "All") list = list.filter(i => i.status === stF);
    list.sort((a, b) => {
      const av = String(a[sort.k] ?? ""), bv = String(b[sort.k] ?? "");
      return sort.d === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    return list;
  }, [view, currentItems, q, stF, sort]);

  const navTo = (dept, key) => {
    setView({ dept, typeKey: key });
    setQ(""); setStF("All");
    setSort({ k: "tagName", d: "asc" });
  };

  const mDefs = { ...MECH_DEF, ...(customDefs.mech || {}) };
  const iDefs = { ...IAC_DEF,  ...(customDefs.iac  || {}) };

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: BG, color: TXT, fontFamily: "'Segoe UI', system-ui, sans-serif", overflow: "hidden" }}>
      <style>{`
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: ${SRF}; }
        ::-webkit-scrollbar-thumb { background: ${BDR2}; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: ${ACC}; }
        select option { background: ${CRD}; }
      `}</style>

      {/* HEADER */}
      <header style={{ height: 54, background: SRF, borderBottom: `1px solid ${BDR}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 16px", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 30, height: 30, background: `linear-gradient(135deg, ${ACC}, #0369a1)`, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Droplets size={16} color="#fff" />
            </div>
            <div>
              <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 13, color: ACC }}>AquaBase</div>
              <div style={{ fontSize: 9, color: DIM, textTransform: "uppercase", letterSpacing: "0.12em" }}>Equipment Registry</div>
            </div>
          </div>
          <div style={{ width: 1, height: 26, background: BDR }} />
          {editP ? (
            <input autoFocus value={tmpP} onChange={e => setTmpP(e.target.value)}
              onBlur={() => { setProject(tmpP); setEditP(false); }}
              onKeyDown={e => { if (e.key === "Enter") { setProject(tmpP); setEditP(false); } if (e.key === "Escape") setEditP(false); }}
              style={{ background: CRD, border: `1px solid ${ACC}`, borderRadius: 6, padding: "3px 9px", color: TXT, fontSize: 12, fontWeight: 500, minWidth: 240, outline: "none" }} />
          ) : (
            <button onClick={() => { setTmpP(project); setEditP(true); }}
              style={{ background: "none", border: "none", color: TXT, fontSize: 12, fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, padding: "2px 5px", borderRadius: 5 }}>
              {project} <Pencil size={11} color={DIM} />
            </button>
          )}
        </div>
        <span style={{ fontSize: 10, color: DIM }}>Tag format: EQUIP-AREA-CODE  |  IO List = generated output</span>
      </header>

      {/* BODY */}
      <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
        {/* SIDEBAR */}
        <nav style={{ width: 204, background: SRF, borderRight: `1px solid ${BDR}`, overflowY: "auto", flexShrink: 0, paddingBottom: 16 }}>
          <NavItem label="Overview" active={!view} color={ACC}
            count={[...Object.values(mechDb), ...Object.values(iacDb)].flat().length}
            onClick={() => setView(null)} />

          <SecLabel label="Mechanics" color={MC} />
          {Object.entries(mDefs).map(([k, def]) => (
            <NavItem key={k} label={def.label} active={view?.dept === "mech" && view?.typeKey === k}
              color={def.color} count={mechDb[k]?.length || 0} onClick={() => navTo("mech", k)} indent />
          ))}
          <button onClick={() => setNewTypeDept("mech")}
            style={{ width: "calc(100% - 16px)", margin: "4px 8px", background: "transparent", border: `1px dashed ${MC}33`, borderRadius: 6, padding: "4px", color: MC, fontSize: 10, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
            <Plus size={10} /> New type
          </button>

          <SecLabel label="I&C" color={IC} />
          {Object.entries(iDefs).map(([k, def]) => (
            <NavItem key={k} label={def.label} active={view?.dept === "iac" && view?.typeKey === k}
              color={def.color} count={iacDb[k]?.length || 0} onClick={() => navTo("iac", k)} indent />
          ))}
          {Object.values(mechDb).flat().some(i => (i.probes || []).length > 0) && (
            <NavItem label="Motor/Pump Probes" active={view?.typeKey === "__probes__"} color={IC}
              count={Object.values(mechDb).flat().reduce((s, i) => s + (i.probes?.length || 0), 0)}
              onClick={() => navTo("iac", "__probes__")} indent />
          )}
          <button onClick={() => setNewTypeDept("iac")}
            style={{ width: "calc(100% - 16px)", margin: "4px 8px", background: "transparent", border: `1px dashed ${IC}33`, borderRadius: 6, padding: "4px", color: IC, fontSize: 10, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
            <Plus size={10} /> New type
          </button>
        </nav>

        {/* MAIN */}
        <main style={{ flex: 1, overflowY: "auto", padding: 20, background: BG }}>
          {!view ? (
            <Overview
              mechDb={mechDb} iacDb={iacDb} customDefs={customDefs} onNav={navTo}
              onAddType={d => setNewTypeDept(d)}
              onMI={e => importDept("mech", e)} onME={() => exportDept("mech")}
              onII={e => importDept("iac", e)}  onIE={() => exportDept("iac")}
              onExportIO={exportIOList} mRef={mRef} iRef={iRef} />
          ) : view.typeKey === "__probes__" ? (
            <ProbesView mechDb={mechDb} onUpdate={updateProbe} />
          ) : (
            <EqTable dept={view.dept} equipKey={view.typeKey} def={currentDef}
              allItems={currentItems} displayed={displayed}
              q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort}
              onAdd={() => openAdd(view.dept, view.typeKey)}
              onEdit={(item, idx) => openEdit(view.dept, view.typeKey, item, idx)}
              onDuplicate={(item) => duplicateItem(view.dept, view.typeKey, item)}
              onDel={(item, idx) => setDel({ dept: view.dept, typeKey: view.typeKey, idx, tag: item.tagName })} />
          )}
        </main>
      </div>

      {/* MODALS */}
      {modal && (
        <ItemModal def={getDef(modal.dept, modal.typeKey)} equipKey={modal.typeKey} dept={modal.dept}
          modal={modal} form={form} errs={errs}
          onChange={(k, v) => { setForm(p => ({ ...p, [k]: v })); if (errs[k]) setErrs(p => ({ ...p, [k]: null })); }}
          onSave={saveItem} onClose={closeModal} />
      )}

      {newTypeDept && (
        <NewTypeModal dept={newTypeDept}
          onAdd={(key, def) => addCustomType(newTypeDept, key, def)}
          onClose={() => setNewTypeDept(null)} />
      )}

      {delC && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 500 }}>
          <div style={{ background: CRD, border: `1px solid ${DNG}55`, borderRadius: 11, padding: 22, maxWidth: 360, width: "92%" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 9 }}>
              <Trash2 size={18} color={DNG} />
              <h3 style={{ color: DNG, fontSize: 15, fontWeight: 600 }}>Delete Item</h3>
            </div>
            <p style={{ color: MUT, fontSize: 13, lineHeight: 1.6, marginBottom: 18 }}>
              Permanently remove <strong style={{ color: TXT, fontFamily: "monospace" }}>{delC.tag}</strong>? This cannot be undone.
            </p>
            <div style={{ display: "flex", gap: 7, justifyContent: "flex-end" }}>
              <button onClick={() => setDel(null)}
                style={{ background: SRF, border: `1px solid ${BDR2}`, borderRadius: 7, padding: "7px 14px", color: MUT, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>Cancel</button>
              <button onClick={confirmDel}
                style={{ background: DNG, border: "none", borderRadius: 7, padding: "7px 15px", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>Delete</button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 18, right: 18, background: toast.type === "error" ? DNG : toast.type === "info" ? ACC : toast.type === "warning" ? WRN : SUC, color: "#fff", padding: "10px 16px", borderRadius: 8, boxShadow: "0 4px 20px rgba(0,0,0,.5)", zIndex: 900, fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 7 }}>
          {(toast.type === "error" || toast.type === "warning") ? <AlertTriangle size={15} /> : <CheckCircle size={15} />}
          {toast.msg}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
