/* Tag helpers */
const mkInstanceTag=(tag,area)=>tag&&area?`${tag}-${area}`:tag||"";
const mkSignalTag=(tag,area,code)=>code?`${mkInstanceTag(tag,area)}-${code}`:"";

/* ═══════════════ HELPERS ═══════════════ */
const S=(e={})=>({background:BG,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 10px",color:TXT,fontSize:13,width:"100%",fontFamily:"inherit",outline:"none",...e});
function Dot({color,size=8}){return <span style={{width:size,height:size,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>;}
function Badge({label,color,bg}){return <span style={{background:bg,color,fontSize:10,padding:"3px 8px",borderRadius:5,fontWeight:600,whiteSpace:"nowrap"}}>{label}</span>;}

function FI({f,val,err,onChange}){
  const st=S({border:`1px solid ${err?DNG:BDR2}`});
  return(<div><label style={{fontSize:10,color:err?DNG:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:3,fontWeight:600}}>{f.l}{f.req?" *":""}</label>
    {f.t==="sel"?<select value={val} onChange={e=>onChange(e.target.value)} style={{...st,cursor:"pointer"}}><option value="">\u2014 Select \u2014</option>{f.o.map(o=><option key={o} value={o}>{o}</option>)}</select>
    :f.t==="area"?<textarea value={val} onChange={e=>onChange(e.target.value)} rows={3} style={{...st,resize:"vertical"}}/>
    :<input type={f.t==="num"?"number":"text"} value={val} onChange={e=>onChange(e.target.value)} placeholder={f.ph||""} style={st}/>}
    {err&&<p style={{color:DNG,fontSize:11,marginTop:3}}>{err}</p>}
  </div>);
}

function NavItem({label,active,color,count,onClick,indent=false,italic=false}){
  const[h,sH]=useState(false);
  return(<button onClick={onClick} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)}
    style={{width:"100%",textAlign:"left",background:active?`${color}14`:h?CRD:"transparent",border:"none",borderLeft:`3px solid ${active?color:"transparent"}`,padding:`8px 13px 8px ${indent?22:13}px`,color:active?color:h?MUT:DIM,fontSize:11,fontWeight:active?600:400,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",fontFamily:"inherit",fontStyle:italic?"italic":"normal"}}>
    <span>{label}</span>
    {count>0&&<span style={{background:active?`${color}25`:BDR,color:active?color:DIM,fontSize:10,padding:"1px 6px",borderRadius:10,fontWeight:700,fontFamily:"monospace"}}>{count}</span>}
  </button>);
}
function SecLabel({label,color}){return(<div style={{padding:"8px 13px 3px",fontSize:9,color,textTransform:"uppercase",letterSpacing:"0.14em",fontWeight:700,marginTop:4,display:"flex",alignItems:"center",gap:6}}><span style={{flex:1,height:1,background:`${color}30`}}/>{label}<span style={{flex:1,height:1,background:`${color}30`}}/></div>);}
function DeptIO({color,onImport,onExport,fileRef}){return(<div style={{display:"flex",gap:6}}><input type="file" accept=".xlsx,.xls" ref={fileRef} onChange={onImport} style={{display:"none"}}/><button onClick={()=>fileRef.current.click()} style={{background:CRD,border:`1px solid ${color}44`,borderRadius:7,padding:"5px 10px",color,fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontFamily:"inherit",fontWeight:500}}><Upload size={11}/>Import</button><button onClick={onExport} style={{background:`${color}22`,border:`1px solid ${color}55`,borderRadius:7,padding:"5px 10px",color,fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontFamily:"inherit"}}><Download size={11}/>Export</button></div>);}

/* ═══════════════ PROBES SUB-PANEL ═══════════════ */
function ProbesPanel({probes,onChange}){
  const addProbe=()=>{
    const id="p"+Date.now();
    const type="Vibration Sensor";
    const def=PROBE_TYPES[type];
    onChange([...probes,{id,type,position:"",sensorType:def.sensors[0],code:"",sig:def.sig,ioTag:"",plcCabinet:"",ioChannel:""}]);
  };
  const updateProbe=(id,k,v)=>onChange(probes.map(p=>p.id===id?{...p,[k]:v}:p));
  const removeProbe=(id)=>onChange(probes.filter(p=>p.id!==id));
  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <span style={{color:MUT,fontSize:12,fontWeight:600}}>Probes attached to this equipment</span>
      <button onClick={addProbe} style={{background:SUC,border:"none",borderRadius:6,padding:"5px 11px",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}><Plus size={11}/>Add Probe</button>
    </div>
    {probes.length===0&&<div style={{textAlign:"center",padding:"20px",color:DIM,fontSize:12,border:`1px dashed ${BDR2}`,borderRadius:8}}>No probes defined. Click "+ Add Probe" to start.</div>}
    {probes.map((p,i)=>{
      const def=PROBE_TYPES[p.type]||{sig:"AI",sensors:[]};
      return(<div key={p.id} style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:9,padding:14,marginBottom:8,position:"relative"}}>
        <button onClick={()=>removeProbe(p.id)} style={{position:"absolute",top:8,right:8,background:"transparent",border:"none",color:DIM,cursor:"pointer",fontSize:14,lineHeight:1}}><X size={13}/></button>
        <div style={{color:ACC,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Probe #{i+1}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
          <div>
            <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Type</label>
            <select value={p.type} onChange={e=>{const t=e.target.value;const d=PROBE_TYPES[t]||{sig:"AI",sensors:[]};updateProbe(p.id,"type",t);updateProbe(p.id,"sensorType",d.sensors[0]||"");updateProbe(p.id,"sig",d.sig);}}
              style={S({cursor:"pointer"})}>
              {Object.keys(PROBE_TYPES).map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Sensor Type</label>
            <select value={p.sensorType} onChange={e=>updateProbe(p.id,"sensorType",e.target.value)} style={S({cursor:"pointer"})}>
              {def.sensors.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Position / Location</label>
            <input value={p.position} onChange={e=>updateProbe(p.id,"position",e.target.value)} placeholder="e.g. Drive End, Coil A" style={S()}/>
          </div>
          <div>
            <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Signal Code (max 4 char) *</label>
            <input value={p.code} onChange={e=>updateProbe(p.id,"code",e.target.value.toUpperCase().slice(0,4))} placeholder="e.g. VIB1" style={S({fontFamily:"monospace",fontWeight:700,color:ACC})}/>
          </div>
          <div>
            <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Signal Type</label>
            <select value={p.sig} onChange={e=>updateProbe(p.id,"sig",e.target.value)} style={S({cursor:"pointer"})}>

            <div style={{background:SRF,border:`1px solid ${BDR}`,borderRadius:7,padding:"7px 10px",fontSize:12,color:p.code?ACC:DIM,fontFamily:"monospace",fontWeight:600}}>
              {p.code?"[TAG]-[AREA]-"+p.code:"(set code)"}

            <input value={p.ioTag||""} onChange={e=>updateProbe(p.id,"ioTag",e.target.value)} placeholder="IO Tag" style={S({fontSize:11,color:ACC})}/>
            <input value={p.plcCabinet||""} onChange={e=>updateProbe(p.id,"plcCabinet",e.target.value)} placeholder="Cabinet / PLC" style={S({fontSize:11})}/>
            <input value={p.ioChannel||""} onChange={e=>updateProbe(p.id,"ioChannel",e.target.value)} placeholder="Channel Address" style={S({fontSize:11,fontFamily:"monospace"})}/>
          </div>
        </div>
      </div>);
    })}
  </div>);
}

/* ═══════════════ CONTROLLER + IO SIGNALS PANEL ═══════════════ */
function ControllerPanel({equipKey,tag,area,form,onChange}){
  const options=CTRL_OPTIONS[equipKey]||[];
  if(!options.length)return null;
  const ctrl=form.controller||{type:"None",brand:"",model:"",commProtocol:""};
  const sigs=form.signals||{};
  const variants=CV[ctrl.type]||[];
  const setCtrl=(k,v)=>{
    const nc={...ctrl,[k]:v};
    onChange("controller",nc);
    if(k==="type")onChange("signals",{});
  };
  const setSig=(id,k,v)=>{const ns={...sigs,[id]:{...(sigs[id]||{}),code:(sigs[id]||{}).code||id,[k]:v}};onChange("signals",ns);};
  const toggleSig=(id,def)=>{
    const cur=sigs[id]||{code:id,signalType:def.sig,enabled:false,connMethod:"Hardwired",protocol:""};
    setSig(id,"enabled",!cur.enabled);
    if(!sigs[id])setSig(id,"code",id);
    if(!sigs[id])setSig(id,"signalType",def.sig);
  };
  const instTag=mkInstanceTag(tag,area);
  return(<div>
    {/* Controller definition */}
    <div style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:9,padding:14,marginBottom:14}}>
      <div style={{color:MUT,fontSize:11,fontWeight:600,marginBottom:10,display:"flex",alignItems:"center",gap:6}}><Settings size={13}/>Controller Definition</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
        <div>
          <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Controller Type</label>
          <select value={ctrl.type||"None"} onChange={e=>setCtrl("type",e.target.value)} style={S({cursor:"pointer"})}>
            {options.map(o=><option key={o} value={o}>{CTRL_LABEL[o]||o}</option>)}
          </select>
        </div>
        {ctrl.type!=="None"&&ctrl.type&&<>
          <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Brand</label><input value={ctrl.brand||""} onChange={e=>setCtrl("brand",e.target.value)} placeholder="e.g. ABB, Siemens" style={S()}/></div>
          <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Model</label><input value={ctrl.model||""} onChange={e=>setCtrl("model",e.target.value)} placeholder="e.g. ACS880, G120" style={S()}/></div>
          <div><label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:3,fontWeight:600}}>Communication Protocol</label>
            <select value={ctrl.commProtocol||""} onChange={e=>setCtrl("commProtocol",e.target.value)} style={S({cursor:"pointer"})}>
              <option value="">\u2014 Select \u2014</option>{PROTOCOLS.map(p=><option key={p} value={p}>{p}</option>)}
            </select>
          </div>
        </>}
      </div>
    </div>

    {/* IO Signals / Variants */}
    {ctrl.type&&ctrl.type!=="None"&&variants.length>0&&<div>
      <div style={{color:MUT,fontSize:11,fontWeight:600,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><Zap size={13}/>IO Signals \u2014 Variants <span style={{color:DIM,fontSize:10,fontWeight:400}}>({variants.filter(v=>(sigs[v.id]||{}).enabled).length} of {variants.length} enabled)</span></div>
      
      {/* Header */}
      <div style={{display:"grid",gridTemplateColumns:"30px 1fr 70px 50px 100px 1fr 200px",gap:6,padding:"5px 8px",background:SRF,borderRadius:"7px 7px 0 0",borderBottom:`1px solid ${BDR}`}}>
        {["","Signal Name","Code","Type","Wiring","Protocol","Generated Tag"].map((h,i)=><div key={i} style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",fontWeight:600}}>{h}</div>)}
      </div>
      
      {variants.map(vd=>{
        const sv=sigs[vd.id]||{};
        const enabled=sv.enabled||false;
        const code=sv.code||vd.id;
        const sigType=sv.signalType||vd.sig;
        const connMethod=sv.connMethod||"Hardwired";
        const protocol=sv.protocol||"";
        const sc=SIGC[sigType]||MUT;
        const fullTag=enabled&&code?mkSignalTag(tag,area,code):"";
        return(<div key={vd.id} style={{display:"grid",gridTemplateColumns:"30px 1fr 70px 50px 100px 1fr 200px",gap:6,padding:"6px 8px",borderBottom:`1px solid ${BDR}`,background:enabled?`${sc}08`:"transparent",alignItems:"center"}}>
          <input type="checkbox" checked={enabled} onChange={()=>toggleSig(vd.id,vd)} style={{cursor:"pointer",accentColor:sc}}/>
          <span style={{fontSize:12,color:enabled?TXT:DIM}}>{vd.label}</span>
          <input value={code} onChange={e=>{if(enabled)setSig(vd.id,"code",e.target.value.toUpperCase().slice(0,4));}} disabled={!enabled}
            style={{background:enabled?BG:"transparent",border:`1px solid ${enabled?BDR2:"transparent"}`,borderRadius:5,padding:"3px 6px",color:enabled?ACC:DIM,fontSize:11,fontFamily:"monospace",fontWeight:700,outline:"none",width:"100%"}}/>
          <select value={sigType} onChange={e=>{if(enabled)setSig(vd.id,"signalType",e.target.value);}} disabled={!enabled}
            style={{background:enabled?BG:"transparent",border:`1px solid ${enabled?BDR2:"transparent"}`,borderRadius:5,padding:"3px 4px",color:enabled?sc:DIM,fontSize:11,outline:"none",cursor:enabled?"pointer":"default"}}>
            {["AI","AO","DI","DO"].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <select value={connMethod} onChange={e=>{if(enabled)setSig(vd.id,"connMethod",e.target.value);}} disabled={!enabled}
            style={{background:enabled?BG:"transparent",border:`1px solid ${enabled?BDR2:"transparent"}`,borderRadius:5,padding:"3px 4px",color:enabled?TXT:DIM,fontSize:10,outline:"none",cursor:enabled?"pointer":"default"}}>
            <option value="Hardwired">Hardwired</option><option value="Communication">Comms</option>
          </select>
          {connMethod==="Communication"&&enabled
            ?<select value={protocol} onChange={e=>setSig(vd.id,"protocol",e.target.value)} style={{background:BG,border:`1px solid ${BDR2}`,borderRadius:5,padding:"3px 4px",color:TXT,fontSize:10,outline:"none",cursor:"pointer"}}>
                <option value="">\u2014 Protocol \u2014</option>{PROTOCOLS.filter(p=>p!=="Hardwired").map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            :<span style={{fontSize:10,color:DIM}}>{connMethod==="Communication"?"\u2014 set protocol":"Hardwired"}</span>}
          <span style={{fontSize:10,color:fullTag?ACC:DIM,fontFamily:"monospace",fontWeight:fullTag?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fullTag||"\u2014"}</span>
        </div>);
      })}
    </div>}
  </div>);
}

/* ═══════════════ MODAL ═══════════════ */
function ItemModal({def,equipKey,dept,modal,form,errs,onChange,onSave,onClose}){
  const color=def?.color||ACC;

  const tabs=["General",...(hasProbes?["Probes"]:[]),(hasController?["Controller"]:[])].flat();
  const[tab,setTab]=useState("General");
  const tag=form.tagName||"";const area=form.area||"";
  const instTag=mkInstanceTag(tag,area);
  const probes=form.probes||[];
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",display:"flex",alignItems:"stretch",justifyContent:"flex-end",zIndex:400}} onClick={onClose}>
    <div style={{background:SRF,width:tabs.length>1?820:700,maxWidth:"97vw",overflowY:"auto",borderLeft:`3px solid ${color}`,padding:22,display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
      
      {/* Modal header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <Dot color={color} size={10}/>
            <h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:16,color}}>{modal.mode==="add"?`New ${def?.label?.replace(/s$/,"")}`:`Edit ${form.tagName}`}</h2>
            <span style={{fontSize:10,color:dept==="mech"?MC:IC,background:dept==="mech"?`${MC}18`:`${IC}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>{dept==="mech"?"MECHANICS":"I&C"}</span>
          </div>
          {instTag&&<div style={{fontFamily:"monospace",fontSize:11,color:ACC,background:`${ACC}10`,padding:"3px 10px",borderRadius:5,display:"inline-block"}}>Instance Tag: <strong>{instTag}</strong></div>}
        </div>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"5px 9px",color:MUT,cursor:"pointer",display:"flex",alignItems:"center"}}><X size={14}/></button>
      </div>

      {/* Tag Name + Area + P&ID (always visible at top) */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,background:CRD,border:`1px solid ${color}44`,borderRadius:8,padding:13,marginBottom:14}}>
        <div>
          <label style={{fontSize:10,color,textTransform:"uppercase",letterSpacing:"0.1em",display:"block",marginBottom:4,fontWeight:600}}>Tag Name *</label>
          <input value={form.tagName||""} onChange={e=>onChange("tagName",e.target.value.toUpperCase())} placeholder={`e.g. ${def?.prefix}-001`}
            style={{width:"100%",background:SRF,border:`1px solid ${errs.tagName?DNG:BDR2}`,borderRadius:6,padding:"7px 11px",color:TXT,fontSize:14,fontFamily:"monospace",fontWeight:700,outline:"none"}}/>
          {errs.tagName&&<p style={{color:DNG,fontSize:11,marginTop:3}}>{errs.tagName}</p>}
        </div>
        <div>
          <label style={{fontSize:10,color:MUT,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>Area Code</label>
          <input value={form.area||""} onChange={e=>onChange("area",e.target.value.toUpperCase())} placeholder="e.g. IN001"
            style={{width:"100%",background:SRF,border:`1px solid ${BDR2}`,borderRadius:6,padding:"7px 11px",color:TXT,fontSize:13,fontFamily:"monospace",fontWeight:600,outline:"none"}}/>
        </div>
        <div>
          <label style={{fontSize:10,color:MUT,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>P&ID Reference</label>
          <input value={form.pidRef||""} onChange={e=>onChange("pidRef",e.target.value.toUpperCase())} placeholder="e.g. PID-001"
            style={{width:"100%",background:SRF,border:`1px solid ${BDR2}`,borderRadius:6,padding:"7px 11px",color:TXT,fontSize:13,fontFamily:"monospace",outline:"none"}}/>
        </div>
      </div>

      {/* Tabs */}
      {tabs.length>1&&<div style={{display:"flex",gap:2,marginBottom:16,background:CRD,padding:4,borderRadius:8}}>
        {tabs.map(t=><button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"7px 4px",borderRadius:6,border:"none",background:tab===t?SRF:"transparent",color:tab===t?TXT:DIM,fontSize:12,fontWeight:tab===t?600:400,cursor:"pointer",fontFamily:"inherit",transition:"all .12s"}}>{t}</button>)}
      </div>}

      {/* Tab content */}
      <div style={{flex:1}}>
        {tab==="General"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          {def?.fields?.map(f=><div key={f.k} style={{gridColumn:f.t==="area"?"span 2":"span 1"}}><FI f={f} val={form[f.k]||""} err={errs[f.k]} onChange={v=>onChange(f.k,v)}/></div>)}
        </div>}
        {tab==="Probes"&&<ProbesPanel probes={probes} onChange={v=>onChange("probes",v)}/>}
        {tab==="Controller"&&<ControllerPanel equipKey={equipKey} tag={tag} area={area} form={form}
          onChange={(k,v)=>onChange(k,v)}/>}
      </div>

      {/* Footer */}
      <div style={{display:"flex",gap:7,justifyContent:"flex-end",paddingTop:14,marginTop:14,borderTop:`1px solid ${BDR}`,flexShrink:0}}>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 15px",color:MUT,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Cancel</button>
        <button onClick={onSave} style={{background:color,border:"none",borderRadius:7,padding:"7px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}>
          <Plus size={13}/>{modal.mode==="add"?"Add":"Save Changes"}
        </button>
      </div>
    </div>
  </div>);
}

/* ═══════════════ EQUIPMENT TABLE ═══════════════ */
function EqTable({dept,equipKey,def,allItems,displayed,q,setQ,stF,setStF,sort,setSort,onAdd,onEdit,onDel}){
  const[hovRow,setHov]=useState(null);
  const sumFields=def.fields.filter(f=>def.summary.includes(f.k));
  const dC=dept==="mech"?MC:IC;
  return(<div>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
          <Dot color={def.color} size={10}/><h1 style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:TXT}}>{def.label}</h1>
          <span style={{fontSize:10,color:dC,background:`${dC}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>{dept==="mech"?"MECHANICS":"I&C"}</span>
          {def.custom&&<span style={{fontSize:9,color:def.color,background:`${def.color}15`,padding:"2px 6px",borderRadius:4}}>custom</span>}

      </div>
      <button onClick={onAdd} style={{background:def.color,border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"inherit",flexShrink:0}}>
        <Plus size={13}/>Add {def.label.replace(/s$/,"")}
      </button>
    </div>
    <div style={{display:"flex",gap:7,marginBottom:11}}>
      <div style={{flex:1,position:"relative"}}><Search size={13} color={DIM} style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search tag, area, description\u2026" style={S({paddingLeft:29,border:`1px solid ${BDR}`,background:CRD})}/></div>
      <select value={stF} onChange={e=>setStF(e.target.value)} style={S({width:"auto",background:CRD,border:`1px solid ${BDR}`,cursor:"pointer",color:stF==="All"?DIM:TXT})}>

      </select>
    </div>
    {displayed.length===0?(<div style={{textAlign:"center",padding:"48px",color:DIM}}>
      <div style={{fontSize:28,marginBottom:10,opacity:.2}}>\u25cb</div>
      <div style={{fontSize:14,color:MUT,marginBottom:4}}>{allItems.length===0?`No ${def.label} registered yet`:"No items match"}</div>
      {allItems.length===0&&<button onClick={onAdd} style={{marginTop:12,background:def.color,border:"none",borderRadius:8,padding:"8px 18px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:5}}><Plus size={13}/>Add first {def.label.replace(/s$/,"")}</button>}
    </div>):(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>

          {[{k:"tagName",l:"Tag"},{k:"area",l:"Area"},{k:"pidRef",l:"P&ID"},...sumFields,{k:"status",l:"Status"}].map(f=>(
            <th key={f.k} onClick={()=>setSort(p=>({k:f.k,d:p.k===f.k&&p.d==="asc"?"desc":"asc"}))}
              style={{padding:"7px 10px",textAlign:"left",fontSize:10,cursor:"pointer",userSelect:"none",color:sort.k===f.k?def.color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>
              {f.l}{sort.k===f.k?(sort.d==="asc"?" \u2191":" \u2193"):""}
            </th>))}
          <th style={{padding:"7px 10px",textAlign:"right",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em"}}>Actions</th>
        </tr></thead>

          const ri=allItems.indexOf(item);const sc=STC[item.status]||{c:MUT,b:BDR};
          const probeCount=(item.probes||[]).length;
          const sigCount=Object.values(item.signals||{}).filter(s=>s.enabled).length;
          return(<tr key={item.tagName} onMouseEnter={()=>setHov(di)} onMouseLeave={()=>setHov(null)} style={{borderBottom:`1px solid ${BDR}`,background:hovRow===di?`${CRD}bb`:"transparent"}}>

            <td style={{padding:"9px 10px"}}>{item.status?<Badge label={item.status} color={sc.c} bg={sc.b}/>:<span style={{color:BDR2}}>\u2014</span>}</td>
            <td style={{padding:"9px 10px",textAlign:"right",whiteSpace:"nowrap"}}>
              <button onClick={()=>onEdit(item,ri)} style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 8px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:3}}><Edit2 size={11}/>Edit</button>
              <button onClick={()=>onDel(item,ri)} style={{background:"transparent",border:`1px solid ${DNG}40`,borderRadius:5,padding:"4px 8px",color:DNG,fontSize:11,cursor:"pointer",fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:3}}><Trash2 size={11}/></button>
            </td>
          </tr>);})}
        </tbody>
      </table></div>
      <div style={{padding:"6px 10px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}>
        <span>Showing {displayed.length} of {allItems.length}</span>
        <span>{allItems.filter(i=>i.status==="Active").length} active{dept==="iac"?` \u00b7 ${allItems.filter(i=>i.ioTag).length} IO assigned`:""}</span>
      </div>
    </div>)}
  </div>);
}

    </div>:(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>
          {["Full Tag","Parent Equipment","Type","Sensor","Position","Sig","IO Tag","Cabinet","Channel"].map(h=>(
            <th key={h} style={{padding:"7px 10px",textAlign:"left",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>{rows.map((r,i)=>(

/* ═══════════════ APP ═══════════════ */
function App(){
  const[project,setProject]=useState("Water Treatment Plant \u2014 Project Alpha");
  const[editP,setEditP]=useState(false);const[tmpP,setTmpP]=useState("");
  const[mechDb,setMechDb]=useState(()=>Object.fromEntries(MECH_KEYS.map(k=>[k,[]])));
  const[iacDb,setIacDb]=useState(()=>Object.fromEntries(IAC_KEYS.map(k=>[k,[]])));
  const[customDefs,setCustomDefs]=useState({mech:{},iac:{}});
  const[view,setView]=useState(null);
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});const[errs,setErrs]=useState({});
  const[q,setQ]=useState("");const[stF,setStF]=useState("All");const[sort,setSort]=useState({k:"tagName",d:"asc"});
  const[toast,setToast]=useState(null);const[delC,setDel]=useState(null);const[newTypeDept,setNewTypeDept]=useState(null);
  const mRef=useRef(null),iRef=useRef(null);

  const allTags=useMemo(()=>[...Object.values(mechDb).flat(),...Object.values(iacDb).flat()].map(e=>e.tagName?.toUpperCase()),[mechDb,iacDb]);
  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);},[]);

  const getDef=(dept,key)=>{
    if(key==="__probes__")return{label:"Probes",color:IC,prefix:"",fields:[],summary:[]};
    if(dept==="mech")return MECH_DEF[key]||(customDefs.mech||{})[key];
    return IAC_DEF[key]||(customDefs.iac||{})[key];
  };
  const getDb=d=>d==="mech"?mechDb:iacDb;
  const setDb=(d,v)=>d==="mech"?setMechDb(v):setIacDb(v);

  const openAdd=(dept,typeKey)=>{setForm({status:"Active",probes:[],controller:{type:"None"},signals:{}});setErrs({});setModal({mode:"add",dept,typeKey});};
  const openEdit=(dept,typeKey,item,idx)=>{setForm({...item,probes:item.probes||[],controller:item.controller||{type:"None"},signals:item.signals||{}});setErrs({});setModal({mode:"edit",dept,typeKey,item,idx});};
  const closeModal=()=>{setModal(null);setForm({});setErrs({});};

  const validate=()=>{
    const e={},tag=(form.tagName||"").trim().toUpperCase();
    if(!tag){e.tagName="Tag name is required";}
    else{const others=modal.mode==="edit"?allTags.filter(t=>t!==modal.item?.tagName?.toUpperCase()):allTags;if(others.includes(tag))e.tagName="Tag name already exists";}
    const def=getDef(modal.dept,modal.typeKey);
    (def?.fields||[]).forEach(f=>{if(f.req&&!form[f.k]?.trim())e[f.k]=`${f.l} is required`;});
    setErrs(e);return!Object.keys(e).length;
  };

  const saveItem=()=>{
    if(!validate())return;
    const item={...form,tagName:(form.tagName||"").trim().toUpperCase()};
    const db=getDb(modal.dept);const upd={...db,[modal.typeKey]:[...(db[modal.typeKey]||[])]};
    if(modal.mode==="add")upd[modal.typeKey].push(item);else upd[modal.typeKey][modal.idx]=item;
    setDb(modal.dept,upd);showToast(modal.mode==="add"?`${item.tagName} added`:`${item.tagName} updated`);closeModal();
  };

  const confirmDel=()=>{
    const{dept,typeKey,idx,tag}=delC;const db=getDb(dept);const upd={...db,[typeKey]:[...(db[typeKey]||[])]};
    upd[typeKey].splice(idx,1);setDb(dept,upd);showToast(`${tag} removed`,"info");setDel(null);
  };

  const addCustomType=(dept,key,def)=>{
    setCustomDefs(p=>({...p,[dept]:{...(p[dept]||{}),[key]:def}}));
    if(dept==="mech")setMechDb(p=>({...p,[key]:[]}));else setIacDb(p=>({...p,[key]:[]}));
    showToast(`${def.label} type created`);
  };

  /* ── Export functions ── */
  const exportDept=(dept)=>{
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const db=getDb(dept);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[`AQUABASE \u2014 ${dept==="mech"?"MECHANICS":"I&C"}`],["Project:",project],["Exported:",new Date().toLocaleString()],[],["Type","Count"],...Object.entries(defs).map(([k,d])=>[d.label,(db[k]||[]).length])]),"Summary");
    Object.entries(defs).forEach(([k,def])=>{const items=db[k]||[];if(!items.length)return;
      const h=["Tag Name","Area","P&ID Ref",...def.fields.map(f=>f.l)];
      const r=items.map(i=>[i.tagName,i.area||"",i.pidRef||"",...def.fields.map(f=>i[f.k]??"")]);
      const ws=XLSX.utils.aoa_to_sheet([h,...r]);ws["!cols"]=h.map((_,i)=>({wch:i===0?14:i<=2?10:i===3?28:16}));
      XLSX.utils.book_append_sheet(wb,ws,def.label.substring(0,31));
    });
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_${dept==="mech"?"MECHANICS":"IAC"}.xlsx`);showToast(`${dept==="mech"?"Mechanics":"I&C"} exported`);
  };

  const exportIOList=()=>{
    const wb=XLSX.utils.book_new();const rows=[];
    const header=["Full Signal Tag","Instance Tag","Equip. Tag","Area","P&ID Ref","Dept","Equipment Type","Signal Name","Signal Code","Signal Type","Wiring","Protocol","Controller Type","Controller Brand","Controller Model"];
    // I&C instruments
    const iDefs={...IAC_DEF,...(customDefs.iac||{})};
    Object.entries(iDefs).forEach(([k,def])=>{(iacDb[k]||[]).forEach(item=>{
      const inst=mkInstanceTag(item.tagName,item.area||"");
      if(item.ioTag||item.signalType){rows.push([mkSignalTag(item.tagName,item.area||"",item.ioTag||"IO"),inst,item.tagName,item.area||"",item.pidRef||"","I&C",def.label,item.description||"",item.ioTag||"",item.signalType||"","Hardwired","",def.label,"",item.model||""]);}
    });});
    // Mechanics: controller variants
    const mDefs={...MECH_DEF,...(customDefs.mech||{})};
    Object.entries(mDefs).forEach(([k,def])=>{(mechDb[k]||[]).forEach(item=>{
      const inst=mkInstanceTag(item.tagName,item.area||"");const ctrl=item.controller||{};
      Object.entries(item.signals||{}).forEach(([vid,sv])=>{
        if(!sv.enabled)return;
        const vdef=(CV[ctrl.type]||[]).find(v=>v.id===vid)||{label:vid};
        rows.push([mkSignalTag(item.tagName,item.area||"",sv.code||vid),inst,item.tagName,item.area||"",item.pidRef||"","MECH",def.label,vdef.label,sv.code||vid,sv.signalType||vdef.sig||"",sv.connMethod||"Hardwired",sv.connMethod==="Communication"?sv.protocol||"":"",CTRL_LABEL[ctrl.type]||ctrl.type||"",ctrl.brand||"",ctrl.model||""]);
      });
      // Probes
      (item.probes||[]).forEach(p=>{if(!p.code)return;
        rows.push([mkSignalTag(item.tagName,item.area||"",p.code),inst,item.tagName,item.area||"",item.pidRef||"","MECH (Probe)",def.label,`${p.type} \u2014 ${p.position||""}`,p.code,p.sig||"AI","Hardwired (Probe)","",p.sensorType||"","",""]);
      });
    });});
    if(!rows.length){showToast("No IO data yet \u2014 add controllers/variants first","warning");return;}
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);ws["!cols"]=header.map((_,i)=>({wch:i===0?26:i<=2?14:14}));
    XLSX.utils.book_append_sheet(wb,ws,"IO List");
    const sigs=["AI","AO","DI","DO","HART AI","HART AO","Pulse"];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["IO LIST SUMMARY"],["Project:",project],["Generated:",new Date().toLocaleString()],[],["Signal Type","Count"],...sigs.map(s=>[s,rows.filter(r=>r[9]===s).length]),["",""],["TOTAL",rows.length]]),"Summary");
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_IO_List.xlsx`);showToast(`IO List exported \u2014 ${rows.length} signals`);
  };

  const importDept=(dept,e)=>{
    const file=e.target.files[0];if(!file)return;
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const reader=new FileReader();reader.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:"binary"});let a=0,s=0;const ct=new Set(allTags);const db=getDb(dept);const upd={...db};
      Object.entries(defs).forEach(([k,def])=>{const sh=wb.SheetNames.find(n=>n.toLowerCase().includes(def.label.toLowerCase().slice(0,5)));if(!sh)return;
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});if(rows.length<2)return;const hd=rows[0];if(!upd[k])upd[k]=[];
        rows.slice(1).forEach(row=>{if(!row[0])return;const tag=String(row[0]).toUpperCase().trim();if(ct.has(tag)){s++;return;}
          const item={tagName:tag,probes:[],controller:{type:"None"},signals:{}};
          hd.forEach((h,i)=>{if(h==="Tag Name")return;if(h==="Area"){item.area=row[i]?String(row[i]):"";return;}if(h==="P&ID Ref"){item.pidRef=row[i]?String(row[i]):"";return;}const field=def.fields.find(f=>f.l===h);if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";});
          upd[k].push(item);ct.add(tag);a++;});});
      setDb(dept,upd);showToast(`${a} added${s?`, ${s} skipped`:""}`,a?"success":"warning");
    }catch{showToast("Import failed","error");}};reader.readAsBinaryString(file);e.target.value="";
  };

  const currentDef=view?getDef(view.dept,view.typeKey):null;
  const currentItems=view&&view.typeKey!=="__probes__"?(getDb(view.dept)[view.typeKey]||[]):[];
  const displayed=useMemo(()=>{
    if(!view||view.typeKey==="__probes__")return[];let list=[...currentItems];
    if(q){const lq=q.toLowerCase();list=list.filter(i=>Object.values(i).some(v=>String(v).toLowerCase().includes(lq)));}
    if(stF!=="All")list=list.filter(i=>i.status===stF);
    list.sort((a,b)=>{const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);});return list;
  },[view,currentItems,q,stF,sort]);

  const mDefs={...MECH_DEF,...(customDefs.mech||{})};const iDefs={...IAC_DEF,...(customDefs.iac||{})};

  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",background:BG,color:TXT,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}}>
    <style>{`*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:${SRF}}::-webkit-scrollbar-thumb{background:${BDR2};border-radius:3px}::-webkit-scrollbar-thumb:hover{background:${ACC}}select option{background:${CRD}}`}</style>

    <header style={{height:54,background:SRF,borderBottom:`1px solid ${BDR}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:30,height:30,background:`linear-gradient(135deg,${ACC},#0369a1)`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}><Droplets size={16} color="#fff"/></div>
          <div><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:ACC}}>AquaBase</div><div style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em"}}>Equipment Registry</div></div>
        </div>
        <div style={{width:1,height:26,background:BDR}}/>
        {editP?<input autoFocus value={tmpP} onChange={e=>setTmpP(e.target.value)} onBlur={()=>{setProject(tmpP);setEditP(false);}} onKeyDown={e=>{if(e.key==="Enter"){setProject(tmpP);setEditP(false);}if(e.key==="Escape")setEditP(false);}} style={{background:CRD,border:`1px solid ${ACC}`,borderRadius:6,padding:"3px 9px",color:TXT,fontSize:12,fontWeight:500,minWidth:240,outline:"none"}}/>
        :<button onClick={()=>{setTmpP(project);setEditP(true);}} style={{background:"none",border:"none",color:TXT,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"2px 5px",borderRadius:5}}>{project}<Pencil size={11} color={DIM}/></button>}
      </div>
      <span style={{fontSize:10,color:DIM}}>IO List = generated output \u00b7 Tag format: EQUIP-AREA-CODE</span>
    </header>

    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      <nav style={{width:204,background:SRF,borderRight:`1px solid ${BDR}`,overflowY:"auto",flexShrink:0,paddingBottom:16}}>
        <NavItem label="Overview" active={!view} color={ACC} count={[...Object.values(mechDb),...Object.values(iacDb)].flat().length} onClick={()=>setView(null)}/>
        <SecLabel label="Mechanics" color={MC}/>
        {Object.entries(mDefs).map(([k,def])=><NavItem key={k} label={def.label} active={view?.dept==="mech"&&view?.typeKey===k} color={def.color} count={mechDb[k]?.length||0} onClick={()=>navTo("mech",k)} indent italic={def.custom}/>)}
        <button onClick={()=>setNewTypeDept("mech")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${MC}33`,borderRadius:6,padding:"4px",color:MC,fontSize:10,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><Plus size={10}/>New type</button>
        <SecLabel label="I&C" color={IC}/>
        {Object.entries(iDefs).map(([k,def])=><NavItem key={k} label={def.label} active={view?.dept==="iac"&&view?.typeKey===k} color={def.color} count={iacDb[k]?.length||0} onClick={()=>navTo("iac",k)} indent italic={def.custom}/>)}
        {Object.values(mechDb).flat().some(i=>i.probes?.length>0)&&<NavItem label="Motor/Pump Probes" active={view?.typeKey==="__probes__"} color={IC} count={Object.values(mechDb).flat().reduce((s,i)=>s+(i.probes?.length||0),0)} onClick={()=>navTo("iac","__probes__")} indent/>}
        <button onClick={()=>setNewTypeDept("iac")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${IC}33`,borderRadius:6,padding:"4px",color:IC,fontSize:10,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><Plus size={10}/>New type</button>
      </nav>

      <main style={{flex:1,overflowY:"auto",padding:20,background:BG}}>
        {!view?<Overview mechDb={mechDb} iacDb={iacDb} customDefs={customDefs} onNav={navTo} onAddType={d=>setNewTypeDept(d)} onMI={e=>importDept("mech",e)} onME={()=>exportDept("mech")} onII={e=>importDept("iac",e)} onIE={()=>exportDept("iac")} onExportIO={exportIOList} mRef={mRef} iRef={iRef}/>
        :view.typeKey==="__probes__"?<ProbesView mechDb={mechDb}/>
        :<EqTable dept={view.dept} equipKey={view.typeKey} def={currentDef} allItems={currentItems} displayed={displayed} q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort}
            onAdd={()=>openAdd(view.dept,view.typeKey)} onEdit={(item,idx)=>openEdit(view.dept,view.typeKey,item,idx)} onDel={(item,idx)=>setDel({dept:view.dept,typeKey:view.typeKey,idx,tag:item.tagName})}/>}
      </main>
    </div>

    {modal&&<ItemModal def={getDef(modal.dept,modal.typeKey)} equipKey={modal.typeKey} dept={modal.dept} modal={modal} form={form} errs={errs}
      onChange={(k,v)=>{setForm(p=>({...p,[k]:v}));if(errs[k])setErrs(p=>({...p,[k]:null}));}} onSave={saveItem} onClose={closeModal}/>}

    {newTypeDept&&<NewTypeModal dept={newTypeDept} onAdd={(key,def)=>addCustomType(newTypeDept,key,def)} onClose={()=>setNewTypeDept(null)}/>}

    {delC&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}>
      <div style={{background:CRD,border:`1px solid ${DNG}55`,borderRadius:11,padding:22,maxWidth:360,width:"92%"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}><Trash2 size={18} color={DNG}/><h3 style={{color:DNG,fontSize:15,fontWeight:600}}>Delete Item</h3></div>
        <p style={{color:MUT,fontSize:13,lineHeight:1.6,marginBottom:18}}>Permanently remove <strong style={{color:TXT,fontFamily:"monospace"}}>{delC.tag}</strong>?</p>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
          <button onClick={()=>setDel(null)} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
          <button onClick={confirmDel} style={{background:DNG,border:"none",borderRadius:7,padding:"7px 15px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>
        </div>
      </div>
    </div>}

    {toast&&<div style={{position:"fixed",bottom:18,right:18,background:toast.type==="error"?DNG:toast.type==="info"?ACC:toast.type==="warning"?WRN:SUC,color:"#fff",padding:"10px 16px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:900,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:7}}>
      {toast.type==="error"||toast.type==="warning"?<AlertTriangle size={15}/>:<CheckCircle size={15}/>}{toast.msg}
    </div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
