const ALL=[...MECH,...INST];

/* ── Persistence ── */
function loadDb(){
  try{const s=localStorage.getItem("aquabase_db");if(s)return JSON.parse(s);}catch{}
  return Object.fromEntries(ALL.map(k=>[k,[]]));
}
function loadProject(){
  try{return localStorage.getItem("aquabase_project")||"Water Treatment Plant — Project Alpha";}catch{return "Water Treatment Plant — Project Alpha";}
}

/* ── FieldInput ── */
function FieldInput({f,val,err,onChange}){
  const base={width:"100%",background:BG,border:`1px solid ${err?DNG:BDR2}`,
    borderRadius:7,padding:"7px 11px",color:TXT,fontSize:13};
  return(
    <div>
      <label style={{fontSize:10,color:err?DNG:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>
        {f.l}{f.req?" *":""}
      </label>
      {f.t==="sel"
        ?<select value={val} onChange={e=>onChange(e.target.value)} style={{...base,cursor:"pointer"}}>
           <option value="">— Select —</option>
           {f.o.map(o=><option key={o} value={o}>{o}</option>)}
         </select>
        :f.t==="area"
        ?<textarea value={val} onChange={e=>onChange(e.target.value)} rows={3} style={{...base,resize:"vertical"}}/>
        :<input type={f.t==="num"?"number":"text"} value={val} onChange={e=>onChange(e.target.value)} style={base}/>
      }
      {err&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{err}</p>}
    </div>
  );
}

/* ── NavItem ── */
function NavItem({label,icon,count,active,color,onClick}){
  return(
    <button onClick={onClick} className="nav-btn"
      style={{width:"100%",textAlign:"left",background:active?`${color}14`:"transparent",border:"none",
        borderLeft:`3px solid ${active?color:"transparent"}`,padding:"9px 13px",
        color:active?color:DIM,fontSize:12,fontWeight:active?600:400,
        display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}}>
      <span style={{display:"flex",alignItems:"center",gap:7}}>
        <i className={`ti ${icon}`} style={{fontSize:15,opacity:active?1:0.65}}/>
        {label}
      </span>
      {count>0&&<span style={{background:active?`${color}25`:BDR,color:active?color:DIM,fontSize:10,padding:"1px 6px",borderRadius:10,fontWeight:700,fontFamily:"monospace"}}>{count}</span>}
    </button>
  );
}

/* ── StatCard ── */
function StatCard({n,label,icon,color}){
  return(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderTop:`3px solid ${color}`,borderRadius:11,padding:"15px 17px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <div>
        <div style={{color:DIM,fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{label}</div>
        <div style={{color,fontSize:30,fontWeight:700,fontFamily:"monospace",lineHeight:1}}>{n}</div>
      </div>
      <i className={`ti ${icon}`} style={{fontSize:22,color,opacity:0.35}}/>
    </div>
  );
}

  const maint=Object.values(db).flat().filter(i=>i.status==="Maintenance").length;

      <div style={{marginBottom:20}}>
        <h1 style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:TXT,marginBottom:3}}>Equipment Overview</h1>
        <p style={{color:DIM,fontSize:12}}>Company-wide water industry equipment registry · Data persists in browser localStorage</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:11,marginBottom:24}}>
        <StatCard n={total} label="Total Equipment" icon="ti-database" color={ACC}/>
        <StatCard n={acts}  label="Active"           icon="ti-circle-check" color={SUC}/>
        <StatCard n={maint} label="In Maintenance"   icon="ti-tool" color={WRN}/>
      </div>
      {["Mechanical","Instrumentation"].map(grp=>(
        <div key={grp} style={{marginBottom:22}}>
          <div style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600,marginBottom:9}}>{grp}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:9}}>
            {ALL.filter(k=>EQ[k].group===grp).map(k=>{
              const cnt=db[k].length;
              return(
                <button key={k} onClick={()=>onNav(k)} className="eq-card"
                  style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,padding:"14px 13px",
                    textAlign:"left",cursor:"pointer",position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:0,right:0,width:40,height:40,background:`${EQ[k].color}12`,borderRadius:"0 10px 0 40px"}}/>
                  <i className={`ti ${EQ[k].icon}`} style={{fontSize:19,color:EQ[k].color,display:"block",marginBottom:7}}/>
                  <div style={{color:TXT,fontSize:12,fontWeight:600,marginBottom:4}}>{EQ[k].label}</div>
                  <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                    <span style={{color:EQ[k].color,fontSize:24,fontWeight:700,fontFamily:"monospace",lineHeight:1}}>{cnt}</span>
                    <span style={{color:DIM,fontSize:10}}>items</span>
                  </div>
                  {cnt>0&&<div style={{marginTop:3,fontSize:10,color:SUC}}>{db[k].filter(i=>i.status==="Active").length} active</div>}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Equipment Table ── */
function EqTable({type,cfg,allItems,displayed,q,setQ,stF,setStF,sort,setSort,onAdd,onEdit,onDel}){
  const sumFields=cfg.fields.filter(f=>cfg.summary.includes(f.k));
  const [hovRow,setHovRow]=useState(null);
  return(
    <div style={{animation:"fi .25s ease"}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
            <i className={`ti ${cfg.icon}`} style={{fontSize:19,color:cfg.color}}/>
            <h1 style={{fontFamily:"monospace",fontSize:19,fontWeight:700,color:TXT}}>{cfg.label}</h1>
          </div>
          <p style={{color:DIM,fontSize:11}}>
            {allItems.length} registered · {displayed.length} shown ·
            prefix <span style={{color:MUT,fontFamily:"monospace"}}>{cfg.prefix}-XXX</span>
          </p>
        </div>
        <button onClick={onAdd}
          style={{background:cfg.color,border:"none",borderRadius:8,padding:"8px 16px",color:"#fff",
            fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
          <i className="ti ti-plus" style={{fontSize:14}}/> Add {cfg.label.replace(/s$/,"")}
        </button>
      </div>

      <div style={{display:"flex",gap:7,marginBottom:11}}>
        <div style={{flex:1,position:"relative"}}>
          <i className="ti ti-search" style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:DIM,fontSize:13,pointerEvents:"none"}}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search tag, description, location…"
            style={{width:"100%",background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"7px 10px 7px 29px",color:TXT,fontSize:13}}/>
        </div>
        <select value={stF} onChange={e=>setStF(e.target.value)}
          style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"7px 11px",color:stF==="All"?DIM:TXT,fontSize:13,cursor:"pointer"}}>
          {["All","Active","Standby","Maintenance","Decommissioned","Spare"].map(s=>(
            <option key={s} value={s}>{s==="All"?"All Statuses":s}</option>
          ))}
        </select>
      </div>

      {displayed.length===0?(
        <div style={{textAlign:"center",padding:"52px 20px",color:DIM}}>
          <i className={`ti ${cfg.icon}`} style={{fontSize:42,display:"block",marginBottom:11,color:BDR2}}/>
          <div style={{fontSize:14,color:MUT,marginBottom:4}}>
            {allItems.length===0?`No ${cfg.label} registered yet`:"No items match your filters"}
          </div>
          {allItems.length===0&&(
            <button onClick={onAdd}
              style={{marginTop:13,background:cfg.color,border:"none",borderRadius:8,padding:"9px 20px",
                color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:5}}>
              <i className="ti ti-plus" style={{fontSize:14}}/> Add first {cfg.label.replace(/s$/,"")}
            </button>
          )}
        </div>
      ):(
        <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead>
                <tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>
                  {[{k:"tagName",l:"Tag Name"},...sumFields,{k:"status",l:"Status"}].map(f=>(
                    <th key={f.k} onClick={()=>setSort(p=>({k:f.k,d:p.k===f.k&&p.d==="asc"?"desc":"asc"}))}
                      style={{padding:"8px 11px",textAlign:"left",fontSize:10,
                        color:sort.k===f.k?cfg.color:DIM,fontWeight:600,
                        textTransform:"uppercase",letterSpacing:"0.07em",cursor:"pointer",
                        whiteSpace:"nowrap",userSelect:"none"}}>
                      {f.l}{sort.k===f.k?(sort.d==="asc"?" ↑":" ↓"):""}
                    </th>
                  ))}
                  <th style={{padding:"8px 11px",textAlign:"right",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {displayed.map((item,di)=>{
                  const ri=allItems.indexOf(item);
                  const sc=STC[item.status]||{c:MUT,b:BDR};
                  return(
                    <tr key={item.tagName} className="row-tr"
                      onMouseEnter={()=>setHovRow(di)} onMouseLeave={()=>setHovRow(null)}
                      style={{borderBottom:`1px solid ${BDR}`,background:hovRow===di?`${CRD}bb`:"transparent"}}>
                      <td style={{padding:"10px 11px",fontFamily:"monospace",fontSize:13,fontWeight:600,color:cfg.color,whiteSpace:"nowrap"}}>{item.tagName}</td>
                      {sumFields.map(f=>(
                        <td key={f.k} style={{padding:"10px 11px",fontSize:12,color:MUT,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {item[f.k]||<span style={{color:BDR2}}>—</span>}
                        </td>
                      ))}
                      <td style={{padding:"10px 11px"}}>
                        {item.status
                          ?<span style={{background:sc.b,color:sc.c,fontSize:10,padding:"3px 8px",borderRadius:5,fontWeight:600,whiteSpace:"nowrap"}}>{item.status}</span>
                          :<span style={{color:BDR2}}>—</span>}
                      </td>
                      <td style={{padding:"10px 11px",textAlign:"right",whiteSpace:"nowrap"}}>
                        <button onClick={()=>onEdit(item,ri)} className="tbl-btn"
                          style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 9px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,display:"inline-flex",alignItems:"center",gap:3}}>
                          <i className="ti ti-edit" style={{fontSize:11}}/> Edit
                        </button>
                        <button onClick={()=>onDel(item,ri)} className="tbl-btn"
                          style={{background:"transparent",border:`1px solid ${DNG}40`,borderRadius:5,padding:"4px 9px",color:DNG,fontSize:11,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:3}}>
                          <i className="ti ti-trash" style={{fontSize:11}}/> Delete
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}>
            <span>Showing {displayed.length} of {allItems.length}</span>
            <span>{allItems.filter(i=>i.status==="Active").length} active · {allItems.filter(i=>i.status==="Maintenance").length} maintenance</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Modal ── */
function Modal({modal,cfg,form,errs,onChange,onSave,onClose}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",display:"flex",alignItems:"stretch",justifyContent:"flex-end",zIndex:400}}
      onClick={onClose}>
      <div style={{background:SRF,width:680,maxWidth:"96vw",overflowY:"auto",borderLeft:`3px solid ${cfg.color}`,padding:22,display:"flex",flexDirection:"column",animation:"si .2s ease"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
              <i className={`ti ${cfg.icon}`} style={{fontSize:17,color:cfg.color}}/>
              <h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:17,color:cfg.color}}>
                {modal.mode==="add"?`New ${cfg.label.replace(/s$/,"")}`:`Edit ${form.tagName}`}
              </h2>
            </div>
            <p style={{color:DIM,fontSize:10}}>Tag prefix convention: <span style={{color:MUT,fontFamily:"monospace"}}>{cfg.prefix}-XXX</span></p>
          </div>
          <button onClick={onClose}
            style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"5px 9px",color:MUT,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <i className="ti ti-x" style={{fontSize:14}}/>
          </button>
        </div>

        {/* Tag Name */}
        <div style={{background:CRD,border:`1px solid ${cfg.color}44`,borderRadius:8,padding:13,marginBottom:14}}>
          <label style={{fontSize:10,color:cfg.color,textTransform:"uppercase",letterSpacing:"0.1em",display:"block",marginBottom:5,fontWeight:600}}>Tag Name *</label>
          <input value={form.tagName||""} onChange={e=>{onChange("tagName",e.target.value.toUpperCase());}}
            placeholder={`e.g. ${cfg.prefix}-001`}
            style={{width:"100%",background:SRF,border:`1px solid ${errs.tagName?DNG:BDR2}`,borderRadius:6,
              padding:"8px 12px",color:TXT,fontSize:15,fontFamily:"monospace",fontWeight:700}}/>
          {errs.tagName&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{errs.tagName}</p>}
        </div>

        {/* Fields */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,flex:1}}>
          {cfg.fields.map(f=>(
            <div key={f.k} style={{gridColumn:f.t==="area"?"span 2":"span 1"}}>
              <FieldInput f={f} val={form[f.k]||""} err={errs[f.k]} onChange={v=>onChange(f.k,v)}/>
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:7,justifyContent:"flex-end",paddingTop:16,marginTop:16,borderTop:`1px solid ${BDR}`,flexShrink:0}}>
          <button onClick={onClose}
            style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 16px",color:MUT,cursor:"pointer",fontSize:13}}>
            Cancel
          </button>
          <button onClick={onSave}
            style={{background:cfg.color,border:"none",borderRadius:7,padding:"7px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
            <i className={`ti ${modal.mode==="add"?"ti-plus":"ti-device-floppy"}`} style={{fontSize:13}}/>
            {modal.mode==="add"?"Add Equipment":"Save Changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App(){
  const [project,setProject]=useState(loadProject);
  const [editProj,setEditProj]=useState(false);
  const [tmpProj,setTmpProj]=useState("");
  const [db,setDb]=useState(loadDb);
  const [view,setView]=useState(null);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [errs,setErrs]=useState({});
  const [q,setQ]=useState("");
  const [stF,setStF]=useState("All");
  const [sort,setSort]=useState({k:"tagName",d:"asc"});
  const [toast,setToast]=useState(null);
  const [delC,setDelC]=useState(null);
  const fileRef=useRef(null);

  /* Persist */
  useEffect(()=>{try{localStorage.setItem("aquabase_db",JSON.stringify(db));}catch{}},[db]);
  useEffect(()=>{try{localStorage.setItem("aquabase_project",project);}catch{}},[project]);

  const allTags=useMemo(()=>Object.values(db).flat().map(e=>e.tagName?.toUpperCase()),[db]);

  const showToast=useCallback((msg,type="success")=>{
    setToast({msg,type}); setTimeout(()=>setToast(null),3200);
  },[]);

  const openAdd=(type)=>{setForm({status:"Active"});setErrs({});setModal({mode:"add",type});};
  const openEdit=(type,item,idx)=>{setForm({...item});setErrs({});setModal({mode:"edit",type,item,idx});};
  const closeModal=()=>{setModal(null);setForm({});setErrs({});};

  const validate=()=>{
    const e={};
    const tag=(form.tagName||"").trim().toUpperCase();
    if(!tag){e.tagName="Tag name is required";}
    else{
      const others=modal.mode==="edit"
        ?allTags.filter(t=>t!==modal.item.tagName?.toUpperCase())
        :allTags;
      if(others.includes(tag))e.tagName="Tag name already exists in this database";
    }
    EQ[modal.type].fields.forEach(f=>{
      if(f.req&&!form[f.k]?.trim())e[f.k]=`${f.l} is required`;
    });
    setErrs(e);
    return!Object.keys(e).length;
  };

  const saveItem=()=>{
    if(!validate())return;
    const item={...form,tagName:(form.tagName||"").trim().toUpperCase()};
    setDb(prev=>{
      const list=[...prev[modal.type]];
      if(modal.mode==="add")list.push(item);else list[modal.idx]=item;
      return{...prev,[modal.type]:list};
    });
    showToast(modal.mode==="add"?`${item.tagName} added successfully`:`${item.tagName} updated`);
    closeModal();
  };

  const confirmDel=()=>{
    const{type,idx,tag}=delC;
    setDb(prev=>{const l=[...prev[type]];l.splice(idx,1);return{...prev,[type]:l};});
    showToast(`${tag} removed`,"info");
    setDelC(null);
  };

  const exportXlsx=()=>{
    const wb=XLSX.utils.book_new();
    const now=new Date().toLocaleString();
    const total=Object.values(db).reduce((s,l)=>s+l.length,0);
    const sumWs=XLSX.utils.aoa_to_sheet([
      ["AQUABASE — EQUIPMENT DATABASE"],
      ["Project:",project],["Exported:",now],["Total Items:",total],[],
      ["Equipment Type","Count"],
      ...ALL.map(k=>[EQ[k].label,db[k].length]),
    ]);
    sumWs["!cols"]=[{wch:28},{wch:12}];
    XLSX.utils.book_append_sheet(wb,sumWs,"Summary");
    ALL.forEach(k=>{
      const items=db[k]; if(!items.length)return;
      const cfg=EQ[k];
      const headers=["Tag Name",...cfg.fields.map(f=>f.l)];
      const rows=items.map(item=>[item.tagName,...cfg.fields.map(f=>item[f.k]??"")]);
      const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
      ws["!cols"]=headers.map((_,i)=>({wch:i===0?14:i===1?30:18}));
      XLSX.utils.book_append_sheet(wb,ws,cfg.label.substring(0,31));
    });
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_Equipment_DB.xlsx`);
    showToast("Excel export complete");
  };

  const importXlsx=(e)=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary"});
        const newDb={...db}; let added=0,skipped=0;
        const curTags=new Set(Object.values(newDb).flat().map(i=>i.tagName?.toUpperCase()));
        ALL.forEach(k=>{
          const cfg=EQ[k];
          const sheet=wb.SheetNames.find(n=>n.toLowerCase().includes(cfg.label.toLowerCase().slice(0,5)));
          if(!sheet)return;
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1});
          if(rows.length<2)return;
          const headers=rows[0];
          rows.slice(1).forEach(row=>{
            if(!row[0])return;
            const tag=String(row[0]).toUpperCase().trim();
            if(curTags.has(tag)){skipped++;return;}
            const item={tagName:tag};
            headers.forEach((h,i)=>{
              if(h==="Tag Name")return;
              const field=cfg.fields.find(f=>f.l===h);
              if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";
            });
            newDb[k].push(item); curTags.add(tag); added++;
          });
        });
        setDb(newDb);
        showToast(`Import complete — ${added} added${skipped?`, ${skipped} skipped (duplicate tags)`:""}`,added?"success":"warning");
      }catch{showToast("Import failed — check file format","error");}
    };
    reader.readAsBinaryString(file); e.target.value="";
  };

  const displayed=useMemo(()=>{
    if(!view)return[];
    let list=[...db[view]];
    if(q){const lq=q.toLowerCase();list=list.filter(item=>Object.values(item).some(v=>String(v).toLowerCase().includes(lq)));}
    if(stF!=="All")list=list.filter(i=>i.status===stF);
    list.sort((a,b)=>{
      const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");
      return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    });
    return list;
  },[view,db,q,stF,sort]);

  const navTo=(k)=>{setView(k);setQ("");setStF("All");};

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:BG,color:TXT,overflow:"hidden"}}>

      {/* ── HEADER ── */}
      <header style={{height:56,background:SRF,borderBottom:`1px solid ${BDR}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 18px",flexShrink:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:11}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:32,height:32,background:`linear-gradient(135deg,${ACC},#0369a1)`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <i className="ti ti-droplets" style={{fontSize:17,color:"#fff"}}/>
            </div>
            <div>
              <div style={{fontFamily:"monospace",fontWeight:700,fontSize:14,color:ACC}}>AquaBase</div>
              <div style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em"}}>Equipment Registry</div>
            </div>
          </div>
          <div style={{width:1,height:28,background:BDR}}/>
          {editProj
            ?<input autoFocus value={tmpProj} onChange={e=>setTmpProj(e.target.value)}
                onBlur={()=>{setProject(tmpProj);setEditProj(false);}}
                onKeyDown={e=>{if(e.key==="Enter"){setProject(tmpProj);setEditProj(false);}if(e.key==="Escape")setEditProj(false);}}
                style={{background:CRD,border:`1px solid ${ACC}`,borderRadius:6,padding:"4px 10px",color:TXT,fontSize:13,fontWeight:500,minWidth:260}}/>
            :<button onClick={()=>{setTmpProj(project);setEditProj(true);}}
                style={{background:"none",border:"none",color:TXT,fontSize:13,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:5,padding:"3px 6px",borderRadius:5}}>
                {project}<i className="ti ti-pencil" style={{fontSize:11,color:DIM}}/>
              </button>}
        </div>
        <div style={{display:"flex",gap:6}}>
          <input type="file" accept=".xlsx,.xls" ref={fileRef} onChange={importXlsx} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current.click()}
            style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"6px 12px",color:MUT,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
            <i className="ti ti-upload" style={{fontSize:13}}/> Import Excel
          </button>
          <button onClick={exportXlsx}
            style={{background:ACC,border:"none",borderRadius:7,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
            <i className="ti ti-download" style={{fontSize:13}}/> Export Excel
          </button>
        </div>
      </header>

      {/* ── BODY ── */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* SIDEBAR */}
        <nav style={{width:198,background:SRF,borderRight:`1px solid ${BDR}`,overflowY:"auto",flexShrink:0,paddingBottom:12}}>
          <NavItem label="Overview" icon="ti-layout-dashboard"
            count={Object.values(db).reduce((s,l)=>s+l.length,0)}
            active={!view} color={ACC} onClick={()=>setView(null)}/>

          <div style={{padding:"9px 13px 3px",fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600,marginTop:4}}>Mechanical</div>
          {MECH.map(k=>(
            <NavItem key={k} label={EQ[k].label} icon={EQ[k].icon} count={db[k].length}
              active={view===k} color={EQ[k].color} onClick={()=>navTo(k)}/>
          ))}

          <div style={{padding:"9px 13px 3px",fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600,marginTop:4}}>Instrumentation</div>
          {INST.map(k=>(
            <NavItem key={k} label={EQ[k].label} icon={EQ[k].icon} count={db[k].length}
              active={view===k} color={EQ[k].color} onClick={()=>navTo(k)}/>
          ))}
        </nav>

        {/* MAIN */}
        <main style={{flex:1,overflowY:"auto",padding:22,background:BG}}>
          {!view
            ?<Overview db={db} onNav={navTo}/>
            :<EqTable type={view} cfg={EQ[view]} allItems={db[view]} displayed={displayed}
                q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort}
                onAdd={()=>openAdd(view)}
                onEdit={(item,idx)=>openEdit(view,item,idx)}
                onDel={(item,idx)=>setDelC({type:view,idx,tag:item.tagName})}/>}
        </main>
      </div>

      {/* ── MODAL ── */}
      {modal&&<Modal modal={modal} cfg={EQ[modal.type]} form={form} errs={errs}
        onChange={(k,v)=>{setForm(p=>({...p,[k]:v}));if(errs[k])setErrs(p=>({...p,[k]:null}));}}
        onSave={saveItem} onClose={closeModal}/>}

      {/* ── DELETE CONFIRM ── */}
      {delC&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}>
          <div style={{background:CRD,border:`1px solid ${DNG}55`,borderRadius:11,padding:22,maxWidth:370,width:"92%"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
              <i className="ti ti-trash" style={{fontSize:19,color:DNG}}/>
              <h3 style={{color:DNG,fontSize:15,fontWeight:600}}>Delete Equipment</h3>
            </div>
            <p style={{color:MUT,fontSize:13,lineHeight:1.6,marginBottom:18}}>
              Permanently remove{" "}
              <strong style={{color:TXT,fontFamily:"monospace"}}>{delC.tag}</strong>?
              {" "}This cannot be undone.
            </p>
            <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
              <button onClick={()=>setDelC(null)}
                style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:13,cursor:"pointer"}}>
                Cancel
              </button>
              <button onClick={confirmDel}
                style={{background:DNG,border:"none",borderRadius:7,padding:"7px 15px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Delete
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── TOAST ── */}
      {toast&&(
        <div style={{position:"fixed",bottom:20,right:20,
          background:toast.type==="error"?DNG:toast.type==="info"?ACC:toast.type==="warning"?WRN:SUC,
          color:"#fff",padding:"10px 17px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.5)",
          zIndex:900,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:7,
          animation:"ti .3s cubic-bezier(.175,.885,.32,1.275)"}}>
          <i className={`ti ${toast.type==="error"?"ti-alert-circle":toast.type==="warning"?"ti-alert-triangle":"ti-circle-check"}`} style={{fontSize:15}}/>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
