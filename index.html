<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AquaBase — Water Industry Equipment Registry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.383.0/font/lucide.css" crossorigin="anonymous"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;overflow:hidden}
  body{background:#080e1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:#0d1424}
  ::-webkit-scrollbar-thumb{background:#243550;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#0ea5e9}
  input,select,textarea,button{font-family:inherit;outline:none}
  input::placeholder,textarea::placeholder{color:#4a5a72}
  select option{background:#111d2e!important;color:#e2e8f0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useMemo,useCallback}=React;
const BG="#080e1a",SRF="#0d1424",CRD="#111d2e",BDR="#1c2e45",BDR2="#243550";
const ACC="#0ea5e9",TXT="#e2e8f0",MUT="#94a3b8",DIM="#4a5a72";
const SUC="#10b981",DNG="#ef4444",WRN="#f59e0b";
const MC="#3b82f6",IC="#a855f7";
const STC={Active:{c:"#10b981",b:"#10b98120"},Standby:{c:"#3b82f6",b:"#3b82f620"},Maintenance:{c:"#f59e0b",b:"#f59e0b20"},Decommissioned:{c:"#ef4444",b:"#ef444420"},Spare:{c:"#8b5cf6",b:"#8b5cf620"}};
const ISTC={Defined:{c:"#94a3b8",b:"#94a3b820"},Pending:{c:"#f59e0b",b:"#f59e0b20"},Approved:{c:"#3b82f6",b:"#3b82f620"},Installed:{c:"#8b5cf6",b:"#8b5cf620"},Commissioned:{c:"#10b981",b:"#10b98120"}};
const SIGC={AI:"#06b6d4",AO:"#0ea5e9",DI:"#84cc16",DO:"#10b981","HART AI":"#a855f7","HART AO":"#8b5cf6",Pulse:"#f59e0b"};
const EQ={
  pump:{label:"Pumps",color:"#3b82f6",prefix:"P",summary:["pumpType","flowRate","head","power","location"],fields:[{k:"description",l:"Description",t:"text",req:true},{k:"service",l:"Service",t:"text"},{k:"fluid",l:"Process Fluid",t:"text"},{k:"pumpType",l:"Pump Type",t:"sel",o:["Centrifugal","Submersible","Positive Displacement","Gear","Peristaltic","Dosing","Axial Flow"]},{k:"flowRate",l:"Flow Rate (m\u00b3/h)",t:"num"},{k:"head",l:"Total Head (m)",t:"num"},{k:"power",l:"Power (kW)",t:"num"},{k:"speed",l:"Speed (RPM)",t:"num"},{k:"efficiency",l:"Efficiency (%)",t:"num"},{k:"material",l:"Casing Material",t:"text"},{k:"sealType",l:"Seal Type",t:"sel",o:["Mechanical Seal","Packed Gland","Mag Drive","Canned Motor","Lip Seal"]},{k:"inletDN",l:"Inlet Size (DN)",t:"num"},{k:"outletDN",l:"Outlet Size (DN)",t:"num"},{k:"manufacturer",l:"Manufacturer",t:"text"},{k:"model",l:"Model / Series",t:"text"},{k:"serialNumber",l:"Serial Number",t:"text"},{k:"location",l:"Physical Location",t:"text"},{k:"status",l:"Status",t:"sel",o:["Active","Standby","Maintenance","Decommissioned","Spare"]},{k:"notes",l:"Notes",t:"area"}]},
  motor:{label:"Motors",color:"#8b5cf6",prefix:"M",summary:["power","voltage","speed","efficiencyClass","location"],fields:[{k:"description",l:"Description",t:"text",req:true},{k:"service",l:"Service",t:"text"},{k:"power",l:"Power (kW)",t:"num"},{k:"voltage",l:"Supply Voltage (V)",t:"num"},{k:"current",l:"Full Load Current (A)",t:"num"},{k:"speed",l:"Rated Speed (RPM)",t:"num"},{k:"frequency",l:"Frequency (Hz)",t:"sel",o:["50","60"]},{k:"phases",l:"Phases",t:"sel",o:["1-Phase","3-Phase"]},{k:"efficiencyClass",l:"Efficiency Class",t:"sel",o:["IE1","IE2","IE3","IE4","IE5"]},{k:"frameSize",l:"Frame Size (IEC)",t:"text"},{k:"ipRating",l:"IP Rating",t:"sel",o:["IP44","IP54","IP55","IP65","IP66","IP67","IP68"]},{k:"insulationClass",l:"Insulation Class",t:"sel",o:["A","B","F","H"]},{k:"mounting",l:"Mounting",t:"sel",o:["B3 (Foot)","B5 (Flange)","B35 (Foot+Flange)","B14 (Face)","V1 (Vertical)"]},{k:"manufacturer",l:"Manufacturer",t:"text"},{k:"model",l:"Model",t:"text"},{k:"serialNumber",l:"Serial Number",t:"text"},{k:"location",l:"Physical Location",t:"text"},{k:"status",l:"Status",t:"sel",o:["Active","Standby","Maintenance","Decommissioned","Spare"]},{k:"notes",l:"Notes",t:"area"}]},
  valve:{label:"Valves",color:"#10b981",prefix:"V",summary:["valveType","size","pressureClass","actuatorType","location"],fields:[{k:"description",l:"Description",t:"text",req:true},{k:"service",l:"Service",t:"text"},{k:"fluid",l:"Process Fluid",t:"text"},{k:"valveType",l:"Valve Type",t:"sel",o:["Gate","Globe","Ball","Butterfly","Check (Non-Return)","Diaphragm","Plug","Needle","Safety / Relief","Control"]},{k:"size",l:"Nominal Size (DN)",t:"num"},{k:"pressureClass",l:"Pressure Class",t:"sel",o:["PN6","PN10","PN16","PN25","PN40","ANSI 150","ANSI 300","ANSI 600"]},{k:"bodyMaterial",l:"Body Material",t:"text"},{k:"trimMaterial",l:"Trim / Disc Material",t:"text"},{k:"seatMaterial",l:"Seat Material",t:"text"},{k:"actuatorType",l:"Actuator Type",t:"sel",o:["Manual (Handwheel)","Manual (Lever)","Electric Actuator","Pneumatic (Spring-Return)","Pneumatic (Double-Acting)","Hydraulic","None"]},{k:"endConnection",l:"End Connection",t:"sel",o:["Flanged","Threaded (BSP)","Threaded (NPT)","Socket Weld","Butt Weld","Wafer","Lug","Grooved"]},{k:"cv",l:"Flow Coefficient Cv",t:"num"},{k:"manufacturer",l:"Manufacturer",t:"text"},{k:"model",l:"Model",t:"text"},{k:"serialNumber",l:"Serial Number",t:"text"},{k:"location",l:"Physical Location",t:"text"},{k:"status",l:"Status",t:"sel",o:["Active","Standby","Maintenance","Decommissioned","Spare"]},{k:"notes",l:"Notes",t:"area"}]},
  solenoid:{label:"Solenoid Valves",color:"#f59e0b",prefix:"SV",summary:["action","coilVoltage","pressureMax","ipRating","location"],fields:[{k:"description",l:"Description",t:"text",req:true},{k:"service",l:"Service",t:"text"},{k:"fluid",l:"Process Fluid",t:"text"},{k:"size",l:"Port Size (mm/DN)",t:"num"},{k:"coilVoltage",l:"Coil Voltage (VAC/VDC)",t:"text"},{k:"powerW",l:"Power Consumption (W)",t:"num"},{k:"pressureMin",l:"Min Pressure (bar)",t:"num"},{k:"pressureMax",l:"Max Pressure (bar)",t:"num"},{k:"action",l:"Fail-Safe Action",t:"sel",o:["Normally Open (NO)","Normally Closed (NC)","Bistable / Latching","Universal"]},{k:"operationType",l:"Operation Type",t:"sel",o:["Direct Acting","Pilot Operated","Semi-Direct Acting"]},{k:"bodyMaterial",l:"Body Material",t:"text"},{k:"sealMaterial",l:"Seal / Diaphragm Material",t:"text"},{k:"ipRating",l:"IP Rating",t:"sel",o:["IP54","IP65","IP67","IP68","IP69K"]},{k:"manufacturer",l:"Manufacturer",t:"text"},{k:"model",l:"Model",t:"text"},{k:"serialNumber",l:"Serial Number",t:"text"},{k:"location",l:"Physical Location",t:"text"},{k:"status",l:"Status",t:"sel",o:["Active","Standby","Maintenance","Decommissioned","Spare"]},{k:"notes",l:"Notes",t:"area"}]},
};
const MK=["pump","motor","valve","solenoid"];
const IOF=[{k:"description",l:"Description",t:"text",req:true},{k:"signalType",l:"Signal Type",t:"sel",o:["AI","AO","DI","DO","HART AI","HART AO","Pulse"],req:true},{k:"engUnit",l:"Engineering Unit",t:"text"},{k:"rangeMin",l:"Range Min",t:"num"},{k:"rangeMax",l:"Range Max",t:"num"},{k:"alarmLL",l:"Alarm LL",t:"num"},{k:"alarmL",l:"Alarm L",t:"num"},{k:"alarmH",l:"Alarm H",t:"num"},{k:"alarmHH",l:"Alarm HH",t:"num"},{k:"cabinet",l:"Cabinet / PLC",t:"text"},{k:"rack",l:"Rack",t:"text"},{k:"slot",l:"Slot / Module",t:"text"},{k:"channel",l:"Channel",t:"text"},{k:"cableNumber",l:"Cable Number",t:"text"},{k:"junctionBox",l:"Junction Box",t:"text"},{k:"pidRef",l:"P&ID Reference",t:"text"},{k:"loopNumber",l:"Loop Number",t:"text"},{k:"linkedTag",l:"Linked Equipment Tag",t:"text"},{k:"iacStatus",l:"Status",t:"sel",o:["Defined","Pending","Approved","Installed","Commissioned"]},{k:"notes",l:"Notes",t:"area"}];
const initDb=()=>Object.fromEntries(MK.map(k=>[k,[]]));
const inp=(e={})=>({background:BG,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 11px",color:TXT,fontSize:13,width:"100%",fontFamily:"inherit",outline:"none",...e});
function loadDb(){try{const s=localStorage.getItem("aquabase_db_v3");if(s)return JSON.parse(s);}catch{}return initDb();}
function loadIo(){try{const s=localStorage.getItem("aquabase_io_v3");if(s)return JSON.parse(s);}catch{}return[];}
function loadProj(){try{return localStorage.getItem("aquabase_proj_v3")||"Water Treatment Plant \u2014 Project Alpha";}catch{return"Water Treatment Plant \u2014 Project Alpha";}}

function Dot({color,size=8}){return <span style={{width:size,height:size,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>;}
function Badge({label,color,bg}){return <span style={{background:bg,color,fontSize:10,padding:"3px 8px",borderRadius:5,fontWeight:600,whiteSpace:"nowrap"}}>{label}</span>;}
function FI({f,val,err,onChange}){const s=inp({border:`1px solid ${err?DNG:BDR2}`});return(<div><label style={{fontSize:10,color:err?DNG:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>{f.l}{f.req?" *":""}</label>{f.t==="sel"?<select value={val} onChange={e=>onChange(e.target.value)} style={{...s,cursor:"pointer"}}><option value="">— Select —</option>{f.o.map(o=><option key={o} value={o}>{o}</option>)}</select>:f.t==="area"?<textarea value={val} onChange={e=>onChange(e.target.value)} rows={3} style={{...s,resize:"vertical"}}/>:<input type={f.t==="num"?"number":"text"} value={val} onChange={e=>onChange(e.target.value)} style={s}/>}{err&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{err}</p>}</div>);}
function NavItem({label,active,color,count,onClick,indent=false}){const[h,sH]=useState(false);return(<button onClick={onClick} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} style={{width:"100%",textAlign:"left",background:active?`${color}14`:h?CRD:"transparent",border:"none",borderLeft:`3px solid ${active?color:"transparent"}`,padding:`9px 13px 9px ${indent?22:13}px`,color:active?color:h?MUT:DIM,fontSize:12,fontWeight:active?600:400,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",fontFamily:"inherit"}}><span>{label}</span>{count>0&&<span style={{background:active?`${color}25`:BDR,color:active?color:DIM,fontSize:10,padding:"1px 6px",borderRadius:10,fontWeight:700,fontFamily:"monospace"}}>{count}</span>}</button>);}
function SecLabel({label,color}){return(<div style={{padding:"10px 13px 4px",fontSize:9,color,textTransform:"uppercase",letterSpacing:"0.14em",fontWeight:700,marginTop:4,display:"flex",alignItems:"center",gap:6}}><span style={{flex:1,height:1,background:`${color}30`}}/>{label}<span style={{flex:1,height:1,background:`${color}30`}}/></div>);}
function DeptIO({label,color,onImport,onExport,fileRef}){return(<div style={{display:"flex",gap:6}}><input type="file" accept=".xlsx,.xls" ref={fileRef} onChange={onImport} style={{display:"none"}}/><button onClick={()=>fileRef.current.click()} style={{background:CRD,border:`1px solid ${color}44`,borderRadius:7,padding:"6px 11px",color,fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"inherit",fontWeight:500}}>&#8593; Import</button><button onClick={onExport} style={{background:`${color}22`,border:`1px solid ${color}55`,borderRadius:7,padding:"6px 11px",color,fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"inherit"}}>&#8595; Export</button></div>);}

function Overview({db,ioList,onNav,onMI,onME,onII,onIE,mRef,iRef}){
  const mt=Object.values(db).reduce((s,l)=>s+l.length,0);
  const it=ioList.length;
  const sc=Object.fromEntries(["AI","AO","DI","DO","HART AI","HART AO","Pulse"].map(s=>[s,ioList.filter(i=>i.signalType===s).length]));
  const com=ioList.filter(i=>i.iacStatus==="Commissioned").length;
  return(<div>
    <div style={{marginBottom:18}}><h1 style={{fontFamily:"monospace",fontSize:20,fontWeight:700,color:TXT,marginBottom:3}}>Project Overview</h1><p style={{color:DIM,fontSize:12}}>MECHANICS &amp; I&amp;C central hub \u00b7 Data auto-saves to browser storage</p></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}}>
      <div style={{background:CRD,border:`1px solid ${MC}44`,borderRadius:14,padding:18,borderTop:`3px solid ${MC}`}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}><span style={{fontSize:14}}>&#9881;</span><h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:14,color:MC}}>MECHANICS</h2></div>
        <p style={{color:DIM,fontSize:11,marginBottom:12}}>Physical equipment &mdash; specs, power, brand, typicals</p>
        <DeptIO label="Mechanics" color={MC} onImport={onMI} onExport={onME} fileRef={mRef}/>
        <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
          {MK.map(k=>{const[h,sH]=useState(false);return(<button key={k} onClick={()=>onNav(k)} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} style={{background:SRF,border:`1px solid ${h?EQ[k].color:BDR}`,borderRadius:9,padding:"10px 11px",textAlign:"left",cursor:"pointer",fontFamily:"inherit",transition:"border-color .15s"}}>
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}><Dot color={EQ[k].color} size={6}/><span style={{color:MUT,fontSize:10}}>{EQ[k].label}</span></div>
            <div style={{display:"flex",alignItems:"baseline",gap:4}}><span style={{color:EQ[k].color,fontSize:20,fontWeight:700,fontFamily:"monospace"}}>{db[k].length}</span>{db[k].filter(i=>i.status==="Active").length>0&&<span style={{color:SUC,fontSize:9}}>{db[k].filter(i=>i.status==="Active").length} active</span>}</div>
          </button>);})}
        </div>
        <div style={{marginTop:12,padding:"9px 11px",background:SRF,borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:DIM,fontSize:11}}>Total equipment</span>
          <span style={{color:MC,fontFamily:"monospace",fontWeight:700,fontSize:18}}>{mt}</span>
        </div>
      </div>
      <div style={{background:CRD,border:`1px solid ${IC}44`,borderRadius:14,padding:18,borderTop:`3px solid ${IC}`}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}><span style={{fontSize:14}}>&#128187;</span><h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:14,color:IC}}>I&amp;C</h2></div>
        <p style={{color:DIM,fontSize:11,marginBottom:12}}>IO list &mdash; channel assignment for the control system</p>
        <DeptIO label="I&C" color={IC} onImport={onII} onExport={onIE} fileRef={iRef}/>
        <div style={{marginTop:14}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:7}}>
            {["AI","AO","DI","DO"].map(s=>{const[h,sH]=useState(false);return(<button key={s} onClick={()=>onNav("ioList",s)} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} style={{background:SRF,border:`1px solid ${h?SIGC[s]:BDR}`,borderRadius:8,padding:"8px 5px",textAlign:"center",cursor:"pointer",fontFamily:"inherit",transition:"border-color .15s"}}>
              <div style={{color:SIGC[s],fontFamily:"monospace",fontWeight:700,fontSize:16}}>{sc[s]||0}</div>
              <div style={{color:DIM,fontSize:10,marginTop:1}}>{s}</div>
            </button>);})}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
            {["HART AI","HART AO","Pulse"].map(s=>{const[h,sH]=useState(false);return(<button key={s} onClick={()=>onNav("ioList",s)} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} style={{background:SRF,border:`1px solid ${h?SIGC[s]:BDR}`,borderRadius:8,padding:"7px 5px",textAlign:"center",cursor:"pointer",fontFamily:"inherit",transition:"border-color .15s"}}>
              <div style={{color:SIGC[s],fontFamily:"monospace",fontWeight:700,fontSize:13}}>{sc[s]||0}</div>
              <div style={{color:DIM,fontSize:9,marginTop:1}}>{s}</div>
            </button>);})}
          </div>
        </div>
        <div style={{marginTop:12,padding:"9px 11px",background:SRF,borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:DIM,fontSize:11}}>Total IO channels</span>
          <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{color:SUC,fontSize:11}}>{com} commissioned</span><span style={{color:IC,fontFamily:"monospace",fontWeight:700,fontSize:18}}>{it}</span></div>
        </div>
      </div>
    </div>
    <div style={{textAlign:"center",color:DIM,fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
      <span style={{flex:1,height:1,background:BDR}}/><span style={{color:MUT}}>MECHANICS + I&amp;C &rarr; Control System IO List</span><span style={{flex:1,height:1,background:BDR}}/>
    </div>
  </div>);
}

function EqTable({type,cfg,allItems,displayed,q,setQ,stF,setStF,sort,setSort,onAdd,onEdit,onDel}){
  const sf=cfg.fields.filter(f=>cfg.summary.includes(f.k));
  const[hr,sHR]=useState(null);
  return(<div>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
      <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}><Dot color={cfg.color} size={10}/><h1 style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:TXT}}>{cfg.label}</h1><span style={{fontSize:10,color:MC,background:`${MC}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>MECHANICS</span></div>
      <p style={{color:DIM,fontSize:11}}>{allItems.length} registered \u00b7 {displayed.length} shown \u00b7 prefix <span style={{color:MUT,fontFamily:"monospace"}}>{cfg.prefix}-XXX</span></p></div>
      <button onClick={onAdd} style={{background:cfg.color,border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"inherit",flexShrink:0}}>+ Add {cfg.label.replace(/s$/,"")}</button>
    </div>
    <div style={{display:"flex",gap:7,marginBottom:11}}>
      <div style={{flex:1,position:"relative"}}><span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:DIM,fontSize:12}}>&#128269;</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search\u2026" style={inp({paddingLeft:29,border:`1px solid ${BDR}`,background:CRD})}/></div>
      <select value={stF} onChange={e=>setStF(e.target.value)} style={inp({width:"auto",background:CRD,border:`1px solid ${BDR}`,cursor:"pointer",color:stF==="All"?DIM:TXT})}>
        {["All","Active","Standby","Maintenance","Decommissioned","Spare"].map(s=><option key={s} value={s}>{s==="All"?"All Statuses":s}</option>)}
      </select>
    </div>
    {displayed.length===0?(<div style={{textAlign:"center",padding:"52px 20px",color:DIM}}><div style={{fontSize:36,marginBottom:10,opacity:.2}}>&#9711;</div><div style={{fontSize:14,color:MUT,marginBottom:4}}>{allItems.length===0?`No ${cfg.label} registered yet`:"No items match"}</div>{allItems.length===0&&<button onClick={onAdd} style={{marginTop:12,background:cfg.color,border:"none",borderRadius:8,padding:"8px 18px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ Add first {cfg.label.replace(/s$/,"")}</button>}</div>):(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>
          {[{k:"tagName",l:"Tag Name"},...sf,{k:"status",l:"Status"}].map(f=>(<th key={f.k} onClick={()=>setSort(p=>({k:f.k,d:p.k===f.k&&p.d==="asc"?"desc":"asc"}))} style={{padding:"8px 11px",textAlign:"left",fontSize:10,cursor:"pointer",userSelect:"none",color:sort.k===f.k?cfg.color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>{f.l}{sort.k===f.k?(sort.d==="asc"?" \u2191":" \u2193"):""}</th>))}
          <th style={{padding:"8px 11px",textAlign:"right",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em"}}>Actions</th>
        </tr></thead>
        <tbody>{displayed.map((item,di)=>{const ri=allItems.indexOf(item);const sc=STC[item.status]||{c:MUT,b:BDR};return(
          <tr key={item.tagName} onMouseEnter={()=>sHR(di)} onMouseLeave={()=>sHR(null)} style={{borderBottom:`1px solid ${BDR}`,background:hr===di?`${CRD}bb`:"transparent"}}>
            <td style={{padding:"10px 11px",fontFamily:"monospace",fontSize:13,fontWeight:600,color:cfg.color,whiteSpace:"nowrap"}}>{item.tagName}</td>
            {sf.map(f=><td key={f.k} style={{padding:"10px 11px",fontSize:12,color:MUT,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item[f.k]||<span style={{color:BDR2}}>&#8212;</span>}</td>)}
            <td style={{padding:"10px 11px"}}>{item.status?<Badge label={item.status} color={sc.c} bg={sc.b}/>:<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",textAlign:"right",whiteSpace:"nowrap"}}>
              <button onClick={()=>onEdit(item,ri)} style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 8px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,fontFamily:"inherit"}}>&#9998; Edit</button>
              <button onClick={()=>onDel(item,ri)} style={{background:"transparent",border:`1px solid ${DNG}40`,borderRadius:5,padding:"4px 8px",color:DNG,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>&#128465; Delete</button>
            </td>
          </tr>);})}
        </tbody>
      </table></div>
      <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}><span>Showing {displayed.length} of {allItems.length}</span><span>{allItems.filter(i=>i.status==="Active").length} active</span></div>
    </div>)}
  </div>);
}

function IoTable({ioList,displayed,q,setQ,sigF,setSigF,stF,setStF,sort,setSort,onAdd,onEdit,onDel}){
  const[hr,sHR]=useState(null);
  return(<div>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
      <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}><span style={{fontSize:16}}>&#128187;</span><h1 style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:TXT}}>IO List</h1><span style={{fontSize:10,color:IC,background:`${IC}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>I&amp;C</span></div>
      <p style={{color:DIM,fontSize:11}}>{ioList.length} channels defined \u00b7 {displayed.length} shown</p></div>
      <button onClick={onAdd} style={{background:IC,border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"inherit",flexShrink:0}}>+ Add Channel</button>
    </div>
    <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>
      {["All","AI","AO","DI","DO","HART AI","HART AO","Pulse"].map(s=>(<button key={s} onClick={()=>setSigF(s)} style={{background:sigF===s?(SIGC[s]||ACC):"transparent",border:`1px solid ${sigF===s?(SIGC[s]||ACC):BDR2}`,borderRadius:20,padding:"4px 11px",color:sigF===s?"#fff":DIM,fontSize:11,fontWeight:sigF===s?600:400,cursor:"pointer",fontFamily:"inherit"}}>{s}{s!=="All"&&<span style={{marginLeft:4,opacity:.7}}>{ioList.filter(i=>i.signalType===s).length}</span>}</button>))}
    </div>
    <div style={{display:"flex",gap:7,marginBottom:11}}>
      <div style={{flex:1,position:"relative"}}><span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:DIM,fontSize:12}}>&#128269;</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search tag, cabinet, channel\u2026" style={inp({paddingLeft:29,border:`1px solid ${BDR}`,background:CRD})}/></div>
      <select value={stF} onChange={e=>setStF(e.target.value)} style={inp({width:"auto",background:CRD,border:`1px solid ${BDR}`,cursor:"pointer",color:stF==="All"?DIM:TXT})}>
        {["All","Defined","Pending","Approved","Installed","Commissioned"].map(s=><option key={s} value={s}>{s==="All"?"All Statuses":s}</option>)}
      </select>
    </div>
    {displayed.length===0?(<div style={{textAlign:"center",padding:"52px 20px",color:DIM}}><div style={{fontSize:36,marginBottom:10,opacity:.2}}>&#128187;</div><div style={{fontSize:14,color:MUT,marginBottom:4}}>{ioList.length===0?"No IO channels defined yet":"No channels match"}</div>{ioList.length===0&&<button onClick={onAdd} style={{marginTop:12,background:IC,border:"none",borderRadius:8,padding:"8px 18px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ Add first channel</button>}</div>):(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>
          {[{k:"tagName",l:"Tag Name"},{k:"signalType",l:"Signal"},{k:"engUnit",l:"Eng. Unit"},{k:"cabinet",l:"Cabinet"},{k:"channel",l:"Channel"},{k:"linkedTag",l:"Linked Tag"},{k:"iacStatus",l:"Status"}].map(f=>(<th key={f.k} onClick={()=>setSort(p=>({k:f.k,d:p.k===f.k&&p.d==="asc"?"desc":"asc"}))} style={{padding:"8px 11px",textAlign:"left",fontSize:10,cursor:"pointer",userSelect:"none",color:sort.k===f.k?IC:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>{f.l}{sort.k===f.k?(sort.d==="asc"?" \u2191":" \u2193"):""}</th>))}
          <th style={{padding:"8px 11px",textAlign:"right",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em"}}>Actions</th>
        </tr></thead>
        <tbody>{displayed.map((item,di)=>{const ri=ioList.indexOf(item);const sc=ISTC[item.iacStatus]||{c:MUT,b:BDR};const sgc=SIGC[item.signalType]||MUT;return(
          <tr key={item.tagName} onMouseEnter={()=>sHR(di)} onMouseLeave={()=>sHR(null)} style={{borderBottom:`1px solid ${BDR}`,background:hr===di?`${CRD}bb`:"transparent"}}>
            <td style={{padding:"10px 11px",fontFamily:"monospace",fontSize:13,fontWeight:600,color:IC,whiteSpace:"nowrap"}}>{item.tagName}</td>
            <td style={{padding:"10px 11px"}}>{item.signalType?<Badge label={item.signalType} color={sgc} bg={`${sgc}20`}/>:<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",fontSize:12,color:MUT}}>{item.engUnit||<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",fontSize:12,color:MUT,whiteSpace:"nowrap"}}>{item.cabinet||<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",fontSize:12,color:MUT,fontFamily:"monospace"}}>{item.channel||<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",fontSize:12,color:MUT,fontFamily:"monospace"}}>{item.linkedTag||<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px"}}>{item.iacStatus?<Badge label={item.iacStatus} color={sc.c} bg={sc.b}/>:<span style={{color:BDR2}}>&#8212;</span>}</td>
            <td style={{padding:"10px 11px",textAlign:"right",whiteSpace:"nowrap"}}>
              <button onClick={()=>onEdit(item,ri)} style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 8px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,fontFamily:"inherit"}}>&#9998; Edit</button>
              <button onClick={()=>onDel(item,ri)} style={{background:"transparent",border:`1px solid ${DNG}40`,borderRadius:5,padding:"4px 8px",color:DNG,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>&#128465; Delete</button>
            </td>
          </tr>);})}
        </tbody>
      </table></div>
      <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}><span>Showing {displayed.length} of {ioList.length}</span><span>{ioList.filter(i=>i.iacStatus==="Commissioned").length} commissioned</span></div>
    </div>)}
  </div>);
}

function Modal({modal,fields,color,prefix,form,errs,onChange,onSave,onClose}){
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",display:"flex",alignItems:"stretch",justifyContent:"flex-end",zIndex:400}} onClick={onClose}>
    <div style={{background:SRF,width:680,maxWidth:"96vw",overflowY:"auto",borderLeft:`3px solid ${color}`,padding:22,display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}><Dot color={color} size={10}/><h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:16,color}}>{modal.mode==="add"?(modal.type==="ioList"?"New IO Channel":`New ${modal.label?.replace(/s$/,"")}`):`Edit ${form.tagName}`}</h2></div>
        <p style={{color:DIM,fontSize:10}}>Prefix: <span style={{color:MUT,fontFamily:"monospace"}}>{prefix}-XXX</span></p></div>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"5px 9px",color:MUT,cursor:"pointer"}}>&#10005;</button>
      </div>
      <div style={{background:CRD,border:`1px solid ${color}44`,borderRadius:8,padding:13,marginBottom:14}}>
        <label style={{fontSize:10,color,textTransform:"uppercase",letterSpacing:"0.1em",display:"block",marginBottom:5,fontWeight:600}}>Tag Name *</label>
        <input value={form.tagName||""} onChange={e=>onChange("tagName",e.target.value.toUpperCase())} placeholder={`e.g. ${prefix}-001`}
          style={{width:"100%",background:SRF,border:`1px solid ${errs.tagName?DNG:BDR2}`,borderRadius:6,padding:"8px 12px",color:TXT,fontSize:14,fontFamily:"monospace",fontWeight:700,outline:"none"}}/>
        {errs.tagName&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{errs.tagName}</p>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,flex:1}}>
        {fields.map(f=><div key={f.k} style={{gridColumn:f.t==="area"?"span 2":"span 1"}}><FI f={f} val={form[f.k]||""} err={errs[f.k]} onChange={v=>onChange(f.k,v)}/></div>)}
      </div>
      <div style={{display:"flex",gap:7,justifyContent:"flex-end",paddingTop:15,marginTop:15,borderTop:`1px solid ${BDR}`,flexShrink:0}}>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 15px",color:MUT,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Cancel</button>
        <button onClick={onSave} style={{background:color,border:"none",borderRadius:7,padding:"7px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ {modal.mode==="add"?"Add":"Save Changes"}</button>
      </div>
    </div>
  </div>);
}

function App(){
  const[project,setProject]=useState(loadProj);
  const[editP,setEditP]=useState(false);
  const[tmpP,setTmpP]=useState("");
  const[db,setDb]=useState(loadDb);
  const[ioList,setIo]=useState(loadIo);
  const[view,setView]=useState(null);
  const[sigF,setSigF]=useState("All");
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[errs,setErrs]=useState({});
  const[q,setQ]=useState("");
  const[stF,setStF]=useState("All");
  const[sort,setSort]=useState({k:"tagName",d:"asc"});
  const[toast,setToast]=useState(null);
  const[delC,setDel]=useState(null);
  const mRef=useRef(null),iRef=useRef(null);

  React.useEffect(()=>{try{localStorage.setItem("aquabase_db_v3",JSON.stringify(db));}catch{}},[db]);
  React.useEffect(()=>{try{localStorage.setItem("aquabase_io_v3",JSON.stringify(ioList));}catch{}},[ioList]);
  React.useEffect(()=>{try{localStorage.setItem("aquabase_proj_v3",project);}catch{}},[project]);

  const allTags=useMemo(()=>[...Object.values(db).flat().map(e=>e.tagName?.toUpperCase()),...ioList.map(e=>e.tagName?.toUpperCase())],[db,ioList]);
  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);},[]);
  const openAdd=t=>{setForm(t==="ioList"?{iacStatus:"Defined"}:{status:"Active"});setErrs({});setModal({mode:"add",type:t,label:t==="ioList"?"IO Channel":EQ[t]?.label});};
  const openEdit=(t,item,idx)=>{setForm({...item});setErrs({});setModal({mode:"edit",type:t,item,idx,label:t==="ioList"?"IO Channel":EQ[t]?.label});};
  const closeModal=()=>{setModal(null);setForm({});setErrs({});};
  const validate=()=>{const e={},tag=(form.tagName||"").trim().toUpperCase();if(!tag){e.tagName="Tag name is required";}else{const others=modal.mode==="edit"?allTags.filter(t=>t!==modal.item?.tagName?.toUpperCase()):allTags;if(others.includes(tag))e.tagName="Tag name already exists";}const fields=modal.type==="ioList"?IOF:EQ[modal.type].fields;fields.forEach(f=>{if(f.req&&!form[f.k]?.trim())e[f.k]=`${f.l} is required`;});setErrs(e);return!Object.keys(e).length;};
  const saveItem=()=>{if(!validate())return;const item={...form,tagName:(form.tagName||"").trim().toUpperCase()};if(modal.type==="ioList"){setIo(p=>{const l=[...p];if(modal.mode==="add")l.push(item);else l[modal.idx]=item;return l;});}else{setDb(p=>{const l=[...p[modal.type]];if(modal.mode==="add")l.push(item);else l[modal.idx]=item;return{...p,[modal.type]:l};});}showToast(modal.mode==="add"?`${item.tagName} added`:`${item.tagName} updated`);closeModal();};
  const confirmDel=()=>{const{type,idx,tag}=delC;if(type==="ioList")setIo(p=>{const l=[...p];l.splice(idx,1);return l;});else setDb(p=>{const l=[...p[type]];l.splice(idx,1);return{...p,[type]:l};});showToast(`${tag} removed`,"info");setDel(null);};

  const exportMech=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["AQUABASE \u2014 MECHANICS"],["Project:",project],["Exported:",new Date().toLocaleString()],[],["Type","Count"],...MK.map(k=>[EQ[k].label,db[k].length])]),"Summary");MK.forEach(k=>{const items=db[k];if(!items.length)return;const h=["Tag Name",...EQ[k].fields.map(f=>f.l)],r=items.map(i=>[i.tagName,...EQ[k].fields.map(f=>i[f.k]??"")]);const ws=XLSX.utils.aoa_to_sheet([h,...r]);ws["!cols"]=h.map((_,i)=>({wch:i===0?14:i===1?28:16}));XLSX.utils.book_append_sheet(wb,ws,EQ[k].label.substring(0,31));});XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_MECHANICS.xlsx`);showToast("Mechanics exported");};
  const exportIac=()=>{const wb=XLSX.utils.book_new();const h=["Tag Name",...IOF.map(f=>f.l)],r=ioList.map(i=>[i.tagName,...IOF.map(f=>i[f.k]??"")]);const ws=XLSX.utils.aoa_to_sheet([h,...r]);ws["!cols"]=h.map((_,i)=>({wch:i===0?14:i===1?30:16}));XLSX.utils.book_append_sheet(wb,ws,"IO List");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["AQUABASE \u2014 I&C IO LIST"],["Project:",project],["Exported:",new Date().toLocaleString()]]),"Summary");XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_IAC_IOList.xlsx`);showToast("I&C IO List exported");};

  const importMech=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"binary"}),nd={...db};let a=0,s=0;const ct=new Set(allTags);MK.forEach(k=>{const sh=wb.SheetNames.find(n=>n.toLowerCase().includes(EQ[k].label.toLowerCase().slice(0,5)));if(!sh)return;const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});if(rows.length<2)return;const hd=rows[0];rows.slice(1).forEach(row=>{if(!row[0])return;const tag=String(row[0]).toUpperCase().trim();if(ct.has(tag)){s++;return;}const item={tagName:tag};hd.forEach((h,i)=>{if(h==="Tag Name")return;const field=EQ[k].fields.find(f=>f.l===h);if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";});nd[k].push(item);ct.add(tag);a++;});});setDb(nd);showToast(`Mechanics: ${a} added${s?`, ${s} skipped`:""}`,a?"success":"warning");}catch{showToast("Import failed","error");}};reader.readAsBinaryString(file);e.target.value="";};
  const importIac=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"binary"});const sh=wb.SheetNames.find(n=>n.toLowerCase().includes("io"));if(!sh){showToast("No IO List sheet found","error");return;}const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});if(rows.length<2)return;const hd=rows[0];let a=0,s=0;const ct=new Set(allTags);const ni=[...ioList];rows.slice(1).forEach(row=>{if(!row[0])return;const tag=String(row[0]).toUpperCase().trim();if(ct.has(tag)){s++;return;}const item={tagName:tag};hd.forEach((h,i)=>{if(h==="Tag Name")return;const field=IOF.find(f=>f.l===h);if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";});ni.push(item);ct.add(tag);a++;});setIo(ni);showToast(`I&C: ${a} channels added${s?`, ${s} skipped`:""}`,a?"success":"warning");}catch{showToast("Import failed","error");}};reader.readAsBinaryString(file);e.target.value="";};

  const dispEq=useMemo(()=>{if(!view||view==="ioList")return[];let l=[...db[view]];if(q){const lq=q.toLowerCase();l=l.filter(i=>Object.values(i).some(v=>String(v).toLowerCase().includes(lq)));}if(stF!=="All")l=l.filter(i=>i.status===stF);l.sort((a,b)=>{const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);});return l;},[view,db,q,stF,sort]);
  const dispIo=useMemo(()=>{if(view!=="ioList")return[];let l=[...ioList];if(q){const lq=q.toLowerCase();l=l.filter(i=>Object.values(i).some(v=>String(v).toLowerCase().includes(lq)));}if(sigF!=="All")l=l.filter(i=>i.signalType===sigF);if(stF!=="All")l=l.filter(i=>i.iacStatus===stF);l.sort((a,b)=>{const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);});return l;},[view,ioList,q,sigF,stF,sort]);

  const navTo=(k,sf=null)=>{setView(k);setQ("");setStF("All");setSort({k:"tagName",d:"asc"});setSigF(sf||"All");};
  const mColor=modal?(modal.type==="ioList"?IC:EQ[modal.type]?.color||ACC):ACC;
  const mPrefix=modal?(modal.type==="ioList"?"TAG":EQ[modal.type]?.prefix||"TAG"):"TAG";

  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",background:BG,color:TXT,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}}>
    <header style={{height:54,background:SRF,borderBottom:`1px solid ${BDR}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:30,height:30,background:`linear-gradient(135deg,${ACC},#0369a1)`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>&#128167;</div>
          <div><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:ACC}}>AquaBase</div><div style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em"}}>Equipment Registry</div></div>
        </div>
        <div style={{width:1,height:26,background:BDR}}/>
        {editP?<input autoFocus value={tmpP} onChange={e=>setTmpP(e.target.value)} onBlur={()=>{setProject(tmpP);setEditP(false);}} onKeyDown={e=>{if(e.key==="Enter"){setProject(tmpP);setEditP(false);}if(e.key==="Escape")setEditP(false);}} style={{background:CRD,border:`1px solid ${ACC}`,borderRadius:6,padding:"3px 9px",color:TXT,fontSize:12,fontWeight:500,minWidth:240,outline:"none"}}/>
        :<button onClick={()=>{setTmpP(project);setEditP(true);}} style={{background:"none",border:"none",color:TXT,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"2px 5px",borderRadius:5}}>{project} &#9998;</button>}
      </div>
      <span style={{fontSize:10,color:DIM}}>Use dept Import/Export buttons on Overview</span>
    </header>
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      <nav style={{width:200,background:SRF,borderRight:`1px solid ${BDR}`,overflowY:"auto",flexShrink:0,paddingBottom:12}}>
        <NavItem label="Overview" active={!view} color={ACC} count={Object.values(db).reduce((s,l)=>s+l.length,0)+ioList.length} onClick={()=>setView(null)}/>
        <SecLabel label="Mechanics" color={MC}/>
        {MK.map(k=><NavItem key={k} label={EQ[k].label} active={view===k} color={EQ[k].color} count={db[k].length} onClick={()=>navTo(k)} indent/>)}
        <SecLabel label="I&C" color={IC}/>
        <NavItem label="IO List" active={view==="ioList"} color={IC} count={ioList.length} onClick={()=>navTo("ioList")} indent/>
        {view==="ioList"&&<div style={{padding:"4px 8px 4px 22px"}}>
          {["AI","AO","DI","DO","HART AI","HART AO","Pulse"].map(s=>{const cnt=ioList.filter(i=>i.signalType===s).length;if(!cnt)return null;return(<button key={s} onClick={()=>setSigF(p=>p===s?"All":s)} style={{width:"100%",textAlign:"left",background:"transparent",border:"none",padding:"4px 8px",fontSize:11,cursor:"pointer",fontFamily:"inherit",color:sigF===s?SIGC[s]:DIM,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{display:"flex",alignItems:"center",gap:5}}><Dot color={SIGC[s]} size={6}/>{s}</span><span style={{fontFamily:"monospace",fontSize:10}}>{cnt}</span></button>);})}
        </div>}
      </nav>
      <main style={{flex:1,overflowY:"auto",padding:20,background:BG}}>
        {!view?<Overview db={db} ioList={ioList} onNav={navTo} onMI={importMech} onME={exportMech} onII={importIac} onIE={exportIac} mRef={mRef} iRef={iRef}/>
        :view==="ioList"?<IoTable ioList={ioList} displayed={dispIo} q={q} setQ={setQ} sigF={sigF} setSigF={setSigF} stF={stF} setStF={setStF} sort={sort} setSort={setSort} onAdd={()=>openAdd("ioList")} onEdit={(item,idx)=>openEdit("ioList",item,idx)} onDel={(item,idx)=>setDel({type:"ioList",idx,tag:item.tagName})}/>
        :<EqTable type={view} cfg={EQ[view]} allItems={db[view]} displayed={dispEq} q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort} onAdd={()=>openAdd(view)} onEdit={(item,idx)=>openEdit(view,item,idx)} onDel={(item,idx)=>setDel({type:view,idx,tag:item.tagName})}/>}
      </main>
    </div>
    {modal&&<Modal modal={modal} color={mColor} prefix={mPrefix} fields={modal.type==="ioList"?IOF:EQ[modal.type].fields} form={form} errs={errs} onChange={(k,v)=>{setForm(p=>({...p,[k]:v}));if(errs[k])setErrs(p=>({...p,[k]:null}));}} onSave={saveItem} onClose={closeModal}/>}
    {delC&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}><div style={{background:CRD,border:`1px solid ${DNG}55`,borderRadius:11,padding:22,maxWidth:360,width:"92%"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}><span style={{fontSize:18,color:DNG}}>&#128465;</span><h3 style={{color:DNG,fontSize:15,fontWeight:600}}>Delete Item</h3></div><p style={{color:MUT,fontSize:13,lineHeight:1.6,marginBottom:18}}>Permanently remove <strong style={{color:TXT,fontFamily:"monospace"}}>{delC.tag}</strong>?</p><div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button onClick={()=>setDel(null)} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button><button onClick={confirmDel} style={{background:DNG,border:"none",borderRadius:7,padding:"7px 15px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Delete</button></div></div></div>}
    {toast&&<div style={{position:"fixed",bottom:18,right:18,background:toast.type==="error"?DNG:toast.type==="info"?ACC:toast.type==="warning"?WRN:SUC,color:"#fff",padding:"10px 16px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:900,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:7}}>{toast.msg}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
