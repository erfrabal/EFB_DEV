function FieldInput({f,val,err,onChange}){
  const style=S({border:`1px solid ${err?DNG:BDR2}`});
  return(<div>
    <label style={{fontSize:10,color:err?DNG:DIM,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4,fontWeight:600}}>{f.l}{f.req?" *":""}</label>
    {f.t==="sel"?<select value={val} onChange={e=>onChange(e.target.value)} style={{...style,cursor:"pointer"}}><option value="">— Select —</option>{f.o.map(o=><option key={o} value={o}>{o}</option>)}</select>

                      <label style={{fontSize:9,color:DIM,display:"block",marginBottom:2,fontWeight:600,textTransform:"uppercase"}}>Connection</label>
                      <select value={sig.commMethod} onChange={e=>updSig(v.id,"commMethod",e.target.value)} style={S({cursor:"pointer",padding:"5px 7px"})}>

                    </div>

}

/* ─── Tabbed Item Modal ─── */
function ItemModal({def,typeKey,dept,modal,form,errs,onChange,onSave,onClose}){
  const color=def?.color||ACC;
  const hasTabs=dept==="mech"&&["pump","motor","valve","solenoid"].includes(typeKey);
  const tabs=[];
  if(hasTabs){
    tabs.push("general");
    if(typeKey==="pump"||typeKey==="motor") tabs.push("probes");
    if(typeKey==="motor"||typeKey==="valve"||typeKey==="solenoid") tabs.push("controller");
  }
  const[tab,setTab]=useState("general");

  const updateProbes=v=>onChange("probes",v);
  const updateCtrl=(k,v)=>onChange(k,v);
  const instanceTag=fullTag(form.tagName,form.area,"");
  const TAB_LABELS={general:"General",probes:"Probes",controller:"Controller & IO Signals"};

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",display:"flex",alignItems:"stretch",justifyContent:"flex-end",zIndex:400}} onClick={onClose}>
    <div style={{background:SRF,width:720,maxWidth:"96vw",overflowY:"auto",borderLeft:`3px solid ${color}`,display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
      {/* Modal header */}
      <div style={{padding:"18px 22px 0",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
              <Dot color={color} size={10}/>
              <h2 style={{fontFamily:"monospace",fontWeight:700,fontSize:16,color}}>{modal.mode==="add"?`New ${def?.label?.replace(/s$/,"")}`:`Edit ${form.tagName}`}</h2>
            </div>
            <div style={{display:"flex",gap:12,fontSize:10,color:DIM}}>
              <span>Prefix: <span style={{color:MUT,fontFamily:"monospace"}}>{def?.prefix}-XXX</span></span>
              {form.tagName&&form.area&&<span>Instance tag: <span style={{color:ACC,fontFamily:"monospace"}}>{instanceTag.replace(/-$/,"")}</span></span>}
            </div>
          </div>
          <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:7,padding:"5px 9px",color:MUT,cursor:"pointer",display:"flex",alignItems:"center"}}><X size={14}/></button>
        </div>

        {/* Tag Name always visible */}
        <div style={{background:CRD,border:`1px solid ${color}44`,borderRadius:8,padding:13,marginBottom:hasTabs?0:14}}>
          <label style={{fontSize:10,color,textTransform:"uppercase",letterSpacing:"0.1em",display:"block",marginBottom:5,fontWeight:600}}>Tag Name *</label>
          <input value={form.tagName||""} onChange={e=>onChange("tagName",e.target.value.toUpperCase())}
            placeholder={`e.g. ${def?.prefix}-001`}
            style={{width:"100%",background:SRF,border:`1px solid ${errs.tagName?DNG:BDR2}`,borderRadius:6,padding:"8px 12px",color:TXT,fontSize:14,fontFamily:"monospace",fontWeight:700,outline:"none"}}/>
          {errs.tagName&&<p style={{color:DNG,fontSize:11,marginTop:4}}>{errs.tagName}</p>}
        </div>

        {/* Tabs */}
        {hasTabs&&(
          <div style={{display:"flex",gap:2,marginTop:12,borderBottom:`1px solid ${BDR}`}}>
            {tabs.map(t=>(
              <button key={t} onClick={()=>setTab(t)}
                style={{background:"none",border:"none",borderBottom:`2px solid ${tab===t?color:"transparent"}`,padding:"8px 14px",color:tab===t?color:DIM,fontSize:12,fontWeight:tab===t?600:400,cursor:"pointer",fontFamily:"inherit",marginBottom:-1}}>
                {TAB_LABELS[t]}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Modal body */}
      <div style={{flex:1,overflowY:"auto",padding:"16px 22px"}}>
        {(!hasTabs||tab==="general")&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
            {def?.fields?.map(f=>(
              <div key={f.k} style={{gridColumn:f.t==="area"?"span 2":"span 1"}}>
                <FieldInput f={f} val={form[f.k]||""} err={errs[f.k]} onChange={v=>onChange(f.k,v)}/>
              </div>
            ))}
          </div>
        )}
        {hasTabs&&tab==="probes"&&(
          <ProbesPanel probes={form.probes||[]} setProbes={updateProbes} tagName={form.tagName} area={form.area}/>
        )}
        {hasTabs&&tab==="controller"&&(
          <ControllerPanel typeKey={typeKey} form={form} onChange={updateCtrl}/>
        )}
      </div>

      {/* Footer */}
      <div style={{display:"flex",gap:7,justifyContent:"flex-end",padding:"14px 22px",borderTop:`1px solid ${BDR}`,flexShrink:0}}>
        <button onClick={onClose} style={{background:CRD,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 15px",color:MUT,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Cancel</button>
        <button onClick={onSave} style={{background:color,border:"none",borderRadius:7,padding:"7px 20px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}>
          <Plus size={13}/>{modal.mode==="add"?"Add":"Save Changes"}
        </button>
      </div>
    </div>
  </div>);
}

/* ─── I&C Probes View ─── */
function ProbesView({mechDb,probeAssignments,onUpdateAssignment}){
  const[hovRow,setHov]=useState(null);
  const[editProbe,setEditProbe]=useState(null);
  const[editForm,setEditForm]=useState({});

  const allProbes=[];
  ["motor","pump"].forEach(k=>{
    (mechDb[k]||[]).forEach(equip=>{
      (equip.probes||[]).forEach(probe=>{
        const tag=fullTag(equip.tagName,equip.area,probe.code);
        const assignment=probeAssignments[tag]||{};
        allProbes.push({...probe,equipTag:equip.tagName,area:equip.area,equipType:k,fullTag:tag,assignment});
      });
    });
  });

  const openEdit=p=>{setEditProbe(p);setEditForm({...p.assignment});};
  const saveAssignment=()=>{
    onUpdateAssignment(editProbe.fullTag,editForm);
    setEditProbe(null);setEditForm({});
  };

  const PROBE_IO_FIELDS=[
    {k:"signalType",l:"Signal Type",t:"sel",o:["AI","AO","DI","DO"]},
    {k:"plcCabinet",l:"PLC / Cabinet",t:"text"},
    {k:"ioRack",l:"Rack",t:"text"},
    {k:"ioSlot",l:"Slot / Module",t:"text"},
    {k:"ioChannel",l:"Channel Address",t:"text"},
    {k:"ioTag",l:"IO Tag",t:"text"},
  ];

  return(<div>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
          <Activity size={16} color={IC}/>
          <h1 style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:TXT}}>Machine Probes</h1>
          <span style={{fontSize:10,color:IC,background:`${IC}18`,padding:"2px 8px",borderRadius:5,fontWeight:600}}>I&C</span>
        </div>
        <p style={{color:DIM,fontSize:11}}>{allProbes.length} probes defined by Mechanics · assign IO channel below</p>
      </div>
    </div>

    {allProbes.length===0?(
      <div style={{textAlign:"center",padding:"48px 20px",color:DIM}}>
        <Activity size={40} color={BDR2} style={{display:"block",margin:"0 auto 12px"}}/>
        <div style={{color:MUT,fontSize:14}}>No probes defined yet</div>
        <div style={{color:DIM,fontSize:12,marginTop:4}}>Go to Mechanics → Motors / Pumps → add probes on any instance</div>
      </div>
    ):(
    <div style={{background:CRD,border:`1px solid ${BDR}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{background:SRF,borderBottom:`1px solid ${BDR}`}}>
          {["Full Probe Tag","Equipment","Area","Probe Type","Position","Sensor","Signal","IO Tag","Cabinet","Ch.","Action"].map(h=>(
            <th key={h} style={{padding:"8px 11px",textAlign:"left",fontSize:10,color:DIM,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>{allProbes.map((p,di)=>{
          const a=p.assignment;const hasIO=a.ioTag||a.plcCabinet;
          return(<tr key={p.fullTag} onMouseEnter={()=>setHov(di)} onMouseLeave={()=>setHov(null)} style={{borderBottom:`1px solid ${BDR}`,background:hovRow===di?`${CRD}bb`:"transparent"}}>
            <td style={{padding:"9px 11px",fontFamily:"monospace",fontSize:12,fontWeight:600,color:IC,whiteSpace:"nowrap"}}>{p.fullTag}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT,fontFamily:"monospace"}}>{p.equipTag}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT}}>{p.area||"—"}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:TXT,whiteSpace:"nowrap"}}>{p.type}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT,whiteSpace:"nowrap"}}>{p.position}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT}}>{p.sensorType}</td>
            <td style={{padding:"9px 11px"}}>{a.signalType?<Badge label={a.signalType} color={SIGC[a.signalType]||MUT} bg={`${SIGC[a.signalType]||MUT}20`}/>:<span style={{color:BDR2}}>—</span>}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:ACC,fontFamily:"monospace"}}>{a.ioTag||<span style={{color:BDR2}}>—</span>}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT}}>{a.plcCabinet||<span style={{color:BDR2}}>—</span>}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:MUT,fontFamily:"monospace"}}>{a.ioChannel||<span style={{color:BDR2}}>—</span>}</td>
            <td style={{padding:"9px 11px",whiteSpace:"nowrap"}}>
              <button onClick={()=>openEdit(p)} style={{background:`${hasIO?SUC:IC}18`,border:`1px solid ${hasIO?SUC:IC}44`,borderRadius:5,padding:"4px 8px",color:hasIO?SUC:IC,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                {hasIO?"Edit IO":"Assign IO"}
              </button>
            </td>
          </tr>);
        })}</tbody>
      </table></div>
      <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM}}>
        {allProbes.filter(p=>p.assignment.ioTag).length} of {allProbes.length} probes have IO assigned
      </div>
    </div>
    )}

    {/* IO Assignment mini modal */}
    {editProbe&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}} onClick={()=>setEditProbe(null)}>
        <div style={{background:CRD,border:`1px solid ${IC}55`,borderRadius:12,padding:22,width:480,maxWidth:"92vw"}} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <h3 style={{color:IC,fontFamily:"monospace",fontSize:14,fontWeight:700,marginBottom:2}}>Assign IO — {editProbe.fullTag}</h3>
              <p style={{color:DIM,fontSize:11}}>{editProbe.type} · {editProbe.position} · {editProbe.sensorType}</p>
            </div>
            <button onClick={()=>setEditProbe(null)} style={{background:"none",border:"none",color:MUT,cursor:"pointer"}}><X size={14}/></button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:16}}>
            {PROBE_IO_FIELDS.map(f=>(
              <div key={f.k}>
                <label style={{fontSize:10,color:DIM,textTransform:"uppercase",letterSpacing:"0.07em",display:"block",marginBottom:4,fontWeight:600}}>{f.l}</label>
                {f.t==="sel"
                  ?<select value={editForm[f.k]||""} onChange={e=>setEditForm(p=>({...p,[f.k]:e.target.value}))} style={S({cursor:"pointer"})}><option value="">—</option>{f.o.map(o=><option key={o} value={o}>{o}</option>)}</select>
                  :<input value={editForm[f.k]||""} onChange={e=>setEditForm(p=>({...p,[f.k]:e.target.value}))} style={S()}/>}
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
            <button onClick={()=>setEditProbe(null)} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
            <button onClick={saveAssignment} style={{background:IC,border:"none",borderRadius:7,padding:"7px 16px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Save Assignment</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

                {sigCount>0&&<span style={{fontSize:9,color:ACC,background:`${ACC}18`,padding:"1px 5px",borderRadius:3}}>{sigCount} signals</span>}
              </div>
            </td>
            <td style={{padding:"10px 11px",fontSize:12,color:ACC,fontFamily:"monospace"}}>{item.area||<span style={{color:BDR2}}>—</span>}</td>
            {sumFields.map(f=>{
              const v=item[f.k];const sigC=SIGC[v];
              if(f.k==="signalType"&&v&&sigC)return<td key={f.k} style={{padding:"10px 11px"}}><Badge label={v} color={sigC} bg={`${sigC}20`}/></td>;
              if(f.k==="ioTag"&&v)return<td key={f.k} style={{padding:"10px 11px",fontSize:12,color:ACC,fontFamily:"monospace",fontWeight:600}}>{v}</td>;
              return<td key={f.k} style={{padding:"10px 11px",fontSize:12,color:MUT,maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v||<span style={{color:BDR2}}>—</span>}</td>;
            })}
            <td style={{padding:"10px 11px"}}>{item.status?<Badge label={item.status} color={sc.c} bg={sc.b}/>:<span style={{color:BDR2}}>—</span>}</td>
            <td style={{padding:"10px 11px",textAlign:"right",whiteSpace:"nowrap"}}>
              <button onClick={()=>onEdit(item,ri)} style={{background:"transparent",border:`1px solid ${BDR2}`,borderRadius:5,padding:"4px 8px",color:MUT,fontSize:11,cursor:"pointer",marginRight:5,fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:3}}><Edit2 size={11}/> Edit</button>
              <button onClick={()=>onDel(item,ri)} style={{background:"transparent",border:`1px solid ${DNG}40`,borderRadius:5,padding:"4px 8px",color:DNG,fontSize:11,cursor:"pointer",fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:3}}><Trash2 size={11}/></button>
            </td>
          </tr>);
        })}</tbody>
      </table></div>
      <div style={{padding:"7px 11px",borderTop:`1px solid ${BDR}`,fontSize:11,color:DIM,display:"flex",justifyContent:"space-between"}}>
        <span>Showing {displayed.length} of {allItems.length}</span>
        <span>{allItems.filter(i=>i.status==="Active").length} active{dept==="iac"?` · ${allItems.filter(i=>i.ioTag).length} IO assigned`:""}</span>
      </div>
    </div>
    )}
  </div>);
}

        </div>
      </div>
      <div style={{display:"flex",gap:7,justifyContent:"flex-end",marginTop:20}}>

        <button onClick={handleAdd} disabled={!name.trim()||!prefix.trim()} style={{background:accent,border:"none",borderRadius:7,padding:"7px 18px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:!name.trim()||!prefix.trim()?0.5:1}}>

/* ─── App ─── */
const initMechDb=()=>Object.fromEntries(MECH_KEYS.map(k=>[k,[]]));
const initIacDb=()=>({...Object.fromEntries(IAC_KEYS.map(k=>[k,[]])),probeAssignments:{}});

function initSignals(typeKey){
  const varList=typeKey==="motor"?MOTOR_VARIANTS:typeKey==="valve"?VALVE_VARIANTS:typeKey==="solenoid"?SOL_VARIANTS:[];
  return Object.fromEntries(varList.map(v=>[v.id,{enabled:false,code:v.code,signalType:v.sigT,commMethod:"Hardwired",protocol:""}]));
}

function App(){
  const[project,setProject]=useState("Water Treatment Plant — Project Alpha");
  const[editP,setEditP]=useState(false);const[tmpP,setTmpP]=useState("");
  const[mechDb,setMechDb]=useState(initMechDb);
  const[iacDb,setIacDb]=useState(initIacDb);
  const[customDefs,setCustomDefs]=useState({mech:{},iac:{}});
  const[view,setView]=useState(null);// null|{dept,typeKey}|"probes"
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[errs,setErrs]=useState({});
  const[q,setQ]=useState("");
  const[stF,setStF]=useState("All");
  const[sort,setSort]=useState({k:"tagName",d:"asc"});
  const[toast,setToast]=useState(null);
  const[delC,setDel]=useState(null);
  const[newTypeDept,setNewTypeDept]=useState(null);
  const mRef=useRef(null),iRef=useRef(null);

  const allTags=useMemo(()=>
    [...Object.values(mechDb).flat(),...Object.values(iacDb).filter(v=>Array.isArray(v)).flat()].map(e=>e.tagName?.toUpperCase()),
    [mechDb,iacDb]);

  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);},[]);

  const getDef=(dept,typeKey)=>{
    if(dept==="mech")return MECH_DEF[typeKey]||(customDefs.mech||{})[typeKey];
    return IAC_DEF[typeKey]||(customDefs.iac||{})[typeKey];
  };
  const getDb=dept=>dept==="mech"?mechDb:iacDb;
  const setDb=(dept,v)=>dept==="mech"?setMechDb(v):setIacDb(v);

  const openAdd=(dept,typeKey)=>{
    setForm({status:"Active",probes:[],controller:{type:"",brand:"",model:"",ipRating:"",cabinet:""},signals:initSignals(typeKey)});
    setErrs({});setModal({mode:"add",dept,typeKey});
  };
  const openEdit=(dept,typeKey,item,idx)=>{
    const sigs={...initSignals(typeKey),...(item.signals||{})};
    setForm({...item,probes:item.probes||[],controller:item.controller||{type:"",brand:"",model:"",ipRating:"",cabinet:""},signals:sigs});
    setErrs({});setModal({mode:"edit",dept,typeKey,item,idx});
  };
  const closeModal=()=>{setModal(null);setForm({});setErrs({});};

  const handleFormChange=(k,v)=>{setForm(p=>({...p,[k]:v}));if(errs[k])setErrs(p=>({...p,[k]:null}));};

  const validate=()=>{
    const e={},tag=(form.tagName||"").trim().toUpperCase();
    if(!tag){e.tagName="Tag name is required";}
    else{const others=modal.mode==="edit"?allTags.filter(t=>t!==modal.item?.tagName?.toUpperCase()):allTags;if(others.includes(tag))e.tagName="Tag name already exists";}
    const def=getDef(modal.dept,modal.typeKey);
    (def?.fields||[]).forEach(f=>{if(f.req&&!form[f.k]?.trim())e[f.k]=`${f.l} is required`;});
    setErrs(e);return!Object.keys(e).length;
  };

  const saveItem=()=>{
    if(!validate())return;
    const item={...form,tagName:(form.tagName||"").trim().toUpperCase()};
    const db=getDb(modal.dept);
    const upd={...db,[modal.typeKey]:[...(db[modal.typeKey]||[])]};
    if(modal.mode==="add")upd[modal.typeKey].push(item);else upd[modal.typeKey][modal.idx]=item;
    setDb(modal.dept,upd);
    showToast(modal.mode==="add"?`${item.tagName} added`:`${item.tagName} updated`);closeModal();
  };

  const confirmDel=()=>{
    const{dept,typeKey,idx,tag}=delC;
    const db=getDb(dept);const upd={...db,[typeKey]:[...(db[typeKey]||[])]};upd[typeKey].splice(idx,1);
    setDb(dept,upd);showToast(`${tag} removed`,"info");setDel(null);
  };

  const addCustomType=(dept,key,def)=>{
    setCustomDefs(p=>({...p,[dept]:{...(p[dept]||{}),[key]:def}}));
    if(dept==="mech")setMechDb(p=>({...p,[key]:[]}));else setIacDb(p=>({...p,[key]:[]}));
    showToast(`${def.label} type created`);
  };

  const updateProbeAssignment=(tag,data)=>{
    setIacDb(p=>({...p,probeAssignments:{...(p.probeAssignments||{}),[tag]:data}}));
    showToast("IO assignment saved");
  };

  /* ─ Exports ─ */
  const exportDept=dept=>{
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const db=getDb(dept);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[`AQUABASE — ${dept==="mech"?"MECHANICS":"I&C"}`],["Project:",project],["Exported:",new Date().toLocaleString()],[],["Type","Count"],...Object.entries(defs).map(([k,d])=>[d.label,(db[k]||[]).length])]),"Summary");
    Object.entries(defs).forEach(([k,def])=>{
      const items=db[k]||[];if(!items.length)return;
      const h=["Tag Name",...def.fields.map(f=>f.l)];
      const r=items.map(i=>[i.tagName,...def.fields.map(f=>i[f.k]??"")]);
      const ws=XLSX.utils.aoa_to_sheet([h,...r]);ws["!cols"]=h.map((_,i)=>({wch:i===0?14:i===1?28:16}));
      XLSX.utils.book_append_sheet(wb,ws,def.label.substring(0,31));
    });
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_${dept==="mech"?"MECHANICS":"IAC"}.xlsx`);
    showToast(`${dept==="mech"?"Mechanics":"I&C"} exported`);
  };

  const exportIOList=()=>{
    const rows=[];
    const header=["Full Signal Tag","Equipment Tag","Area","Dept","Equipment Type","Signal / Probe Name","Code","Signal Type","Connection","Protocol","Controller Type","Controller Brand","Controller Model","Status"];
    // Motor/Valve/Solenoid variants
    ["motor","valve","solenoid"].forEach(k=>{
      const def=MECH_DEF[k];
      (mechDb[k]||[]).forEach(equip=>{
        Object.entries(equip.signals||{}).forEach(([id,sig])=>{
          if(!sig.enabled)return;
          const vDef=(k==="motor"?MOTOR_VARIANTS:k==="valve"?VALVE_VARIANTS:SOL_VARIANTS).find(v=>v.id===id);
          rows.push([
            fullTag(equip.tagName,equip.area,sig.code),
            equip.tagName,equip.area||"",
            "MECH",def.label,
            vDef?.name||id,sig.code,sig.signalType,
            sig.commMethod,sig.commMethod!=="Hardwired"?sig.commMethod:"—",
            equip.controller?.type||"",equip.controller?.brand||"",equip.controller?.model||"",
            equip.status||""
          ]);
        });
      });
    });
    // Machine probes
    const pa=iacDb.probeAssignments||{};
    ["motor","pump"].forEach(k=>{
      (mechDb[k]||[]).forEach(equip=>{
        (equip.probes||[]).forEach(probe=>{
          const tag=fullTag(equip.tagName,equip.area,probe.code);
          const a=pa[tag]||{};
          rows.push([tag,equip.tagName,equip.area||"","MECH/I&C",`${MECH_DEF[k].label} Probe`,probe.type+": "+probe.position,probe.code,a.signalType||"AI","I&C Assignment","—","","","",equip.status||""]);
        });
      });
    });
    // I&C instruments
    const iacDefs={...IAC_DEF,...(customDefs.iac||{})};
    Object.entries(iacDefs).forEach(([k,def])=>{
      (iacDb[k]||[]).forEach(item=>{
        if(!item.ioTag&&!item.signalType)return;
        const tag=fullTag(item.tagName,item.area,item.ioTag||"");
        rows.push([tag,item.tagName,item.area||"","I&C",def.label,item.description||"",item.ioTag||"",item.signalType||"","I&C IO","—","","","",item.status||""]);
      });
    });
    if(!rows.length){showToast("No IO data yet — add equipment with signals/probes first","warning");return;}
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
    ws["!cols"]=header.map((_,i)=>({wch:i===0?24:i===1?12:i===4?20:i===5?28:14}));
    XLSX.utils.book_append_sheet(wb,ws,"IO List");
    const sigs=["AI","AO","DI","DO","HART AI","HART AO","Pulse"];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["AQUABASE — IO LIST"],["Project:",project],["Generated:",new Date().toLocaleString()],[],["Signal Type","Count"],...sigs.map(s=>[s,rows.filter(r=>r[7]===s).length]),["",""],["TOTAL",rows.length]]),"Summary");
    XLSX.writeFile(wb,`${project.replace(/[^a-z0-9]/gi,"_")}_IO_List.xlsx`);
    showToast(`IO List exported — ${rows.length} signals`);
  };

  /* ─ Imports ─ */
  const importDept=(dept,e)=>{
    const file=e.target.files[0];if(!file)return;
    const defs=dept==="mech"?{...MECH_DEF,...(customDefs.mech||{})}:{...IAC_DEF,...(customDefs.iac||{})};
    const reader=new FileReader();
    reader.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:"binary"});let added=0,skipped=0;
      const curTags=new Set(allTags);const db=getDb(dept);const upd={...db};
      Object.entries(defs).forEach(([k,def])=>{
        const sh=wb.SheetNames.find(n=>n.toLowerCase().includes(def.label.toLowerCase().slice(0,5)));if(!sh)return;
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});if(rows.length<2)return;
        const hd=rows[0];if(!upd[k])upd[k]=[];
        rows.slice(1).forEach(row=>{if(!row[0])return;const tag=String(row[0]).toUpperCase().trim();if(curTags.has(tag)){skipped++;return;}
          const item={tagName:tag,probes:[],signals:initSignals(k),controller:{}};
          hd.forEach((h,i)=>{if(h==="Tag Name")return;const field=def.fields.find(f=>f.l===h);if(field)item[field.k]=row[i]!==undefined?String(row[i]):"";});
          upd[k].push(item);curTags.add(tag);added++;});
      });
      setDb(dept,upd);showToast(`${added} added${skipped?`, ${skipped} skipped`:""}`,added?"success":"warning");
    }catch{showToast("Import failed","error");}};
    reader.readAsBinaryString(file);e.target.value="";
  };

  /* ─ Displayed items ─ */
  const currentDef=view&&view!=="probes"?getDef(view.dept,view.typeKey):null;
  const currentItems=view&&view!=="probes"?(getDb(view.dept)[view.typeKey]||[]):[];
  const displayed=useMemo(()=>{
    if(!view||view==="probes")return[];
    let list=[...currentItems];
    if(q){const lq=q.toLowerCase();list=list.filter(i=>Object.values(i).some(v=>typeof v==="string"&&v.toLowerCase().includes(lq)));}
    if(stF!=="All")list=list.filter(i=>i.status===stF);
    list.sort((a,b)=>{const av=String(a[sort.k]??""),bv=String(b[sort.k]??"");return sort.d==="asc"?av.localeCompare(bv):bv.localeCompare(av);});
    return list;
  },[view,currentItems,q,stF,sort]);

  const navTo=(dept,typeKey)=>{setView({dept,typeKey});setQ("");setStF("All");setSort({k:"tagName",d:"asc"});};
  const mechDefs={...MECH_DEF,...(customDefs.mech||{})};
  const iacDefs={...IAC_DEF,...(customDefs.iac||{})};
  const totalProbes=["motor","pump"].reduce((s,k)=>s+(mechDb[k]||[]).reduce((ss,e)=>ss+(e.probes||[]).length,0),0);

  return(<div style={{display:"flex",flexDirection:"column",height:"100vh",background:BG,color:TXT,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}}>
    <style>{`*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:${SRF}}::-webkit-scrollbar-thumb{background:${BDR2};border-radius:3px}::-webkit-scrollbar-thumb:hover{background:${ACC}}select option{background:${CRD}}`}</style>

    {/* HEADER */}
    <header style={{height:54,background:SRF,borderBottom:`1px solid ${BDR}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:30,height:30,background:`linear-gradient(135deg,${ACC},#0369a1)`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}><Droplets size={16} color="#fff"/></div>
          <div><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:ACC}}>AquaBase</div><div style={{fontSize:9,color:DIM,textTransform:"uppercase",letterSpacing:"0.12em"}}>Equipment Registry</div></div>
        </div>
        <div style={{width:1,height:26,background:BDR}}/>
        {editP?<input autoFocus value={tmpP} onChange={e=>setTmpP(e.target.value)} onBlur={()=>{setProject(tmpP);setEditP(false);}} onKeyDown={e=>{if(e.key==="Enter"){setProject(tmpP);setEditP(false);}if(e.key==="Escape")setEditP(false);}} style={{background:CRD,border:`1px solid ${ACC}`,borderRadius:6,padding:"3px 9px",color:TXT,fontSize:12,fontWeight:500,minWidth:240,outline:"none"}}/>
        :<button onClick={()=>{setTmpP(project);setEditP(true);}} style={{background:"none",border:"none",color:TXT,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"2px 5px",borderRadius:5}}>{project}<Pencil size={11} color={DIM}/></button>}
      </div>
      <span style={{fontSize:10,color:DIM}}>IO List = generated from variants & probes</span>
    </header>

    {/* BODY */}
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* SIDEBAR */}
      <nav style={{width:210,background:SRF,borderRight:`1px solid ${BDR}`,overflowY:"auto",flexShrink:0,paddingBottom:16}}>
        <NavItem label="Overview" active={!view} color={ACC} count={[...Object.values(mechDb),...Object.values(iacDb).filter(v=>Array.isArray(v))].flat().length} onClick={()=>setView(null)}/>
        <SecLabel label="Mechanics" color={MC}/>
        {Object.entries(mechDefs).map(([k,def])=>(
          <NavItem key={k} label={def.label} active={view?.typeKey===k&&view?.dept==="mech"} color={def.color} count={mechDb[k]?.length||0} onClick={()=>navTo("mech",k)} indent italic={def.custom}/>
        ))}
        <button onClick={()=>setNewTypeDept("mech")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${MC}33`,borderRadius:6,padding:"4px",color:MC,fontSize:10,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><Plus size={10}/> New type</button>
        <SecLabel label="I&C" color={IC}/>
        {Object.entries(iacDefs).map(([k,def])=>(
          <NavItem key={k} label={def.label} active={view?.typeKey===k&&view?.dept==="iac"} color={def.color} count={iacDb[k]?.length||0} onClick={()=>navTo("iac",k)} indent italic={def.custom}/>
        ))}
        <NavItem label="Machine Probes" active={view==="probes"} color="#06b6d4" count={totalProbes} onClick={()=>setView("probes")} indent/>
        <button onClick={()=>setNewTypeDept("iac")} style={{width:"calc(100% - 16px)",margin:"4px 8px",background:"transparent",border:`1px dashed ${IC}33`,borderRadius:6,padding:"4px",color:IC,fontSize:10,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><Plus size={10}/> New type</button>
      </nav>

      {/* MAIN */}
      <main style={{flex:1,overflowY:"auto",padding:20,background:BG}}>
        {!view&&<Overview mechDb={mechDb} iacDb={iacDb} customDefs={customDefs} onNav={navTo} onAddType={dept=>setNewTypeDept(dept)} onMI={e=>importDept("mech",e)} onME={()=>exportDept("mech")} onII={e=>importDept("iac",e)} onIE={()=>exportDept("iac")} onExportIO={exportIOList} mRef={mRef} iRef={iRef}/>}
        {view==="probes"&&<ProbesView mechDb={mechDb} probeAssignments={iacDb.probeAssignments||{}} onUpdateAssignment={updateProbeAssignment}/>}
        {view&&view!=="probes"&&<EqTable dept={view.dept} typeKey={view.typeKey} def={currentDef} allItems={currentItems} displayed={displayed} q={q} setQ={setQ} stF={stF} setStF={setStF} sort={sort} setSort={setSort} onAdd={()=>openAdd(view.dept,view.typeKey)} onEdit={(item,idx)=>openEdit(view.dept,view.typeKey,item,idx)} onDel={(item,idx)=>setDel({dept:view.dept,typeKey:view.typeKey,idx,tag:item.tagName})}/>}
      </main>
    </div>

    {modal&&<ItemModal def={getDef(modal.dept,modal.typeKey)} typeKey={modal.typeKey} dept={modal.dept} modal={modal} form={form} errs={errs} onChange={handleFormChange} onSave={saveItem} onClose={closeModal}/>}
    {newTypeDept&&<NewTypeModal dept={newTypeDept} onAdd={(key,def)=>addCustomType(newTypeDept,key,def)} onClose={()=>setNewTypeDept(null)}/>}
    {delC&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}>
      <div style={{background:CRD,border:`1px solid ${DNG}55`,borderRadius:11,padding:22,maxWidth:360,width:"92%"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}><Trash2 size={18} color={DNG}/><h3 style={{color:DNG,fontSize:15,fontWeight:600}}>Delete Item</h3></div>
        <p style={{color:MUT,fontSize:13,lineHeight:1.6,marginBottom:18}}>Permanently remove <strong style={{color:TXT,fontFamily:"monospace"}}>{delC.tag}</strong>?</p>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
          <button onClick={()=>setDel(null)} style={{background:SRF,border:`1px solid ${BDR2}`,borderRadius:7,padding:"7px 14px",color:MUT,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
          <button onClick={confirmDel} style={{background:DNG,border:"none",borderRadius:7,padding:"7px 15px",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>
        </div>
      </div>
    </div>}
    {toast&&<div style={{position:"fixed",bottom:18,right:18,background:toast.type==="error"?DNG:toast.type==="info"?ACC:toast.type==="warning"?WRN:SUC,color:"#fff",padding:"10px 16px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.5)",zIndex:900,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:7}}>
      {toast.type==="error"||toast.type==="warning"?<AlertTriangle size={15}/>:<CheckCircle size={15}/>}{toast.msg}
    </div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
